<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 2 Pedro | Clube da Bíblia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Lato', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #020617; color: #f1f5f9; overflow-x: hidden; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.2); transition: all 0.4s ease; }
        .sky-glow { text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        .option-btn { transition: all 0.3s ease; }
        .option-btn:hover:not(:disabled) { transform: translateX(5px); background-color: rgba(14, 165, 233, 0.15); border-color: #0ea5e9; }
        .option-correct { background-color: rgba(16, 185, 129, 0.2) !important; border-color: #10b981 !important; color: #34d399 !important; }
        .option-wrong { background-color: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; color: #f87171 !important; }
    </style>
</head>
<body class="font-sans antialiased flex flex-col min-h-screen">

    <canvas id="particles-js"></canvas>

    <nav class="w-full z-50 p-6 flex justify-between items-center relative">
        <a href="index.html" class="group flex items-center gap-2 px-4 py-2 rounded-lg bg-[#070f24] border border-sky-500/50 text-sky-400 hover:bg-sky-500 hover:text-black transition-all">
            <i class="fa-solid fa-chevron-left text-sm group-hover:-translate-x-1 transition-transform"></i>
            <span class="hidden md:inline text-xs uppercase tracking-widest font-bold">Voltar ao Início</span>
        </a>
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-triangle-exclamation text-sky-500 text-xl"></i>
            <span class="font-serif text-white text-lg tracking-widest font-bold">CLUBE DA BÍBLIA</span>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 relative z-10 w-full max-w-3xl mx-auto">
        <div class="glass-card rounded-2xl w-full flex flex-col relative overflow-hidden shadow-[0_0_40px_rgba(56,189,248,0.15)]">
            <div class="h-1 w-full bg-gradient-to-r from-sky-600 via-blue-500 to-cyan-500" id="progressBar"></div>
            
            <div class="p-6 md:p-10 flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-sky-500/20 pb-4">
                    <h1 class="font-serif text-2xl md:text-3xl text-white sky-glow">Quiz: 2 Pedro</h1>
                    <span id="questionCounter" class="bg-sky-950/50 text-sky-300 px-3 py-1 rounded-full text-xs font-bold tracking-widest border border-sky-500/30">1 / 10</span>
                </div>

                <div id="quizContainer">
                    <div id="questionText" class="text-lg md:text-xl text-slate-200 mb-6 font-light leading-relaxed"></div>
                    <div id="optionsContainer" class="space-y-3"></div>
                    <div id="feedbackContainer" class="mt-6 p-4 rounded-lg hidden text-sm leading-relaxed border"></div>

                    <button id="nextBtn" class="mt-8 w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-lg transition uppercase tracking-widest hidden shadow-lg shadow-sky-900/50">
                        Próxima Pergunta <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>

                <div id="resultContainer" class="hidden flex-col items-center text-center py-8">
                    <i class="fa-solid fa-crown text-6xl text-sky-400 mb-4 drop-shadow-[0_0_15px_rgba(56,189,248,0.6)]"></i>
                    <h2 class="font-serif text-3xl text-white mb-2">Vitória em Cristo!</h2>
                    <p class="text-slate-300 text-lg mb-6">Você acertou <span id="finalScore" class="text-sky-400 font-bold text-2xl">0</span> de 10 perguntas.</p>
                    
                    <div class="w-full max-w-sm bg-slate-900/80 p-6 rounded-xl border border-slate-700">
                        <h3 class="text-xs uppercase tracking-widest text-sky-400 mb-4 font-bold">Salvar no Ranking</h3>
                        <form id="rankingForm" class="space-y-4">
                            <input type="hidden" name="acao" value="salvar_quiz_2pedro">
                            <input type="hidden" name="pontos" id="inputPontos" value="0">
                            <input type="hidden" name="acertos" id="inputAcertos" value="0">
                            <input type="text" name="nome" required placeholder="Seu Nome..." class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-2 text-white focus:border-sky-500 focus:outline-none transition text-sm">
                            <button type="submit" class="w-full bg-gradient-to-r from-sky-600 to-blue-500 text-white font-bold py-2 rounded transition uppercase tracking-widest text-xs shadow-lg">Enviar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const questionsPool = [
            {
                q: "Quem é o autor da Segunda Epístola de Pedro, conforme indicado no início da carta?",
                options: [
                    { t: "Simão Pedro, servo e apóstolo", c: true, r: "2 Pedro 1:1 começa com: 'Simão Pedro, servo e apóstolo de Jesus Cristo...'" },
                    { t: "Paulo de Tarso", c: false, r: "Paulo é mencionado na carta como 'nosso amado irmão', mas não é o autor." },
                    { t: "Tiago, irmão do Senhor", c: false, r: "Tiago escreveu sua própria epístola pastoral." },
                    { t: "João, o Presbítero", c: false, r: "João escreveu o Evangelho, três epístolas e o Apocalipse." }
                ]
            },
            {
                q: "O que Pedro diz que nos foi doado pelo divino poder de Deus em 2 Pedro 1:3?",
                options: [
                    { t: "Riquezas materiais e estabilidade terrena.", c: false, r: "Deus nos dá o necessário, mas o foco é celestial." },
                    { t: "Tudo o que diz respeito à vida e à piedade.", c: true, r: "Pelo Seu poder, recebemos todas as ferramentas espirituais necessárias para uma vida dedicada a Ele." },
                    { t: "Apenas sabedoria intelectual teológica.", c: false, r: "O conhecimento divino transcende o intelecto e afeta a prática diária." },
                    { t: "Isenção total de qualquer tribulação terrena.", c: false, r: "As cartas de Pedro são escritas no próprio contexto de provações." }
                ]
            },
            {
                q: "Qual é a primeira virtude a ser acrescentada à fé, de acordo com a escada espiritual de 2 Pedro 1?",
                options: [
                    { t: "Temperança", c: false, r: "A temperança é adicionada posteriormente ao conhecimento." },
                    { t: "Virtude (arete)", c: true, r: "Em 2 Pedro 1:5, a sequência começa com: 'acrescentai à vossa fé a virtude...'" },
                    { t: "Paciência", c: false, r: "A paciência é adicionada após a temperança." },
                    { t: "Amor (Ágape)", c: false, r: "O amor é a coroa que encerra a lista." }
                ]
            },
            {
                q: "Qual é a última virtude mencionada na escada de crescimento espiritual em 2 Pedro 1:7?",
                options: [
                    { t: "Amor (Ágape)", c: true, r: "O amor coroa todas as outras virtudes, sendo o ápice do desenvolvimento espiritual do crente." },
                    { t: "Piedade", c: false, r: "A piedade precede o amor fraternal e o amor divino." },
                    { t: "Ciência (Gnosis)", c: false, r: "O conhecimento é inserido nas fases iniciais do progresso espiritual." },
                    { t: "Amor fraternal (Philadelphia)", c: false, r: "O amor fraternal precede diretamente o amor ágape final." }
                ]
            },
            {
                q: "Em qual evento glorioso do ministério de Jesus Pedro afirma ter sido testemunha ocular da majestade divina?",
                options: [
                    { t: "No batismo de Jesus no Jordão.", c: false, r: "Pedro ainda não seguia Jesus no batismo inicial." },
                    { t: "Na multiplicação dos pães.", c: false, r: "Embora glorioso, o ápice da voz divina foi no monte." },
                    { t: "Na Transfiguração no monte santo.", c: true, r: "Pedro apela para a voz do Pai que ouviu no monte santo: 'Este é o meu Filho amado...'" },
                    { t: "Na cura do cego de Jericó.", c: false, r: "A transfiguração foi o evento específico citado em 2 Pe 1:16-18." }
                ]
            },
            {
                q: "O que Pedro afirma sobre a origem das profecias da Escritura em 2 Pedro 1:21?",
                options: [
                    { t: "Elas foram criadas pela mente e imaginação brilhante dos antigos profetas.", c: false, r: "Nenhuma profecia bíblica tem origem puramente humana." },
                    { t: "Elas dependem estritamente da livre interpretação individual de cada leitor.", c: false, r: "A Escritura não é de particular interpretação." },
                    { t: "Homens santos falaram inspirados pelo Espírito Santo.", c: true, r: "Os autores bíblicos foram movidos e guiados de forma divina pelo Espírito." },
                    { t: "Elas perderam totalmente o valor histórico após o advento da cruz.", c: false, r: "Pelo contrário, Pedro as compara a uma luz segura no escuro." }
                ]
            },
            {
                q: "Quais falsos líderes Pedro prevê que se infiltrariam secretamente na igreja em 2 Pedro 2?",
                options: [
                    { t: "Falsos mestres (pseudodidaskaloi).", c: true, r: "Pedro alerta que assim como houve falsos profetas no passado, haveria falsos mestres no futuro." },
                    { t: "Falsos imperadores romanos.", c: false, r: "O perigo alertado não era político, mas sim espiritual interno." },
                    { t: "Falsos apóstolos vindo de Jerusalém.", c: false, r: "O texto aponta para heresiarcas locais que promovem a libertinagem." },
                    { t: "Filósofos ateus gregos puramente seculares.", c: false, r: "Os enganadores estavam disfarçados de cristãos dentro das congregações." }
                ]
            },
            {
                q: "Qual foi o destino dos anjos rebeldes citado por Pedro em 2 Pedro 2:4?",
                options: [
                    { t: "Foram absolvidos imediatamente por causa do livre-arbítrio.", c: false, r: "Deus não poupou os anjos que pecaram." },
                    { t: "Lançados no Tártaro (inferno), sob cadeias de escuridão.", c: true, r: "Pedro usa o termo Tartaros para designar o abismo escuro onde aguardam o juízo definitivo." },
                    { t: "Permitidos a governar o céu em igualdade cósmica.", c: false, r: "Eles perderam completamente a sua habitação e herança originais." },
                    { t: "Transformados em matéria orgânica inerte.", c: false, r: "Eles continuam existindo sob contenção espiritual e condenação divina." }
                ]
            },
            {
                q: "Quais dois personagens históricos são citados no capítulo 2 como exemplos de pessoas salvas da destruição divina?",
                options: [
                    { t: "Noé e Ló.", c: true, r: "Deus preservou Noé, o pregoeiro da justiça (v.5), e livrou o justo Ló da imoralidade de Sodoma (v.7)." },
                    { t: "Abraão e Isaque.", c: false, r: "Eles não são os exemplos citados por Pedro neste contexto de juízo material cataclísmico." },
                    { t: "Elias e Eliseu.", c: false, r: "Eles viveram em período posterior e não se relacionam com os eventos descritos de Sodoma ou Dilúvio." },
                    { t: "Moisés e Josué.", c: false, r: "Embora salvos, não são os exemplos de libertação no meio do caos citados no capítulo 2." }
                ]
            },
            {
                q: "Qual personagem é lembrado no capítulo 2 por sua ganância e por ter sido repreendido por uma jumenta muda?",
                options: [
                    { t: "Balaão, filho de Beor.", c: true, r: "Pedro aponta a loucura de Balaão, que amou o prêmio da injustiça e foi contido por um animal mudo (2 Pe 2:15-16)." },
                    { t: "Coré.", c: false, r: "Coré liderou uma rebelião contra Moisés, mas não envolve o episódio da jumenta." },
                    { t: "Saul.", c: false, r: "Saul buscou necromancia e desobedeceu, mas Balaão é o profeta ganancioso citado." },
                    { t: "Acabe.", c: false, r: "Acabe foi um rei idólatra de Israel, não o profeta repreendido pela montaria." }
                ]
            },
            {
                q: "O que os escarnecedores dirão ironicamente nos últimos dias, conforme 2 Pedro 3:4?",
                options: [
                    { t: "\"Onde está a promessa da sua vinda?\"", c: true, r: "Eles alegarão que nada mudou no mundo físico desde o início dos tempos para tentar desmentir a volta de Jesus." },
                    { t: "\"A Bíblia foi escrita apenas por imperadores romanos.\"", c: false, r: "Essa é uma teoria da conspiração recente, não o deboche dos céticos antigos." },
                    { t: "\"Jesus nunca existiu de forma física na terra.\"", c: false, r: "Os céticos antigos sabiam da existência histórica de Jesus; eles duvidavam de Seu retorno triunfal." },
                    { t: "\"Toda religião é uma ilusão psicológica.\"", c: false, r: "Os escarnecedores atacavam especificamente a esperança escatológica da Segunda Vinda." }
                ]
            },
            {
                q: "Como Pedro explica a aparente lentidão no cumprimento da promessa do retorno de Cristo?",
                options: [
                    { t: "Deus mudou Seus planos devido à incredulidade da igreja primitiva.", c: false, r: "O plano eterno de Deus permanece imutável." },
                    { t: "O Senhor é longânimo e paciente, dando tempo para que as pessoas se arrependam.", c: true, r: "A aparente demora é, na verdade, a misericórdia de Deus estendendo a oportunidade de salvação (2 Pe 3:9)." },
                    { t: "A ressurreição física de Cristo foi apenas espiritual e já terminou.", c: false, r: "A heresia da vinda consumada no passado é firmemente rejeitada pelo apóstolo." },
                    { t: "O tempo de Deus é menor do que o humano, por isso o atraso.", c: false, r: "Para o Senhor, mil anos são como um dia, mas a paciência é o verdadeiro motivo." }
                ]
            },
            {
                q: "De acordo com 2 Pedro 3:10, como virá o Dia do Senhor no futuro cósmico?",
                options: [
                    { t: "Como um ladrão de noite, de surpresa e purificando a criação pelo fogo.", c: true, r: "O Dia do Senhor será repentino e trará a purificação completa de toda a contaminação terrena." },
                    { t: "Em silêncio invisível que apenas os iniciados perceberão.", c: false, r: "Pedro descreve um evento estrondoso com grande transformação física do cosmos." },
                    { t: "Através de uma reforma política pacífica global promovida pela igreja.", c: false, r: "O julgamento escatológico é uma intervenção divina direta e cataclísmica." },
                    { t: "De forma puramente figurada nas mentes dos devotos.", c: false, r: "A teologia bíblica de Pedro aponta para uma restauração material e real da criação." }
                ]
            },
            {
                q: "Quais escritos apostólicos são comparados por Pedro em igualdade de autoridade com as demais Escrituras?",
                options: [
                    { t: "As cartas do apóstolo Paulo.", c: true, r: "Em 2 Pedro 3:15-16, o autor cita as epístolas paulinas, igualando sua autoridade inspirada à das Escrituras do Antigo Testamento." },
                    { t: "As tradições orais rabínicas.", c: false, r: "As tradições humanas foram combatidas por Jesus e pelos apóstolos." },
                    { t: "Os escritos de filósofos históricos romanos como Sêneca.", c: false, r: "Escritos pagãos não possuem inspiração nem autoridade divina." },
                    { t: "A literatura apócrifa do templo.", c: false, r: "Pedro se concentra no cânon das Escrituras Inspiradas e no testemunho apostólico direto." }
                ]
            },
            {
                q: "Qual é a exortação final de Pedro no encerramento de seu testamento (2 Pedro 3:18)?",
                options: [
                    { t: "Antes crescei na graça e no conhecimento de nosso Senhor e Salvador.", c: true, r: "O antídoto final para não ser arrastado pelo erro dos ímpios é o crescimento constante na comunhão e entendimento de Jesus." },
                    { t: "Isolai-vos completamente da sociedade humana em monastérios.", c: false, r: "A igreja deve ser luz no mundo, não fugir dele de forma isolada." },
                    { t: "Abandonai o estudo de textos difíceis das Escrituras.", c: false, r: "Devemos ler com cuidado, não parar de estudar as passagens complexas." },
                    { t: "Focai exclusivamente no acúmulo de conhecimentos misteriosos.", c: false, r: "O conhecimento deve andar de mãos dadas com a graça e a santidade moral prática." }
                ]
            }
        ];

        // Shuffle questions helper
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Selected pool of exactly 10 questions
        const quizData = shuffle([...questionsPool]).slice(0, 10);

        let currentQ = 0; let score = 0; let answered = false;
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackContainer = document.getElementById('feedbackContainer');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');

        function loadQuestion() {
            answered = false; feedbackContainer.classList.add('hidden'); nextBtn.classList.add('hidden');
            const qData = quizData[currentQ];
            document.getElementById('questionCounter').innerText = `${currentQ + 1} / ${quizData.length}`;
            questionText.innerText = qData.q;
            optionsContainer.innerHTML = '';
            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-lg bg-slate-800/80 border border-slate-600 text-slate-300 text-sm md:text-base';
                btn.innerText = opt.t;
                btn.onclick = () => selectOption(btn, opt);
                optionsContainer.appendChild(btn);
            });
            progressBar.style.width = `${(currentQ / quizData.length) * 100}%`;
        }

        function selectOption(btn, opt) {
            if (answered) return; answered = true;
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
            
            feedbackContainer.classList.remove('hidden', 'bg-red-900/30', 'border-red-500/50', 'bg-green-900/30', 'border-green-500/50');
            if (opt.c) {
                score += 10; btn.classList.add('option-correct');
                feedbackContainer.classList.add('bg-green-900/30', 'border-green-500/50', 'text-green-200');
                feedbackContainer.innerHTML = `<strong>Correto!</strong> ${opt.r}`;
            } else {
                btn.classList.add('option-wrong');
                feedbackContainer.classList.add('bg-red-900/30', 'border-red-500/50', 'text-red-200');
                feedbackContainer.innerHTML = `<strong>Incorreto.</strong> ${opt.r}`;
                buttons.forEach((b, i) => { if(quizData[currentQ].options[i].c) b.classList.add('option-correct'); });
            }
            nextBtn.classList.remove('hidden');
        }

        nextBtn.onclick = () => {
            currentQ++;
            if (currentQ < quizData.length) loadQuestion();
            else showResults();
        };

        function showResults() {
            progressBar.style.width = '100%';
            document.getElementById('quizContainer').classList.add('hidden');
            const res = document.getElementById('resultContainer');
            res.classList.remove('hidden'); res.classList.add('flex');
            document.getElementById('finalScore').innerText = score/10;
            document.getElementById('inputPontos').value = score;
            document.getElementById('inputAcertos').value = score/10;
        }

        document.getElementById('rankingForm').onsubmit = function(e) {
            e.preventDefault();
            const btn = this.querySelector('button'); btn.disabled = true; btn.innerText = "Salvando...";
            fetch('api.php', { method: 'POST', body: new FormData(this) })
            .then(() => window.location.href = 'index.html');
        };

        // Particles - Adaptive Sky Blue
        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<50; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, sx: Math.random()*0.5-0.25, sy: Math.random()*0.5-0.25 });
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "rgba(14, 165, 233, 0.2)";
            particles.forEach(p => { p.x+=p.sx; p.y+=p.sy; if(p.x<0||p.x>canvas.width)p.sx*=-1; if(p.y<0||p.y>canvas.height)p.sy*=-1; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animate);
        }
        animate();
        loadQuestion();
    </script>
</body>
</html>
