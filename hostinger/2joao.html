    <style>
        body { background-color: #050510; color: #e2e8f0; overflow-x: hidden; }
        
        .glass-panel { background: rgba(15, 5, 10, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(251, 113, 133, 0.2); }

        .reveal.active { opacity: 1; transform: translateY(0); }

        .rich-text strong { color: #fecdd3; font-weight: 700; }
        .rich-text .ref { color: #fb7185; font-size: 0.9em; font-family: monospace; background: rgba(251, 113, 133, 0.15); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(251, 113, 133, 0.3); }
        .rich-text h3 { color: #f43f5e; font-weight: bold; margin-top: 2rem; margin-bottom: 0.75rem; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 0.15em; border-bottom: 1px solid rgba(251, 113, 133, 0.3); padding-bottom: 6px; }
        .rich-text ul { list-style-type: none; padding-left: 0; margin-top: 15px; margin-bottom: 20px; }
        .rich-text li { margin-bottom: 15px; line-height: 1.8; text-align: justify; border-left: 3px solid #f43f5e; padding-left: 20px; background: linear-gradient(to right, rgba(251,113,133,0.05), transparent); padding-top: 5px; padding-bottom: 5px; }
        .rich-text p { margin-bottom: 20px; line-height: 2; text-align: justify; font-size: 1.05rem; color: #cbd5e1; }
        .rich-text blockquote { border-left: 4px solid #f43f5e; padding-left: 20px; margin: 20px 0; font-style: italic; color: #fecdd3; background: rgba(251, 113, 133, 0.05); padding: 15px; border-radius: 0 8px 8px 0; }

        @keyframes pop { 50% { transform: scale(1.4); } }

        <div class="relative max-w-4xl w-full flex justify-center">

        </div>

    <script>
        const bibleData = {
            "intro_book": {
                title: "A SEGUNDA CARTA DE JOÃO",
                date: null,
                desc: "<span class='text-xs uppercase tracking-[0.3em] text-rose-400 not-italic block mb-4'>Introdução: Sobre o Livro</span>\"Andar na verdade e no amor, discernindo os falsos mestres.\"",
                blocks: [
                    {
                        title: "A Menor Carta do Novo Testamento",
                        verse: "O ancião à senhora eleita, e a seus filhos, aos quais amo na verdade... (2 Jo 1:1)",
                        exegesis: "<p>A Segunda Epístola de João é um documento de extrema concisão, contendo apenas treze versículos no texto grego original, o que a tornava ideal para ser escrita em uma única folha de papiro. Apesar de sua brevidade, ela carrega uma densidade teológica monumental, atuando como um farol de integridade em uma época de transição e crise espiritual.</p><h3>1. Destinatário Enigmático</h3><ul><li>O autor se identifica simplesmente como o ancião ou presbítero (<i>πρεσβύτερος</i> - Presbyteros - líder maduro ou ancião), indicando sua reconhecida autoridade espiritual na província da Ásia Menor.</li><li>A carta é endereçada à 'senhora eleita' (<i>ἐκλεκτῇ κυρίᾳ</i> - Eklektē Kyria). Historiadores debatem se este termo se refere a uma mulher cristã proeminente e sua família, ou se é uma metáfora personificada para uma igreja local específica e seus membros. Ambas as interpretações ressaltam a profunda afeição apostólica e a necessidade mútua de proteção contra desvios doutrinários.</li></ul><h3>2. O Equilíbrio Perfeito</h3><ul><li>O coração de 2 João reside no entrelaçamento indissolúvel entre a Verdade (<i>ἀλήθεια</i> - Alētheia) e o Amor (<i>ἀγάπη</i> - Agapē).</li><li>O apóstolo ensina que o amor sem verdade é mero sentimentalismo cego e complacente, enquanto a verdade sem amor se degenera em ortodoxia fria, implacável e destrutiva. O verdadeiro discipulado opera na tensão santa entre acolher o irmão e defender a sã doutrina.</li></ul>"
                    }
                ]
            },
            "intro_author": {
                title: "SOBRE O AUTOR",
                date: null,
                desc: "\"O Ancião, testemunha ocular da glória manifestada...\"",
                blocks: [
                    {
                        title: "João, o Discípulo Amado",
                        verse: "E agora, senhora, rogo-te, não como escrevendo-te um novo mandamento, mas aquele mesmo que desde o princípio tivemos: que nos amemos uns aos outros. (2 Jo 1:5)",
                        exegesis: "<p>A tradição cristã primitiva é unânime em atribuir esta epístola ao Apóstolo João, o mesmo autor do quarto Evangelho, de Apocalipse e das outras duas epístolas que levam seu nome. Escrevendo em sua velhice avançada a partir de Éfeso, João se posiciona como um pai espiritual zeloso pelo bem-estar de suas igrejas sufragâneas.</p><h3>1. O Contexto de Éfeso e a Crise Gnóstica</h3><ul><li>Durante as últimas décadas do primeiro século, a região da Ásia Menor foi inundada por correntes filosófico-religiosas perigosas, nomeadamente o Gnosticismo e sua ramificação cristológica, o Docetismo.</li><li>Esses falsos mestres alegavam que a matéria era intrinsecamente má e, portanto, Jesus Cristo não poderia ter vindo em carne física real, mas apenas em aparência espiritual. João combate essa heresia ferozmente, pois ela anula o valor sacrificial da crucificação e ressurreição corpórea de Jesus.</li></ul><h3>2. O Zelo de um Pastor</h3><ul><li>Conhecido na juventude como um dos 'Filhos do Trovão' devido ao seu temperamento impetuoso, o João maduro é lapidado pelo amor divino, transformando-se no 'Apóstolo do Amor'. Contudo, o seu amor pelas ovelhas de Cristo acende nele uma indignação santa contra os lobos devoradores. Ele escreve não para punir, mas para blindar o rebanho contra a sutil sedução do erro teológico.</li></ul>"
                    }
                ]
            },
            "2joao_1": {
                title: "VERDADE, AMOR E VIGILÂNCIA",
                date: "13/07",
                desc: "\"Aquele que permanece na doutrina, esse tem tanto o Pai como o Filho.\"",
                blocks: [
                    {
                        title: "1. Contexto e Exegese",
                        verse: "Muito me alegrei porque achei alguns de teus filhos andando na verdade, conforme o mandamento que recebemos do Pai. (2 Jo 1:4)",
                        exegesis: "<p>O texto de 2 João se desenvolve sob o pano de fundo da hospitalidade do mundo antigo. Na Igreja primitiva, os mestres itinerantes viajavam de cidade em cidade pregando a Palavra, dependendo inteiramente da acolhida dos lares cristãos. João adverte que essa hospitalidade não poderia ser exercida de forma indiscriminada.</p><p>Havia pregadores heréticos abusando da generosidade dos crentes para propagar doutrinas destruidoras, especificamente a negação da encarnação física de Jesus Cristo. A exegese do versículo 7 revela o termo grego <i>πλάνοι</i> (Planoi - sedutores, impostores, errantes), que descreve aqueles que desviam os outros do caminho reto. João proíbe expressamente que se receba tais pessoas em casa ou que se lhes dê as boas-vindas, pois fazer isso equivaleria a participar de suas obras malignas, usando o termo <i>κοινωνεῖ</i> (Koinōnei - fazer-se cúmplice ou parceiro de suas obras).</p>"
                    },
                    {
                        title: "2. Análise Teológica",
                        verse: "Porque já muitos enganadores entraram no mundo, os quais não confessam que Jesus Cristo veio em carne. Este tal é o enganador e o anticristo. (2 Jo 1:7)",
                        exegesis: "<p>A espinha dorsal teológica de 2 João é a defesa intransigente da Cristologia Ortodoxa da Encarnação. A negação de que Jesus veio em carne real (<i>ἐρχόμενον ἐν σαρκί</i> - Erchomenon en sarki) destrói todo o plano de redenção, pois se Jesus não Se tornou verdadeiramente homem, Ele não pôde morrer como nosso substituto vicário, nem ressuscitar fisicamente para garantir a nossa futura glorificação.</p><p>João categoriza esta teologia gnóstica como o espírito do Anticristo (<i>ἀντίχριστος</i> - Antichristos - aquele que se opõe a Cristo ou tenta usurpar o Seu lugar). O apóstolo enfatiza que a verdadeira marca do cristão é a obediência ao mandamento original de amar uns aos outros (<i>ἀγάπη</i> - Agapē - amor incondicional e sacrificial), fundamentado estritamente na Doutrina de Cristo (<i>διδαχῇ τοῦ Χριστοῦ</i> - Didachē tou Christou). Quem avança além dessa doutrina para inventar novas teologias especulativas afasta-se do próprio Deus, perdendo a comunhão com o Pai e com o Filho.</p>"
                    },
                    {
                        title: "3. Aplicação Prática",
                        verse: "Olhai por vós mesmos, para que não percamos o que temos operado, antes recebamos o inteiro galardão. (2 Jo 1:8)",
                        exegesis: "<p>A aplicação prática de 2 João para a igreja contemporânea foca no desenvolvimento do discernimento espiritual e na imposição de limites saudáveis e bíblicos para a nossa tolerância. Vivemos em uma era que idolatra o pluralismo absoluto e a tolerância irrestrita, rotulando qualquer exclusividade doutrinária como intolerância ou falta de amor.</p><p>No entanto, a epístola nos ensina que o verdadeiro amor protege. Devemos praticar a hospitalidade e o acolhimento, mas nunca à custa da verdade do Evangelho. Apoiar financeiramente, divulgar ou aplaudir pregadores e ministérios que distorcem a identidade de Jesus e os pilares da fé nos torna cúmplices de seus erros. A exortação 'Olhai por vós mesmos' exige uma vigilância rigorosa sobre o conteúdo teológico que consumimos na internet, nas livrarias e nos púlpitos, garantindo que permaneçamos firmes na sã doutrina para preservar nosso pleno galardão eterno.</p>"
                    }
                ]
            }
        };

        // === LÓGICA GERAL ===
        let currentAudioBlob = null;
        let mediaRecorder;
        let audioChunks = [];

        function loadChapter(chapterKey) {
            const data = bibleData[chapterKey];
            if (!data) return;

            const heroTitle = document.getElementById('heroTitle');
            const heroDesc = document.getElementById('heroDesc');
            const dateBadge = document.getElementById('dateBadge');
            const dateValue = document.getElementById('dateValue');
            const communitySection = document.getElementById('community-section');
            const formChapterKey = document.getElementById('formChapterKey');
            
            heroTitle.style.opacity = '0';
            heroDesc.style.opacity = '0';
            dateBadge.style.opacity = '0';
            
            setTimeout(() => {
                if (data.date) {
                    dateValue.textContent = data.date;
                    dateBadge.classList.remove('hidden');
                    communitySection.classList.remove('hidden');
                    formChapterKey.value = chapterKey;
                    carregarComentarios(chapterKey);
                    setTimeout(() => { dateBadge.style.opacity = '1'; }, 100);
                } else {
                    dateBadge.classList.add('hidden');
                    communitySection.classList.add('hidden');
                }

                heroTitle.innerHTML = data.title;
                heroDesc.innerHTML = data.desc;
                heroTitle.style.opacity = '1';
                heroDesc.style.opacity = '1';
            }, 300);

            const mainContent = document.getElementById('content');
            mainContent.innerHTML = ''; 

            data.blocks.forEach((block) => {
                let borderColor = 'border-rose-600';
                let blurTop = 'bg-rose-600/5';
                let blurBottom = 'bg-rose-800/5';
                let borderPanel = 'border-rose-900/30';

                const html = `
                    <section class="reveal max-w-4xl mx-auto w-full relative">
                        <div class="absolute -inset-4 ${blurTop} to-transparent rounded-3xl blur-xl pointer-events-none"></div>
                        
                        <div class="space-y-6 relative z-10">
                            <div class="text-center mb-10">
                                <h2 class="text-3xl md:text-5xl font-serif text-white leading-tight mb-6">${block.title}</h2>
                                <div class="inline-block border-l-4 border-r-4 ${borderColor} px-6 py-4 italic text-slate-300 bg-[#0a0508]/50 shadow-sm max-w-3xl rounded-sm">
                                    "${block.verse}"
                                </div>
                            </div>
                            
                            <div class="bg-[#050510]/80 p-8 md:p-12 rounded-xl border ${borderPanel} transition shadow-2xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 ${blurTop} rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                                <div class="absolute bottom-0 left-0 w-64 h-64 ${blurBottom} rounded-full blur-3xl -ml-20 -mb-20 pointer-events-none"></div>
                                <div class="rich-text text-slate-300 text-[16px] md:text-lg leading-relaxed relative z-10 font-light">
                                    ${block.exegesis}
                                </div>
                            </div>
                        </div>
                    </section>
                `;
                mainContent.insertAdjacentHTML('beforeend', html);
            });
            resetObservers();
        }

        function carregarComentarios(capitulo) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<p class="text-center text-slate-500 text-sm animate-pulse">Carregando comentários...</p>';

            fetch(`api.php?acao=listar&capitulo=${capitulo}`)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                if(!Array.isArray(data)) return;
                if(data.length === 0) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                data.forEach(c => {
                    let mediaHtml = '';
                    if(c.foto) mediaHtml += `<img src="${c.foto}" onclick="openImage(this.src)" class="mt-4 rounded-lg max-h-48 border border-slate-700 cursor-pointer hover:scale-[1.02] transition shadow-lg">`;
                    if(c.audio) mediaHtml += `<audio controls src="${c.audio}" class="mt-4 w-full"></audio>`;

                    const jaCurtiu = localStorage.getItem(`reagiu_likes_${c.id}`);
                    const jaAmem = localStorage.getItem(`reagiu_amem_${c.id}`);
                    const jaGloria = localStorage.getItem(`reagiu_gloria_${c.id}`);

                    let themeColor = 'text-rose-400';
                    let panelBorder = 'hover:border-rose-500/50';

                    const html = `
                        <div class="glass-panel p-5 pb-12 rounded-xl border border-slate-800 relative group transition ${panelBorder} bg-[#0a0508]/60">
                            <div class="flex justify-between items-start mb-3 border-b border-slate-800 pb-2">
                                <strong class="${themeColor} text-sm tracking-wide font-serif">${c.nome}</strong>
                                <span class="text-[10px] text-slate-500 uppercase tracking-widest">${new Date(c.data_envio).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <p class="text-slate-300 text-sm leading-relaxed">${c.mensagem}</p>
                            ${mediaHtml}
                            
                            <div class="absolute bottom-3 right-4 flex gap-2">
                                <button onclick="reagirComentario(${c.id}, 'likes', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaCurtiu ? 'text-red-500 border-red-500/30' : 'text-slate-400 hover:text-red-400'}" ${jaCurtiu ? 'disabled' : ''}>
                                    <i class="fa-solid fa-heart"></i> <span class="count font-bold">${c.likes || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'amem', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaAmem ? 'text-rose-400 border-rose-400/30' : 'text-slate-400 hover:text-rose-400'}" ${jaAmem ? 'disabled' : ''}>
                                    <i class="fa-solid fa-hands-praying"></i> <span class="count font-bold">${c.amem || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'gloria', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaGloria ? 'text-rose-500 border-rose-500/30' : 'text-slate-400 hover:text-rose-500'}" ${jaGloria ? 'disabled' : ''}>
                                    <i class="fa-solid fa-fire"></i> <span class="count font-bold">${c.gloria || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(err => {
                list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao carregar comentários.</p>';
            });
        }

        function reagirComentario(id, tipo, btn) {
            if(localStorage.getItem(`reagiu_${tipo}_${id}`)) return;

            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.count');
            let count = parseInt(countSpan.innerText);

            icon.classList.add('reacted-anim');
            btn.classList.remove('text-slate-400');
            
            if(tipo === 'likes') btn.classList.add('text-red-500', 'border-red-500/30');
            if(tipo === 'amem') btn.classList.add('text-rose-400', 'border-rose-400/30');
            if(tipo === 'gloria') btn.classList.add('text-rose-500', 'border-rose-500/30');

            countSpan.innerText = count + 1;
            btn.disabled = true;

            localStorage.setItem(`reagiu_${tipo}_${id}`, 'true');

            const formData = new FormData();
            formData.append('acao', 'reagir');
            formData.append('id', id);
            formData.append('tipo', tipo);

            fetch('api.php', { method: 'POST', body: formData }).catch(err => console.error(err));
        }

        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append('acao', 'salvar');
            if(currentAudioBlob) {
                formData.append('audio', currentAudioBlob, 'audio.wav');
            }

            fetch('api.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.sucesso) {
                    this.reset();
                    document.getElementById('filePreview').innerHTML = '';
                    currentAudioBlob = null;
                    document.getElementById('recordText').innerText = "Gravar Áudio";
                    carregarComentarios(document.getElementById('formChapterKey').value);
                } else {
                    alert('Erro ao enviar.');
                }
            })
            .catch(() => alert('Erro de conexão.'))
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        function previewFile(input) {
            const preview = document.getElementById('filePreview');
            if(input.files && input.files[0]) {
                preview.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Imagem selecionada: ${input.files[0].name}`;
                preview.classList.remove('hidden');
            }
        }

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        document.getElementById('filePreview').classList.remove('hidden');
                        document.getElementById('filePreview').innerHTML += '<br><i class="fa-solid fa-microphone text-green-400"></i> Áudio gravado!';
                    };
                    mediaRecorder.start();
                    recordBtn.classList.add('recording-pulse');
                    document.getElementById('recordText').innerText = "Parar Gravação";
                } catch (err) {
                    alert("Permita o uso do microfone para gravar.");
                }
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
                document.getElementById('recordText').innerText = "Gravar Áudio";
            }
        });

        function openImage(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImage() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function resetObservers() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, spcX: Math.random()*0.5-0.25, spcY: Math.random()*0.5-0.25 });
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(251, 113, 133, 0.15)"; /* Rose */
            particles.forEach(p => { p.x += p.spcX; p.y += p.spcY; if(p.x<0||p.x>canvas.width) p.spcX*=-1; if(p.y<0||p.y>canvas.height) p.spcY*=-1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        loadChapter('intro_book');
    </script>
</body>
</html>
