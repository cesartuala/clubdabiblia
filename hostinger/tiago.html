    <script>
        const bibleData = {
            "intro_book": {
                title: "A EPÍSTOLA DE TIAGO",
                date: null,
                desc: "<span class='text-xs uppercase tracking-[0.3em] text-purple-400 not-italic block mb-4'>Introdução: Sobre o Livro</span>\"A fé que age: O manual prático de sabedoria e justiça cristã.\"",
                blocks: [
                    {
                        title: "Os Provérbios do Novo Testamento",
                        verse: "Tende, meus irmãos, por motivo de toda a alegria o passardes por várias provações... (Tiago 1:2)",
                        exegesis: "<h3>1. Contexto e Exegese</h3><p>A Epístola de Tiago é amplamente conhecida como os Provérbios do Novo Testamento devido à sua natureza concisa, prática e repleta de instruções sapienciais. Diferente das cartas paulinas que focam intensamente na teologia sistemática e nos fundamentos doutrinários da justificação, Tiago dirige-se de maneira contundente à conduta diária e à manifestação visível da salvação. O termo original para dispersão, <i>διασπορά</i> (Diaspora - dispersão de judeus fora da Palestina), indica que o autor se comunica com judeus-cristãos espalhados pelo império romano que enfrentavam graves provações socioeconômicas e perseguições religiosas.</p><h3>2. Análise Teológica</h3><p>O cerne teológico do escrito gira em torno da integridade e maturidade da fé. Tiago utiliza o conceito de <i>Ἰάκωβος</i> (Iakobos - derivado do hebraico Ya'akov ou Jacó) para assinar sua carta, demonstrando profunda reverência pela herança pactual de Israel, agora cumprida em Jesus Cristo. Ele aborda o dilema da justificação prática: enquanto Paulo enfatiza que somos justificados pela fé sem as obras da lei cerimonial frente ao tribunal divino, Tiago argumenta que somos justificados diante do mundo pelas obras morais que brotam de uma fé regenerada. A fé autêntica não é mero assentimento intelectual, mas um princípio dinâmico que transforma a conduta humana.</p><h3>3. Aplicação Prática</h3><p>Este livro nos convoca a alinhar nossa ortodoxia (crença correta) com nossa ortopraxia (conduta correta). Em dias de religiosidade nominal e de mídias sociais onde o discurso excede a ação, Tiago adverte que falar sem viver de modo santo é uma ilusão espiritual. O convite é para examinar o fruto da nossa confissão de fé, aplicando amor compassivo aos marginalizados, demonstrando controle absoluto no falar e mantendo-se incontaminado pelas ideologias secularizadas que nos rodeiam.</p>"
                    }
                ]
            },
            "intro_author": {
                title: "SOBRE O AUTOR",
                date: null,
                desc: "\"Tiago, servo de Deus e do Senhor Jesus Cristo, às doze tribos que andam dispersas...\"",
                blocks: [
                    {
                        title: "O Irmão do Senhor e Coluna de Jerusalém",
                        verse: "E não vi a nenhum outro dos apóstolos, senão a Tiago, irmão do Senhor. (Gálatas 1:19)",
                        exegesis: "<h3>1. Contexto e Exegese</h3><p>O autor desta carta não é o Tiago irmão de João (que foi martirizado muito cedo por Herodes Agripa em Atos 12), mas sim o Tiago meio-irmão de Jesus, listado em Mateus 13:55. Inicialmente cético quanto ao ministério messiânico de Jesus (João 7:5), ele foi radicalmente transformado após testemunhar a aparição de Cristo ressuscitado (1 Coríntios 15:7). Ele assumiu o papel de líder principal da igreja em Jerusalém, conhecido como o Justo devido à sua piedade rigorosa. O termo hebraico <i>צַדִּיק</i> (Tzadik - Justo) reflete a reputação de Tiago como alguém dedicado às Escrituras e à oração constante de joelhos.</p><h3>2. Análise Teológica</h3><p>Como moderador do Concílio de Jerusalém (Atos 15), Tiago foi crucial para manter a unidade entre crentes judeus e gentios, preservando a essência da lei moral sem impor o fardo dos rituais mosaicos aos convertidos não-judeus. Ele usa o título <i>δοῦλος</i> (Doulos - escravo ou servo por amor) para descrever seu relacionamento com Cristo, abrindo mão de qualquer prerrogativa de parentesco carnal para posicionar-se na mesma condição espiritual que qualquer outro redimido pelo Messias.</p><h3>3. Aplicação Prática</h3><p>A transição de cético a mártir e líder exemplar nos ensina que a proximidade física com a verdade religiosa não garante a conversão, mas a revelação do Cristo ressuscitado rompe qualquer barreira de descrença. A postura de Tiago, que preferiu se autodenominar servo ao invés de 'irmão do Messias', modela a humildade radical que deve caracterizar os líderes e servos da igreja contemporânea, que devem buscar relevância através do serviço e da retidão espiritual.</p>"
                    }
                ]
            },
            "tiago_1": {
                title: "PROVAÇÕES E A PALAVRA",
                date: "18/06 a 24/06",
                desc: "\"Sede cumpridores da palavra e não apenas ouvintes, enganando-vos a vós mesmos.\"",
                blocks: [
                    {
                        title: "Provação que Aperfeiçoa e a Religião Pura",
                        verse: "Sabendo que a prova da vossa fé opera a paciência. (Tiago 1:3)",
                        exegesis: "<h3>1. Contexto e Exegese</h3><p>Tiago inicia sua carta abordando a realidade inevitável do sofrimento na jornada cristã. O termo original grego para provações é <i>πειρασμός</i> (Peirasmos - testes, provações que visam depurar o caráter). Diferente da tentação que visa a queda, a provação divina visa o amadurecimento e a consolidação do caráter. Ele exorta os crentes a considerarem tais provações com grande alegria, não pelo sofrimento em si, mas pelo fruto espiritual de perseverança e integridade que elas geram no crente moldado pelo Espírito.</p><h3>2. Análise Teológica</h3><p>A recepção e aplicação das Escrituras são centrais para a vitória nessas crises. Tiago introduz a belíssima expressão <i>λόγος ἔμφυτος</i> (Logos Emphytos - Palavra implantada, enxertada em nossa natureza). Essa Palavra, quando acolhida com mansidão, tem o poder regenerador e salvífico de reestruturar a mente humana. O autor compara as Escrituras a um espelho: aquele que apenas escuta e não pratica assemelha-se a quem olha seu rosto natural no espelho e, retirando-se, esquece imediatamente sua real aparência espiritual.</p><h3>3. Aplicação Prática</h3><p>A verdadeira religião não é validada pelo conhecimento acadêmico ou rituais externos, mas pela compaixão ativa aos órfãos e viúvas em suas aflições e pela preservação da integridade pessoal diante do sistema mundano. No dia a dia, devemos ser rápidos para ouvir as instruções do Senhor, tardios para proferir julgamentos precipitados e tardios para irar-se, canalizando as adversidades como oportunidades para desenvolver uma paciência perseverante e inabalável.</p>"
                    }
                ]
            },
            "tiago_2": {
                title: "FÉ E OBRAS",
                date: "18/06 a 24/06",
                desc: "\"Porque, assim como o corpo sem o espírito está morto, assim também a fé sem obras é morta.\"",
                blocks: [
                    {
                        title: "Acepção de Pessoas e a Fé Viva",
                        verse: "Fale de tal maneira e proceda de tal maneira como aqueles que hão de ser julgados pela lei da liberdade. (Tiago 2:12)",
                        exegesis: "<h3>1. Contexto e Exegese</h3><p>Neste capítulo, Tiago combate duramente o preconceito social dentro da assembleia cristã, exortando os crentes contra o pecado da <i>προσωπολημψία</i> (Prosopolempsia - acepção de pessoas, julgamento externo com base em status socioeconômico). Favorecer o rico vestido de roupas luxuosas em detrimento do pobre em trajes humildes viola diretamente a Lei Régia, que ordena amar o próximo como a si mesmo. Esse ato desonra a dignidade daqueles que foram escolhidos por Deus para serem ricos na fé e herdeiros do Reino celestial.</p><h3>2. Análise Teológica</h3><p>A seção mais famosa da carta expõe a futilidade de uma crença puramente discursiva. Tiago declara enfaticamente: <i>πίστις χωρίς ἔργων νεκρά ἐστιν</i> (Pistis choris ergon nekra estin - a fé sem as obras é inteiramente morta). Ele usa os exemplos históricos de Abraão (o pai da fé) e Raabe (uma gentia outrora marginalizada) para demonstrar que as decisões concretas de obediência e sacrifício validaram e aperfeiçoaram a fé interior de ambos. Até os demônios creem na unicidade de Deus e tremem, mas essa crença mental não os conduz à regeneração ou salvação.</p><h3>3. Aplicação Prática</h3><p>A nossa fé salvadora deve ser demonstrável em termos práticos. Se vemos um irmão ou irmã necessitados de alimento ou vestimenta e apenas proferimos palavras de encorajamento sem fornecer o auxílio material necessário, nossa espiritualidade é vazia e estéril. Somos chamados a viver de forma acolhedora, demonstrando misericórdia de modo ativo, pois a misericórdia triunfa com galhardia sobre o juízo severo.</p>"
                    }
                ]
            },
            "tiago_3": {
                title: "O PODER DA LÍNGUA",
                date: "18/06 a 24/06",
                desc: "\"Se alguém não tropeça em palavra, o tal homem é perfeito, e poderoso para refrear também todo o corpo.\"",
                blocks: [
                    {
                        title: "O Domador do Corpo e as Duas Sabedorias",
                        verse: "A língua também é um fogo; como mundo de iniquidade... (Tiago 3:6)",
                        exegesis: "<h3>1. Contexto e Exegese</h3><p>Tiago inicia com um aviso solene aos mestres e líderes espirituais, ressaltando que estes receberão um juízo mais estrito devido à responsabilidade do ensino. Ele foca imediatamente na capacidade de refrear a fala, utilizando o verbo <i>χαλιναγωγέω</i> (Chalinagogeo - guiar com rédeas, refrear o corpo inteiro). O autor usa analogias poderosas da física antiga e da natureza: um pequeno freio que domina cavalos robustos, um leme minúsculo que governa grandes embarcações diante de ventos tempestuosos e uma fagulha microscópica que incendeia florestas inteiras.</p><h3>2. Análise Teológica</h3><p>A língua é descrita como um órgão indomável e inflamado pelo próprio inferno, capaz de abençoar a Deus e amaldiçoar os homens que foram criados à imagem e semelhança divina. No tocante à mentalidade do crente, Tiago contrasta a sabedoria terrena, animal e demoníaca (caracterizada por ciúmes amargos e sentimentos facciosos) com a <i>ἄνωθεν σοφία</i> (Anothen Sophia - sabedoria que vem do alto). Esta sabedoria divina é primeiramente pura, pacífica, moderada, tratável, cheia de misericórdia e de bons frutos.</p><h3>3. Aplicação Prática</h3><p>O controle sobre o que falamos é o termômetro exato da nossa saúde espiritual. Em uma época de fofocas, calúnias, ofensas virtuais e discursos agressivos, o cristão deve cultivar uma comunicação que edifica, cura e promove a paz. A verdadeira sabedoria não é exibida através de uma postura arrogante ou de debates infrutíferos, mas pela mansidão habitual de nossas atitudes e pelo fruto pacífico da justiça semeado no seio da comunidade.</p>"
                    }
                ]
            },
            "tiago_4": {
                title: "MUNDO E SOBERBIA",
                date: "18/06 a 24/06",
                desc: "\"Sujeitai-vos, pois, a Deus, resisti ao diabo, e ele fugirá de vós.\"",
                blocks: [
                    {
                        title: "Inimizade contra Deus e a Humildade Exigida",
                        verse: "Deus resiste aos soberbos, mas dá graça aos humildes. (Tiago 4:6)",
                        exegesis: "<h3>1. Contexto e Exegese</h3><p>O autor investiga a raiz dos conflitos, invejas e divisões que assolam os crentes da dispersão. Ele localiza a origem dos conflitos na busca desenfreada pela <i>ἡδονή</i> (Hedone - desejos carnais, paixões egoístas pelo prazer). Essa busca gera cobiça, inveja e insatisfação crônica, impedindo a eficácia das orações, uma vez que estas são realizadas com motivações impuras para gastar nas concupiscências individuais. A amizade com o sistema moral decaído do mundo é declarada inimizade contra Deus.</p><h3>2. Análise Teológica</h3><p>Para combater a soberba e a autossuficiência humana, Tiago aponta o caminho da redenção através do verbo <i>ὑποτάσσω</i> (Hypotasso - sujeitar-se voluntariamente, colocar-se sob a autoridade divina). Ele ensina que o diabo não é vencido por rituais espalhafatosos, mas sim por meio de um coração submisso ao Senhor e resiliente na fé. O arrependimento genuíno requer purificação das mãos, dupla mente corrigida, pranto sincero e quebrantamento profundo diante da santidade do Criador.</p><h3>3. Aplicação Prática</h3><p>Nossa dependência contínua de Deus deve impactar diretamente nosso planejamento futuro e nossa linguagem. Tiago adverte severamente aqueles que fazem planos comerciais arrogantes baseados na presunção de suas capacidades, esquecendo que a vida humana é efêmera como a neblina que logo se esvai. Em vez de dizer 'farei isso ou aquilo', devemos submeter nossos alvos dizendo: 'Se o Senhor quiser, viveremos e faremos isto ou aquilo'.</p>"
                    }
                ]
            },
            "tiago_5": {
                title: "JUSTIÇA E ORAÇÃO",
                date: "18/06 a 24/06",
                desc: "\"A oração feita por um justo pode muito em seus efeitos.\"",
                blocks: [
                    {
                        title: "O Juízo sobre os Opressores e a Oração da Fé",
                        verse: "Eis que o juiz está à porta. (Tiago 5:9)",
                        exegesis: "<h3>1. Contexto e Exegese</h3><p>Tiago conclui sua epístola com uma denúncia profética devastadora contra os ricos opressores que retiveram injustamente o salário dos trabalhadores de suas lavouras. O clamor daqueles que ceifaram os campos subiu até os ouvidos do Senhor dos Exércitos, e as riquezas corruptas daqueles proprietários impiedosos serviriam como testemunho contra eles no dia do juízo. Ele exorta os necessitados e oprimidos a exercerem paciência até a gloriosa <i>παρουσία</i> (Parousia - vinda, presença majestosa e oficial do Senhor Jesus Cristo).</p><h3>2. Análise Teológica</h3><p>No encerramento da carta, a comunidade é conclamada a exercer o poder do sacerdócio mútuo por meio da confissão de pecados e da intercessão. O autor utiliza a frase <i>προσευχὴ ἐνεργουμένη</i> (Proseuches energoumene - oração dinâmica, enérgica, eficaz e atuante) para descrever a petição do justo. Ele cita o profeta Elias, um ser humano sujeito às mesmas paixões e fraquezas que nós, que por meio de orações intensas governou o céu, demonstrando a autoridade que o Altíssimo confia aos Seus servos irrepreensíveis.</p><h3>3. Aplicação Prática</h3><p>Nas crises, doenças ou aflições físicas e espirituais, não devemos murmurar uns contra os outros, mas buscar o conselho e a intercessão da liderança e dos irmãos maduros da fé. A vida comunitária deve ser marcada pela compaixão e pelo resgate espiritual daqueles que se desviam da verdade doutrinária, lembrando que aquele que converte um pecador do seu caminho errado salva uma alma da morte e cobre uma multidão de transgressões.</p>"
                    }
                ]
            }
        };

        // === LÓGICA GERAL ===
        let currentAudioBlob = null;
        let mediaRecorder;
        let audioChunks = [];

        function loadChapter(chapterKey) {
            const data = bibleData[chapterKey];
            if (!data) return;

            const heroTitle = document.getElementById('heroTitle');
            const heroDesc = document.getElementById('heroDesc');
            const dateBadge = document.getElementById('dateBadge');
            const dateValue = document.getElementById('dateValue');
            const communitySection = document.getElementById('community-section');
            const formChapterKey = document.getElementById('formChapterKey');
            
            heroTitle.style.opacity = '0';
            heroDesc.style.opacity = '0';
            dateBadge.style.opacity = '0';
            
            setTimeout(() => {
                if (data.date) {
                    dateValue.textContent = data.date;
                    dateBadge.classList.remove('hidden');
                    communitySection.classList.remove('hidden');
                    formChapterKey.value = chapterKey;
                    carregarComentarios(chapterKey);
                    setTimeout(() => { dateBadge.style.opacity = '1'; }, 100);
                } else {
                    dateBadge.classList.add('hidden');
                    communitySection.classList.add('hidden');
                }

                heroTitle.innerHTML = data.title;
                heroDesc.innerHTML = data.desc;
                heroTitle.style.opacity = '1';
                heroDesc.style.opacity = '1';
            }, 300);

            const mainContent = document.getElementById('content');
            mainContent.innerHTML = ''; 

            data.blocks.forEach((block) => {
                let borderColor = 'border-purple-600';
                let blurTop = 'bg-purple-600/5';
                let blurBottom = 'bg-purple-800/5';
                let borderPanel = 'border-purple-900/30';

                const html = `
                    <section class="reveal max-w-4xl mx-auto w-full relative">
                        <div class="absolute -inset-4 ${blurTop} to-transparent rounded-3xl blur-xl pointer-events-none"></div>
                        
                        <div class="space-y-6 relative z-10">
                            <div class="text-center mb-10">
                                <h2 class="text-3xl md:text-5xl font-serif text-white leading-tight mb-6">${block.title}</h2>
                                <div class="inline-block border-l-4 border-r-4 ${borderColor} px-6 py-4 italic text-slate-300 bg-[#0a0514]/50 shadow-sm max-w-3xl rounded-sm">
                                    "${block.verse}"
                                </div>
                            </div>
                            
                            <div class="bg-[#050510]/80 p-8 md:p-12 rounded-xl border ${borderPanel} transition shadow-2xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 ${blurTop} rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                                <div class="absolute bottom-0 left-0 w-64 h-64 ${blurBottom} rounded-full blur-3xl -ml-20 -mb-20 pointer-events-none"></div>
                                <div class="rich-text text-slate-300 text-[16px] md:text-lg leading-relaxed relative z-10 font-light">
                                    ${block.exegesis}
                                </div>
                            </div>
                        </div>
                    </section>
                `;
                mainContent.insertAdjacentHTML('beforeend', html);
            });
            resetObservers();
        }

        function carregarComentarios(capitulo) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<p class="text-center text-slate-500 text-sm animate-pulse">Carregando comentários...</p>';

            fetch(`api.php?acao=listar&capitulo=${capitulo}`)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                if(!Array.isArray(data)) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                if(data.length === 0) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                data.forEach(c => {
                    let mediaHtml = '';
                    if(c.foto) mediaHtml += `<img src="${c.foto}" onclick="openImage(this.src)" class="mt-4 rounded-lg max-h-48 border border-slate-700 cursor-pointer hover:scale-[1.02] transition shadow-lg">`;
                    if(c.audio) mediaHtml += `<audio controls src="${c.audio}" class="mt-4 w-full"></audio>`;

                    const jaCurtiu = localStorage.getItem(`reagiu_likes_${c.id}`);
                    const jaAmem = localStorage.getItem(`reagiu_amem_${c.id}`);
                    const jaGloria = localStorage.getItem(`reagiu_gloria_${c.id}`);

                    let themeColor = 'text-purple-400';
                    let panelBorder = 'hover:border-purple-500/50';

                    const html = `
                        <div class="glass-panel p-5 pb-12 rounded-xl border border-slate-800 relative group transition ${panelBorder} bg-[#0a0514]/60">
                            <div class="flex justify-between items-start mb-3 border-b border-slate-800 pb-2">
                                <strong class="${themeColor} text-sm tracking-wide font-serif">${c.nome}</strong>
                                <span class="text-[10px] text-slate-500 uppercase tracking-widest">${new Date(c.data_envio).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <p class="text-slate-300 text-sm leading-relaxed">${c.mensagem}</p>
                            ${mediaHtml}
                            
                            <div class="absolute bottom-3 right-4 flex gap-2">
                                <button onclick="reagirComentario(${c.id}, 'likes', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaCurtiu ? 'text-red-500 border-red-500/30' : 'text-slate-400 hover:text-red-400'}" ${jaCurtiu ? 'disabled' : ''}>
                                    <i class="fa-solid fa-heart"></i> <span class="count font-bold">${c.likes || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'amem', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaAmem ? 'text-purple-400 border-purple-400/30' : 'text-slate-400 hover:text-purple-400'}" ${jaAmem ? 'disabled' : ''}>
                                    <i class="fa-solid fa-hands-praying"></i> <span class="count font-bold">${c.amem || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'gloria', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaGloria ? 'text-blue-500 border-blue-500/30' : 'text-slate-400 hover:text-blue-500'}" ${jaGloria ? 'disabled' : ''}>
                                    <i class="fa-solid fa-fire"></i> <span class="count font-bold">${c.gloria || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(err => {
                list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao carregar comentários de forma resiliente.</p>';
            });
        }

        function reagirComentario(id, tipo, btn) {
            if(localStorage.getItem(`reagiu_${tipo}_${id}`)) return;

            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.count');
            let count = parseInt(countSpan.innerText);

            icon.classList.add('reacted-anim');
            btn.classList.remove('text-slate-400');
            
            if(tipo === 'likes') btn.classList.add('text-red-500', 'border-red-500/30');
            if(tipo === 'amem') btn.classList.add('text-purple-400', 'border-purple-400/30');
            if(tipo === 'gloria') btn.classList.add('text-blue-500', 'border-blue-500/30');

            countSpan.innerText = count + 1;
            btn.disabled = true;

            localStorage.setItem(`reagiu_${tipo}_${id}`, 'true');

            const formData = new FormData();
            formData.append('acao', 'reagir');
            formData.append('id', id);
            formData.append('tipo', tipo);

            fetch('api.php', { method: 'POST', body: formData }).catch(err => console.error("Falha ao registrar reação", err));
        }

        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append('acao', 'salvar');
            if(currentAudioBlob) {
                formData.append('audio', currentAudioBlob, 'audio.wav');
            }

            fetch('api.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.sucesso) {
                    this.reset();
                    document.getElementById('filePreview').innerHTML = '';
                    currentAudioBlob = null;
                    document.getElementById('recordText').innerText = "Gravar Áudio";
                    carregarComentarios(document.getElementById('formChapterKey').value);
                } else {
                    alert('Erro ao enviar.');
                }
            })
            .catch(() => alert('Erro de conexão com o servidor de comentários.'))
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        function previewFile(input) {
            const preview = document.getElementById('filePreview');
            if(input.files && input.files[0]) {
                preview.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Imagem selecionada: ${input.files[0].name}`;
                preview.classList.remove('hidden');
            }
        }

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        document.getElementById('filePreview').classList.remove('hidden');
                        document.getElementById('filePreview').innerHTML += '<br><i class="fa-solid fa-microphone text-green-400"></i> Áudio gravado!';
                    };
                    mediaRecorder.start();
                    recordBtn.classList.add('recording-pulse');
                    document.getElementById('recordText').innerText = "Parar Gravação";
                } catch (err) {
                    alert("Permita o uso do microfone para gravar.");
                }
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
                document.getElementById('recordText').innerText = "Gravar Áudio";
            }
        });

        function openImage(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImage() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function resetObservers() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
            // Força ativação dos primeiros se não triggar
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.top < window.innerHeight) {
                        el.classList.add('active');
                    }
                });
            }, 400);
        }

        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, spcX: Math.random()*0.5-0.25, spcY: Math.random()*0.5-0.25 });
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(192, 132, 252, 0.15)"; /* Lilás/Roxo */
            particles.forEach(p => { p.x += p.spcX; p.y += p.spcY; if(p.x<0||p.x>canvas.width) p.spcX*=-1; if(p.y<0||p.y>canvas.height) p.spcY*=-1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        loadChapter('intro_book');
    </script>
</body>
</html>
