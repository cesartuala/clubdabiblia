<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 1 Pedro | Clube da Bíblia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Lato', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.2); transition: all 0.4s ease; }
        .sky-glow { text-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        .option-btn { transition: all 0.3s ease; }
        .option-btn:hover:not(:disabled) { transform: translateX(5px); background-color: rgba(56, 189, 248, 0.15); border-color: #38bdf8; }
        .option-correct { background-color: rgba(16, 185, 129, 0.2) !important; border-color: #10b981 !important; color: #34d399 !important; }
        .option-wrong { background-color: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; color: #f87171 !important; }
    </style>
</head>
<body class="font-sans antialiased flex flex-col min-h-screen">

    <canvas id="particles-js"></canvas>

    <nav class="w-full z-50 p-6 flex justify-between items-center relative">
        <a href="index.html" class="group flex items-center gap-2 px-4 py-2 rounded-lg bg-[#030712] border border-sky-500/50 text-sky-400 hover:bg-sky-500 hover:text-black transition-all">
            <i class="fa-solid fa-chevron-left text-sm group-hover:-translate-x-1 transition-transform"></i>
            <span class="hidden md:inline text-xs uppercase tracking-widest font-bold">Voltar ao Início</span>
        </a>
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-shield-heart text-sky-500 text-xl"></i>
            <span class="font-serif text-white text-lg tracking-widest font-bold">CLUBE DA BÍBLIA</span>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 relative z-10 w-full max-w-3xl mx-auto">
        <div class="glass-card rounded-2xl w-full flex flex-col relative overflow-hidden shadow-[0_0_40px_rgba(56,189,248,0.15)]">
            <div class="h-1 w-full bg-gradient-to-r from-sky-600 via-sky-400 to-sky-300" id="progressBar"></div>
            
            <div class="p-6 md:p-10 flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-sky-500/20 pb-4">
                    <h1 class="font-serif text-2xl md:text-3xl text-white sky-glow font-bold">Quiz: 1 Pedro</h1>
                    <span id="questionCounter" class="bg-sky-950/50 text-sky-300 px-3 py-1 rounded-full text-xs font-bold tracking-widest border border-sky-500/30">1 / 10</span>
                </div>

                <div id="quizContainer">
                    <div id="questionText" class="text-lg md:text-xl text-slate-200 mb-6 font-light leading-relaxed"></div>
                    <div id="optionsContainer" class="space-y-3"></div>
                    <div id="feedbackContainer" class="mt-6 p-4 rounded-lg hidden text-sm leading-relaxed border"></div>

                    <button id="nextBtn" class="mt-8 w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-lg transition uppercase tracking-widest hidden shadow-lg shadow-sky-900/50">
                        Próxima Pergunta <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>

                <div id="resultContainer" class="hidden flex-col items-center text-center py-8">
                    <i class="fa-solid fa-crown text-6xl text-sky-400 mb-4 drop-shadow-[0_0_15px_rgba(56,189,248,0.6)]"></i>
                    <h2 class="font-serif text-3xl text-white mb-2">Exílio Concluído!</h2>
                    <p class="text-slate-300 text-lg mb-6">Você acertou <span id="finalScore" class="text-sky-400 font-bold text-2xl">0</span> de 10 perguntas.</p>
                    
                    <div class="w-full max-w-sm bg-slate-950/80 p-6 rounded-xl border border-slate-700">
                        <h3 class="text-xs uppercase tracking-widest text-sky-400 mb-4 font-bold">Salvar no Ranking</h3>
                        <form id="rankingForm" class="space-y-4">
                            <input type="hidden" name="acao" value="salvar_quiz_1pedro">
                            <input type="hidden" name="pontos" id="inputPontos" value="0">
                            <input type="hidden" name="acertos" id="inputAcertos" value="0">
                            <input type="text" name="nome" required placeholder="Seu Nome..." class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-2 text-white focus:border-sky-500 focus:outline-none transition text-sm">
                            <button type="submit" class="w-full bg-gradient-to-r from-sky-600 to-sky-400 text-white font-bold py-2 rounded transition uppercase tracking-widest text-xs shadow-lg">Enviar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const quizData = [
            {
                q: "Para quais destinatários foi endereçada a primeira epístola de Pedro?",
                options: [
                    { t: "Aos gentios exilados de Roma e Corinto.", c: false, r: "Pedro escreve explicitamente para as províncias da Ásia Menor." },
                    { t: "Aos estrangeiros da Dispersão no Ponto, Galácia, Capadócia, Ásia e Bitínia.", c: true, r: "Estes são os locais mencionados na abertura de 1 Pedro 1:1." },
                    { t: "Às doze tribos espalhadas que se encontram em Jerusalém.", c: false, r: "Esta saudação pertence à carta de Tiago, não 1 Pedro." },
                    { t: "Aos oficiais romanos estacionados na Palestina.", c: false, r: "A carta foi escrita para igrejas sofrendo hostilidade." }
                ]
            },
            {
                q: "A que tipo de esperança fomos gerados de novo através da ressurreição de Jesus, segundo o capítulo 1?",
                options: [
                    { t: "Uma esperança viva.", c: true, r: "1 Pedro 1:3 afirma que fomos regenerados para uma 'viva esperança'." },
                    { t: "Uma esperança passageira.", c: false, r: "Nossa esperança é permanente e eterna em Cristo." },
                    { t: "Uma esperança baseada na lei judaica.", c: false, r: "A esperança vem através da nova aliança e da ressurreição de Cristo." },
                    { t: "Uma esperança puramente material.", c: false, r: "A herança descrita é espiritual e garantida nos céus." }
                ]
            },
            {
                q: "Como Pedro descreve a herança reservada nos céus para os eleitos?",
                options: [
                    { t: "Incorruptível, imaculada e que não murcha.", c: true, r: "Estas são as três características exatas descritas em 1 Pedro 1:4." },
                    { t: "Temporária, testada e reservada para os fortes.", c: false, r: "Pedro destaca a natureza inabalável e eterna da herança divina." },
                    { t: "Exclusiva para os nascidos em solo judeu.", c: false, r: "A herança é para todos os eleitos e regenerados pela fé." },
                    { t: "Um prêmio baseado exclusivamente nas obras da lei.", c: false, r: "Ela decorre da abundante misericórdia de Deus Pai." }
                ]
            },
            {
                q: "O que Pedro afirma ser muito mais precioso do que o ouro perecível provado pelo fogo?",
                options: [
                    { t: "A sabedoria humana.", c: false, r: "A sabedoria humana é considerada vã em muitos aspectos." },
                    { t: "O dízimo e as ofertas trazidas ao templo.", c: false, r: "Pedro não utiliza essa comparação na passagem." },
                    { t: "A provação da vossa fé.", c: true, r: "1 Pedro 1:7 afirma que a fé testada vale infinitamente mais que o ouro refinado." },
                    { t: "Os templos físicos construídos em Jerusalém.", c: false, r: "Pedro rebaixa o valor de estruturas físicas diante da fé provada." }
                ]
            },
            {
                q: "Complete a exortação baseada nas Escrituras em 1 Pedro 1:16: 'Sede ___, porque eu sou ___'.",
                options: [
                    { t: "Sábios / Sábio", c: false, r: "A palavra em foco é santidade." },
                    { t: "Santos / Santo", c: true, r: "O mandamento repete o Antigo Testamento chamando o povo a imitar a santidade de Deus." },
                    { t: "Justos / Justo", c: false, r: "A santidade é o atributo específico citado pelo autor." },
                    { t: "Mansos / Manso", c: false, r: "Embora a mansidão seja ensinada, a citação bíblica exige santidade." }
                ]
            },
            {
                q: "Com o que fomos resgatados da nossa vã conduta herdada de nossos pais?",
                options: [
                    { t: "Com ouro e prata refinados.", c: false, r: "Pedro enfatiza que esses bens materiais são corruptíveis." },
                    { t: "Com o precioso sangue de Cristo, como de cordeiro sem defeito.", c: true, r: "1 Pedro 1:18-19 destaca a redenção por meio do sacrifício perfeito de Jesus." },
                    { t: "Através do arrependimento no templo.", c: false, r: "O resgate tem base histórica e teológica no sacrifício do calvário." },
                    { t: "Com jejum e sacrifícios rituais de animais.", c: false, r: "O sangue dos cordeiros animais não podia efetivar esse resgate definitivo." }
                ]
            },
            {
                q: "Quem é a Pedra Angular (Pedra de Esquina) descrita no capítulo 2 de 1 Pedro?",
                options: [
                    { t: "O Apóstolo Pedro.", c: false, r: "Pedro é uma pedra viva, mas Cristo é a Pedra Angular principal." },
                    { t: "Jesus Cristo.", c: true, r: "Jesus é a pedra de esquina eleita e preciosa sobre a qual se ergue a igreja." },
                    { t: "Moisés, o dador da lei.", c: false, r: "Moisés prefigurou a aliança, mas Cristo é o próprio alicerce." },
                    { t: "O imperador romano.", c: false, r: "O império romano rejeitou o Evangelho e perseguiu a igreja." }
                ]
            },
            {
                q: "Quais são os títulos aplicados à igreja em 1 Pedro 2:9?",
                options: [
                    { t: "Geração eleita, sacerdócio real, nação santa, povo adquirido.", c: true, r: "Pedro utiliza estes exatos quatro termos para descrever a nova identidade cristã." },
                    { t: "Os herdeiros de Abraão, os guardiões do sábado, os eleitos judaicos.", c: false, r: "Estes termos não refletem a lista exata do versículo 9." },
                    { t: "Servos do império, cidadãos livres, sacerdotes da lei antiga.", c: false, r: "A identidade descrita é espiritual e desvinculada das instituições terrenas." },
                    { t: "Soldados zelotes, reis da terra, profetas da diáspora.", c: false, r: "A igreja não busca realeza física nem luta com armas carnais." }
                ]
            },
            {
                q: "Como os crentes devem responder às autoridades civis, segundo o capítulo 2?",
                options: [
                    { t: "Submetendo-se por amor do Senhor a toda instituição humana.", c: true, r: "1 Pedro 2:13 exorta à submissão pacífica como testemunho do Evangelho." },
                    { t: "Iniciando revoltas armadas para derrubar o imperador.", c: false, r: "O cristianismo primitivo não se envolveu em rebeliões militares contra Roma." },
                    { t: "Ignorando as leis tributárias e civis do império.", c: false, r: "Os cristãos eram orientados a pagar impostos e agir com honestidade pública." },
                    { t: "Criando um reino isolado em regiões desérticas.", c: false, r: "Eles eram chamados a viver exemplary no meio da sociedade pagã." }
                ]
            },
            {
                q: "Qual o exemplo que Jesus deixou ao sofrer injustamente, segundo 1 Pedro 2:23?",
                options: [
                    { t: "Ele amaldiçoou Seus carrascos.", c: false, r: "Jesus manteve silêncio e amor sacrificial." },
                    { t: "Ele não injuriava e não ameaçava, mas entregava-se Àquele que julga justamente.", c: true, r: "Ele demonstrou perfeita submissão e confiança na justiça divina do Pai." },
                    { t: "Ele exigiu a defesa imediata das hostes celestes.", c: false, r: "Embora pudesse pedir legiões de anjos, escolheu sofrer voluntariamente." },
                    { t: "Ele escapou milagrosamente da cruz usando poder divino.", c: false, r: "Ele sofreu na carne real do Seu corpo até o fim." }
                ]
            },
            {
                q: "Por que os maridos devem tratar suas esposas com respeito e consideração (Capítulo 3)?",
                options: [
                    { t: "Para que as suas orações não sejam interrompidas.", c: true, r: "1 Pedro 3:7 adverte que o desajuste e maltrato no lar bloqueiam as orações do marido." },
                    { t: "Apenas para manter as aparências na comunidade local.", c: false, r: "A motivação é sincera, espiritual e diante do trono de Deus." },
                    { t: "Porque a lei romana impunha severas multas.", c: false, r: "A lei romana concedia imenso poder ao marido; a regra cristã é que era revolucionária." },
                    { t: "Para evitar a divisão de bens em processos jurídicos.", c: false, r: "O casamento é tratado sob lentes eternas e espirituais." }
                ]
            },
            {
                q: "O que significa estar pronto para apresentar uma 'apologia' (Capítulo 3)?",
                options: [
                    { t: "Apresentar uma defesa racional e mansa da razão da vossa esperança.", c: true, r: "A palavra grega 'apologia' refere-se à apresentação de razões sólidas para a fé cristã." },
                    { t: "Pedir desculpas contínuas aos perseguidores pagãos.", c: false, r: "O termo não significa pedir desculpas, mas sim defender posições." },
                    { t: "Escrever poemas sobre a vida futura nos céus.", c: false, r: "A defesa exige clareza doutrinária diante de opositores." },
                    { t: "Declarar guerra teológica com insultos espirituais.", c: false, r: "A defesa apologética deve ser exercida com mansidão e profundo temor." }
                ]
            },
            {
                q: "Que atitude Pedro destaca como prioridade máxima na igreja diante do fim das coisas (Capítulo 4)?",
                options: [
                    { t: "Ter amor fervoroso uns para com os outros, pois o amor cobre multidão de pecados.", c: true, r: "1 Pedro 4:8 exalta o amor prático e perdoador na vida comunitária." },
                    { t: "Arrecadar fundos para construir novos santuários.", c: false, r: "O foco está nas relações internas e no cuidado mútuo." },
                    { t: "Abandonar todo tipo de trabalho social secular.", c: false, r: "O trabalho exemplar deve prosseguir para glorificar a Deus." },
                    { t: "Buscar sinais miraculosos diários em praças públicas.", c: false, r: "Pedro prioriza a sobriedade, oração, amor e dons espirituais de serviço." }
                ]
            },
            {
                q: "Qual é a exortação de Pedro aos líderes e pastores da igreja em 1 Pedro 5?",
                options: [
                    { t: "Apascentar o rebanho voluntariamente, não por ganância, mas sendo modelos.", c: true, r: "O pastorado deve ser exercido com integridade, voluntariedade e exemplo prático." },
                    { t: "Cobrar tributos e governar com cetro de ferro.", c: false, r: "Pedro proíbe expressamente o domínio tirânico sobre a herança de Deus." },
                    { t: "Isolar as ovelhas frágeis para evitar infecções espirituais.", c: false, r: "O pastor deve cuidar ativamente de todo o rebanho com amor." },
                    { t: "Delegar todo o trabalho às ovelhas mais jovens.", c: false, r: "Pedro exige dedicação direta e vigilância dos presbíteros." }
                ]
            },
            {
                q: "Quem é o adversário espiritual descrito por Pedro e como ele age?",
                options: [
                    { t: "O Diabo, que ruge como leão buscando a quem possa devorar.", c: true, r: "1 Pedro 5:8 alerta para a vigilância contra o diabo que busca destruir a fé." },
                    { t: "O exército romano marchando sob estandartes de águia.", c: false, r: "Embora Roma perseguisse, Pedro identifica a força por trás como o Diabo." },
                    { t: "O falso profeta que tenta enganar através de magia física.", c: false, r: "A metáfora do leão devorador é especificamente associada ao Diabo." },
                    { t: "A preguiça física que afasta os homens das orações.", c: false, r: "O oponente citado é o adversário pessoal e espiritual da igreja." }
                ]
            }
        ];

        // Embaralhar as perguntas do banco de 15 e selecionar apenas 10
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const selectedQuestions = shuffle([...quizData]).slice(0, 10);

        let currentQ = 0; let score = 0; let answered = false;
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackContainer = document.getElementById('feedbackContainer');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');

        function loadQuestion() {
            answered = false; feedbackContainer.classList.add('hidden'); nextBtn.classList.add('hidden');
            const qData = selectedQuestions[currentQ];
            document.getElementById('questionCounter').innerText = `${currentQ + 1} / ${selectedQuestions.length}`;
            questionText.innerText = qData.q;
            optionsContainer.innerHTML = '';
            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-lg bg-slate-800/80 border border-slate-600 text-slate-300 text-sm md:text-base';
                btn.innerText = opt.t;
                btn.onclick = () => selectOption(btn, opt);
                optionsContainer.appendChild(btn);
            });
            progressBar.style.width = `${(currentQ / selectedQuestions.length) * 100}%`;
        }

        function selectOption(btn, opt) {
            if (answered) return; answered = true;
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
            
            feedbackContainer.classList.remove('hidden', 'bg-red-900/30', 'border-red-500/50', 'bg-green-900/30', 'border-green-500/50');
            if (opt.c) {
                score += 10; btn.classList.add('option-correct');
                feedbackContainer.classList.add('bg-green-900/30', 'border-green-500/50', 'text-green-200');
                feedbackContainer.innerHTML = `<strong>Correto!</strong> ${opt.r}`;
            } else {
                btn.classList.add('option-wrong');
                feedbackContainer.classList.add('bg-red-900/30', 'border-red-500/50', 'text-red-200');
                feedbackContainer.innerHTML = `<strong>Incorreto.</strong> ${opt.r}`;
                buttons.forEach((b, i) => { if(selectedQuestions[currentQ].options[i].c) b.classList.add('option-correct'); });
            }
            nextBtn.classList.remove('hidden');
        }

        nextBtn.onclick = () => {
            currentQ++;
            if (currentQ < selectedQuestions.length) loadQuestion();
            else showResults();
        };

        function showResults() {
            progressBar.style.width = '100%';
            document.getElementById('quizContainer').classList.add('hidden');
            const res = document.getElementById('resultContainer');
            res.classList.remove('hidden'); res.classList.add('flex');
            document.getElementById('finalScore').innerText = score/10;
            document.getElementById('inputPontos').value = score;
            document.getElementById('inputAcertos').value = score/10;
        }

        document.getElementById('rankingForm').onsubmit = function(e) {
            e.preventDefault();
            const btn = this.querySelector('button'); btn.disabled = true; btn.innerText = "Salvando...";
            fetch('api.php', { method: 'POST', body: new FormData(this) })
            .then(() => window.location.href = 'index.html')
            .catch(() => {
                alert("Ocorreu um erro ao salvar sua pontuação no ranking.");
                window.location.href = 'index.html';
            });
        };

        // Particles
        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<50; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, sx: Math.random()*0.5-0.25, sy: Math.random()*0.5-0.25 });
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "rgba(56, 189, 248, 0.2)"; /* Sky Blue */
            particles.forEach(p => { p.x+=p.sx; p.y+=p.sy; if(p.x<0||p.x>canvas.width)p.sx*=-1; if(p.y<0||p.y>canvas.height)p.sy*=-1; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animate);
        }
        animate();
        loadQuestion();
    </script>
</body>
</html>
