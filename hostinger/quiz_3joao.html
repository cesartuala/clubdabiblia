<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 3 João | Clube da Bíblia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Lato', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #050510; color: #e2e8f0; overflow-x: hidden; }
        .glass-card { background: rgba(15, 15, 35, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(253, 164, 175, 0.2); transition: all 0.4s ease; }
        .rose-glow { text-shadow: 0 0 15px rgba(253, 164, 175, 0.5); }
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        .option-btn { transition: all 0.3s ease; }
        .option-btn:hover:not(:disabled) { transform: translateX(5px); background-color: rgba(244, 63, 94, 0.15); border-color: #f43f5e; }
        .option-correct { background-color: rgba(16, 185, 129, 0.2) !important; border-color: #10b981 !important; color: #34d399 !important; }
        .option-wrong { background-color: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; color: #f87171 !important; }
    </style>
</head>
<body class="font-sans antialiased flex flex-col min-h-screen">

    <canvas id="particles-js"></canvas>

    <nav class="w-full z-50 p-6 flex justify-between items-center relative">
        <a href="index.html" class="group flex items-center gap-2 px-4 py-2 rounded-lg bg-[#0a0a1a] border border-rose-500/50 text-rose-400 hover:bg-rose-500 hover:text-black transition-all">
            <i class="fa-solid fa-chevron-left text-sm group-hover:-translate-x-1 transition-transform"></i>
            <span class="hidden md:inline text-xs uppercase tracking-widest font-bold">Voltar ao Início</span>
        </a>
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-hospital-user text-rose-400 text-xl"></i>
            <span class="font-serif text-white text-lg tracking-widest font-bold">CLUBE DA BÍBLIA</span>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 relative z-10 w-full max-w-3xl mx-auto">
        <div class="glass-card rounded-2xl w-full flex flex-col relative overflow-hidden shadow-[0_0_40px_rgba(253,164,175,0.15)]">
            <div class="h-1 w-full bg-gradient-to-r from-rose-500 via-rose-400 to-rose-300" id="progressBar"></div>
            
            <div class="p-6 md:p-10 flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-rose-500/20 pb-4">
                    <h1 class="font-serif text-2xl md:text-3xl text-white rose-glow">Quiz: 3 João</h1>
                    <span id="questionCounter" class="bg-rose-950/50 text-rose-300 px-3 py-1 rounded-full text-xs font-bold tracking-widest border border-rose-500/30">1 / 10</span>
                </div>

                <div id="quizContainer">
                    <div id="questionText" class="text-lg md:text-xl text-slate-200 mb-6 font-light leading-relaxed"></div>
                    <div id="optionsContainer" class="space-y-3"></div>
                    <div id="feedbackContainer" class="mt-6 p-4 rounded-lg hidden text-sm leading-relaxed border"></div>

                    <button id="nextBtn" class="mt-8 w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg transition uppercase tracking-widest hidden shadow-lg shadow-rose-900/50">
                        Próxima Pergunta <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>

                <div id="resultContainer" class="hidden flex-col items-center text-center py-8">
                    <i class="fa-solid fa-crown text-6xl text-rose-400 mb-4 drop-shadow-[0_0_15px_rgba(253,164,175,0.6)]"></i>
                    <h2 class="font-serif text-3xl text-white mb-2">Vitória em Cristo!</h2>
                    <p class="text-slate-300 text-lg mb-6">Você acertou <span id="finalScore" class="text-rose-400 font-bold text-2xl">0</span> de 10 perguntas.</p>
                    
                    <div class="w-full max-w-sm bg-slate-900/80 p-6 rounded-xl border border-slate-700">
                        <h3 class="text-xs uppercase tracking-widest text-rose-400 mb-4 font-bold">Salvar no Ranking</h3>
                        <form id="rankingForm" class="space-y-4">
                            <input type="hidden" name="acao" value="salvar_quiz_3joao">
                            <input type="hidden" name="pontos" id="inputPontos" value="0">
                            <input type="hidden" name="acertos" id="inputAcertos" value="0">
                            <input type="text" name="nome" required placeholder="Seu Nome..." class="w-full bg-slate-800 border border-slate-600 rounded px-4 py-2 text-white focus:border-rose-500 focus:outline-none transition text-sm">
                            <button type="submit" class="w-full bg-gradient-to-r from-rose-600 to-rose-400 text-white font-bold py-2 rounded transition uppercase tracking-widest text-xs shadow-lg">Enviar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const quizData = [
            {
                q: "A quem se destina pessoalmente a terceira epístola de João?",
                options: [
                    { t: "A Timóteo, companheiro de Paulo", c: false, r: "A epístola é endereçada exclusivamente ao amado Gaio." },
                    { t: "Ao presbítero Diótrefes", c: false, r: "Diótrefes é repreendido na carta, e não o destinatário dela." },
                    { t: "Ao amado Gaio", c: true, r: "Gaio é o amado destinatário da carta, elogiado por sua hospitalidade." },
                    { t: "A Demétrio, líder da igreja", c: false, r: "Demétrio é recomendado na carta, mas não o destinatário principal." }
                ]
            },
            {
                q: "Com qual título o autor de 3 João se identifica no primeiro versículo?",
                options: [
                    { t: "O Apóstolo", c: false, r: "Ele se identifica sob a dignidade pastoral de presbítero." },
                    { t: "O Presbítero", c: true, r: "Ele inicia a carta identificando-se simplesmente como 'o presbítero'." },
                    { t: "O Servo de Cristo", c: false, r: "Esse é o título de Tiago e Judas, não o de João nesta epístola." },
                    { t: "O Profeta", c: false, r: "Ele não usa a designação profética diretamente." }
                ]
            },
            {
                q: "Qual é o principal desejo expressado por João para Gaio no versículo 2?",
                options: [
                    { t: "Que ele realize milagres extraordinários", c: false, r: "O milagre focado é a hospitalidade diária." },
                    { t: "Que ele viaje para visitá-lo urgentemente", c: false, r: "João queria vê-lo, mas a oração de saúde precede isso." },
                    { t: "Que ele prospere em tudo e tenha saúde, assim como sua alma", c: true, r: "João deseja prosperidade material/física e saúde alinhadas à saúde espiritual." },
                    { t: "Que ele assuma a liderança no lugar de Diótrefes", c: false, r: "Ele foca no bem-estar integral de Gaio." }
                ]
            },
            {
                q: "O que causou o maior gozo e alegria para o coração de João?",
                options: [
                    { t: "A expansão numérica acelerada do templo", c: false, r: "A integridade espiritual dos crentes supera a quantidade." },
                    { t: "Ouvir que seus filhos andam na verdade", c: true, r: "João declara: 'Não tenho maior gozo do que este: o de ouvir que os meus filhos andam na verdade'." },
                    { t: "A construção de novas sinagogas cristãs", c: false, r: "O templo neotestaamentário é o homem regenerado." },
                    { t: "O martírio pacífico dos novos discípulos", c: false, r: "O foco é a caminhada cotidiana na verdade." }
                ]
            },
            {
                q: "Por que os obreiros itinerantes saíram para o campo missionário?",
                options: [
                    { t: "Por causa do Nome de Jesus", c: true, r: "Eles saíram 'pelo amor do seu Nome' sem aceitar nada dos gentios." },
                    { t: "Para fugir da grande perseguição romana", c: false, r: "O motivo principal foi a expansão ativa do evangelho." },
                    { t: "Para comercializar as cartas apostólicas", c: false, r: "As cartas não eram vendidas, mas copiadas e distribuídas." },
                    { t: "Por ordem imperial do próprio César", c: false, r: "A ordem foi a Grande Comissão de Cristo." }
                ]
            },
            {
                q: "Qual era a falha grave demonstrada por Diótrefes na comunidade?",
                options: [
                    { t: "Ele ensinava o gnosticismo abertamente", c: false, r: "O pecado citado de Diótrefes é o autoritarismo e a falta de hospitalidade." },
                    { t: "Ele gostava de ter a primazia e não os recebia", c: true, r: "João afirma que Diótrefes amava ser o primeiro e recusava as instruções apostólicas." },
                    { t: "Ele roubava a tesouraria da congregação", c: false, r: "Esse pecado foi de Judas Iscariotes, não Diótrefes." },
                    { t: "Ele negava que Jesus viera em carne", c: false, r: "Essa foi a heresia denunciada em 1 João e 2 João." }
                ]
            },
            {
                q: "O que Diótrefes fazia com as pessoas que queriam hospedar os irmãos?",
                options: [
                    { t: "Ele as obrigava a pagar multas pesadas", c: false, r: "A punição era de exclusão comunitária." },
                    { t: "Ele as expulsava da igreja", c: true, r: "Diótrefes proibia a hospitalidade e expulsava da igreja os que acolhiam os irmãos." },
                    { t: "Ele as enviava como escravos para Roma", c: false, r: "Ele não possuía autoridade jurídica estatal civil." },
                    { t: "Ele as consagrava ao pastorado", c: false, r: "Ele não apoiava a generosidade voluntária deles." }
                ]
            },
            {
                q: "Segundo o versículo 11, o que João aconselha a Gaio?",
                options: [
                    { t: "Não sigas o mal, mas o bem", c: true, r: "Ele diz: 'Amado, não sigas o mal, mas o bem. Quem faz o bem é de Deus'." },
                    { t: "Vende tudo o que tens e dá aos pobres", c: false, r: "Esse foi o conselho de Jesus ao jovem rico, não de João nesta carta." },
                    { t: "Foge imediatamente da Ásia Menor", c: false, r: "O conselho é de resistência de fé e fidelidade prática." },
                    { t: "Procura pregar nas praças públicas de Éfeso", c: false, r: "O foco aqui é o caráter interno e hospitalidade da comunidade." }
                ]
            },
            {
                q: "Qual personagem é citado por receber excelente testemunho de todos e da própria Verdade?",
                options: [
                    { t: "Ananias", c: false, r: "Ananias não é mencionado nesta carta." },
                    { t: "Diótrefes", c: false, r: "Diótrefes recebeu severa repreensão." },
                    { t: "Demétrio", c: true, r: "Demétrio é elogiado e possui recomendação direta da verdade e do próprio João." },
                    { t: "Filemon", c: false, r: "Filemon é destinatário de outra carta de Paulo." }
                ]
            },
            {
                q: "Como João planejava se comunicar de forma definitiva com Gaio?",
                options: [
                    { t: "Através de mensageiros gentios", c: false, r: "A comunicação seria pessoal." },
                    { t: "Escrevendo com mais tinta e pena", c: false, r: "João diz expressamente que não quer escrever com papel e tinta." },
                    { t: "Face a face, falando de boca a boca", c: true, r: "Ele espera vê-lo brevemente e conversar face a face." },
                    { t: "Por meio de uma grande visão profética", c: false, r: "A visão profética foi registrada no Apocalipse." }
                ]
            },
            {
                q: "No contexto da igreja neotestamentária, o que significa 'philoxenia'?",
                options: [
                    { t: "Amor aos estrangeiros e hospitalidade", c: true, r: "Vem das palavras gregas para 'amor' e 'estranho'." },
                    { t: "Aversão aos gentios convertidos", c: false, r: "Pelo contrário, é a plena acolhida deles." },
                    { t: "O dom de pregar em idiomas desconhecidos", c: false, r: "Isso se refere à glossolalia." },
                    { t: "O orgulho de exercer cargos superiores", c: false, r: "Isso se assemelha à primazia demonstrada por Diótrefes." }
                ]
            },
            {
                q: "De quem os missionários elogiados por João não aceitavam nenhum sustento?",
                options: [
                    { t: "Dos presbíteros locais", c: false, r: "Os presbíteros fáceis deveriam apoiá-los." },
                    { t: "Dos gentios", c: true, r: "Eles partiram sem receber nada dos pagãos (gentios) para evitar o escândalo." },
                    { t: "Dos apóstolos em Jerusalém", c: false, r: "O sustento vinha das igrejas aliadas." },
                    { t: "Das mulheres viúvas", c: false, r: "Eles dependiam da generosidade legítima de todos os fiéis." }
                ]
            },
            {
                q: "O que João promete fazer se for visitar a igreja de Diótrefes?",
                options: [
                    { t: "Trazer à memória as obras que ele faz, proferindo palavras maliciosas", c: true, r: "João confrontará as fofocas e atitudes arrogantes de Diótrefes." },
                    { t: "Pedir a prisão civil dele aos soldados romanos", c: false, r: "A punição é de ordem espiritual e eclesiástica." },
                    { t: "Expulsar toda a congregação sem julgamento", c: false, r: "O julgamento seria focado na liderança de Diótrefes." },
                    { t: "Realizar um culto ecumênico solene", c: false, r: "João preza pela defesa severa da Verdade doutrinária." }
                ]
            },
            {
                q: "Qual saudação final João envia aos crentes de 3 João?",
                options: [
                    { t: "A paz seja contigo. Os amigos te saúdam", c: true, r: "Ele encerra: 'A paz seja contigo. Os amigos te saúdam. Saúda os amigos nominalmente'." },
                    { t: "O Senhor está prestes a voltar", c: false, r: "Saudação comum, mas não a literal de encerramento desta carta." },
                    { t: "Guardai-vos dos falsos deuses", c: false, r: "Esse é o encerramento de 1 João." },
                    { t: "A graça de nosso Senhor Jesus seja com todos", c: false, r: "Essa fórmula encerra a maioria das epístolas paulinas." }
                ]
            },
            {
                q: "A frase 'Quem faz o mal não tem visto a Deus' indica o quê?",
                options: [
                    { t: "Que as obras ruins impedem a visão física de Deus", c: false, r: "Deus é espírito e invisível aos olhos carnais." },
                    { t: "Que a conduta moral e ética reflete o real conhecimento de Deus", c: true, r: "Quem vive na maldade demonstra não possuir uma comunhão real com o Pai." },
                    { t: "Que Diótrefes era cego de nascimento", c: false, r: "Trata-se de uma metáfora espiritual da alma." },
                    { t: "Que os gentios não podem se salvar de forma alguma", c: false, r: "Gentios e judeus são reconciliados pelo evangelho." }
                ]
            }
        ];

        // Embaralha e seleciona 10 questões
        const shuffledQuiz = quizData.sort(() => 0.5 - Math.random()).slice(0, 10);

        let currentQ = 0; let score = 0; let answered = false;
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackContainer = document.getElementById('feedbackContainer');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');

        function loadQuestion() {
            answered = false; feedbackContainer.classList.add('hidden'); nextBtn.classList.add('hidden');
            const qData = shuffledQuiz[currentQ];
            document.getElementById('questionCounter').innerText = `${currentQ + 1} / 10`;
            questionText.innerText = qData.q;
            optionsContainer.innerHTML = '';
            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-lg bg-slate-800/80 border border-slate-600 text-slate-300 text-sm md:text-base';
                btn.innerText = opt.t;
                btn.onclick = () => selectOption(btn, opt);
                optionsContainer.appendChild(btn);
            });
            progressBar.style.width = `${(currentQ / 10) * 100}%`;
        }

        function selectOption(btn, opt) {
            if (answered) return; answered = true;
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);
            
            feedbackContainer.classList.remove('hidden', 'bg-red-900/30', 'border-red-500/50', 'bg-green-900/30', 'border-green-500/50');
            if (opt.c) {
                score += 10; btn.classList.add('option-correct');
                feedbackContainer.classList.add('bg-green-900/30', 'border-green-500/50', 'text-green-200');
                feedbackContainer.innerHTML = `<strong>Correto!</strong> ${opt.r}`;
            } else {
                btn.classList.add('option-wrong');
                feedbackContainer.classList.add('bg-red-900/30', 'border-red-500/50', 'text-red-200');
                feedbackContainer.innerHTML = `<strong>Incorreto.</strong> ${opt.r}`;
                buttons.forEach((b, i) => { if(shuffledQuiz[currentQ].options[i].c) b.classList.add('option-correct'); });
            }
            nextBtn.classList.remove('hidden');
        }

        nextBtn.onclick = () => {
            currentQ++;
            if (currentQ < 10) loadQuestion();
            else showResults();
        };

        function showResults() {
            progressBar.style.width = '100%';
            document.getElementById('quizContainer').classList.add('hidden');
            const res = document.getElementById('resultContainer');
            res.classList.remove('hidden'); res.classList.add('flex');
            document.getElementById('finalScore').innerText = score/10;
            document.getElementById('inputPontos').value = score;
            document.getElementById('inputAcertos').value = score/10;
        }

        document.getElementById('rankingForm').onsubmit = function(e) {
            e.preventDefault();
            const btn = this.querySelector('button'); btn.disabled = true; btn.innerText = "Salvando...";
            fetch('api.php', { method: 'POST', body: new FormData(this) })
            .then(() => window.location.href = 'index.html');
        };

        // Particles
        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<50; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, sx: Math.random()*0.5-0.25, sy: Math.random()*0.5-0.25 });
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "rgba(253, 164, 175, 0.2)";
            particles.forEach(p => { p.x+=p.sx; p.y+=p.sy; if(p.x<0||p.x>canvas.width)p.sx*=-1; if(p.y<0||p.y>canvas.height)p.sy*=-1; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animate);
        }
        animate();
        loadQuestion();
    </script>
</body>
</html>
