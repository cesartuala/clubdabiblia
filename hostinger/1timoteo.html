    <script>
        const bibleData = {
            "intro_book": {
                title: "A PRIMEIRA CARTA A TIMÓTEO",
                date: null,
                desc: "<span class='text-xs uppercase tracking-[0.3em] text-green-400 not-italic block mb-4'>Introdução: Sobre o Livro</span>\"Instruções para a boa ordem na casa de Deus.\"",
                blocks: [
                    {
                        title: "Manual de Liderança e Doutrina",
                        verse: "Escrevo-te estas coisas, esperando ir ter contigo breve; mas, se tardar, para que saibas como convém andar na casa de Deus, que é a igreja do Deus vivo, a coluna e firmeza da verdade. (1 Tm 3:14-15)",
                        exegesis: `
                            <h3>1. As Epístolas Pastorais</h3>
                            <ul>
                                <li>As cartas de 1 Timóteo, 2 Timóteo e Tito são conhecidas como "Epístolas Pastorais" porque fornecem diretrizes essenciais para os líderes da igreja e para a conduta da comunidade cristã. 1 Timóteo é um manual prático para a organização e a vida de uma igreja local, focado na sã doutrina e na piedade. Paulo, o experiente arquiteto da igreja, transmite sua sabedoria a Timóteo, seu jovem discípulo e "verdadeiro filho na fé", que estava pastoreando a igreja em Éfeso.</li>
                            </ul>
                            
                            <h3>2. Combate à Falsa Doutrina</h3>
                            <ul>
                                <li>Um dos temas mais urgentes de 1 Timóteo é a necessidade de combater as falsas doutrinas que se infiltravam na igreja. Paulo adverte sobre mestres que se desviavam da verdade, promovendo "fábulas e genealogias intermináveis" (1 Tm 1:4). O apóstolo enfatiza que o objetivo do mandamento é o amor que procede de um coração puro, de uma boa consciência e de uma fé não fingida (1 Tm 1:5). A sã doutrina não é um fim em si mesma, mas um meio para produzir vidas piedosas e comunidades saudáveis.</li>
                            </ul>

                            <h3>3. A Ordem na Igreja</h3>
                            <ul>
                                <li>A carta também estabelece princípios para a adoração pública, o papel das mulheres, as qualificações para presbíteros (bispos) e diáconos, e o tratamento de viúvas e outros grupos na igreja. Paulo está preocupado com a reputação da igreja e com o testemunho que ela dá ao mundo. A "casa de Deus" deve refletir a verdade e a santidade de seu Senhor, e Timóteo é instruído a garantir que essa ordem seja mantida. A palavra grega para "superintendente" ou "bispo" é <i>(epískopos - ἐπίσκοπος - supervisor)</i>, denotando a função de cuidado e liderança espiritual.</li>
                            </ul>
                        `
                    }
                ]
            },
            "intro_author": {
                title: "SOBRE O AUTOR E SEU DISCÍPULO",
                date: null,
                desc: "\"Paulo, apóstolo de Jesus Cristo, por mandado de Deus nosso Salvador, e do Senhor Jesus Cristo, esperança nossa, a Timóteo, meu verdadeiro filho na fé...\"",
                blocks: [
                    {
                        title: "De Mentor a Mentorado: O Legado de Paulo",
                        verse: "Combate o bom combate da fé, toma posse da vida eterna, para a qual também foste chamado, e fizeste a boa confissão perante muitas testemunhas. (1 Tm 6:12)",
                        exegesis: `
                            <h3>1. Paulo: O Apóstolo Incansável</h3>
                            <ul>
                                <li>O apóstolo Paulo é o autor indiscutível de 1 Timóteo. Esta carta foi provavelmente escrita após sua libertação de sua primeira prisão romana, entre os anos 62-64 d.C., durante um período de liberdade missionária antes de sua prisão final e martírio. Paulo havia deixado Timóteo em Éfeso para organizar a igreja local e enfrentar os desafios doutrinários e morais que surgiam. Sua paixão por Cristo e pela pureza do evangelho brilha em cada linha, especialmente ao instruir seu jovem protegido.</li>
                            </ul>

                            <h3>2. Timóteo: O Jovem Discípulo Tímido</h3>
                            <ul>
                                <li>Timóteo, cujo nome significa <i>(Timótheos - Τιμόθεος - Honrado por Deus)</i>, foi um dos companheiros mais próximos e leais de Paulo. Ele era de Listra, filho de mãe judia crente e pai grego (Atos 16:1-3). Paulo o circuncidou por causa dos judeus na região, demonstrando sua flexibilidade cultural para o bem do evangelho. Apesar de sua juventude e de uma possível timidez ou saúde frágil (1 Tm 5:23), Timóteo era um pastor dedicado, e Paulo frequentemente o exortava a ser corajoso e a não deixar que ninguém desprezasse sua juventude (1 Tm 4:12).</li>
                            </ul>

                            <h3>3. A Urgência da Missão</h3>
                            <ul>
                                <li>A relação entre Paulo e Timóteo é um modelo de mentoria ministerial. Paulo investiu profundamente em Timóteo, treinando-o e confiando-lhe responsabilidades significativas. A urgência da carta reflete a preocupação de Paulo com a saúde das igrejas. Ele sabia que a sã doutrina e a liderança piedosa eram cruciais para a sobrevivência e o florescimento da fé cristã em um mundo hostil e cheio de heresias. A incumbência de Timóteo era monumental: proteger o rebanho, ensinar a verdade e estabelecer uma estrutura sólida para o futuro da igreja em Éfeso.</li>
                            </ul>
                        `
                    }
                ]
            },
            "1timoteo_1": {
                title: "O PROPÓSITO DA LEI E O CHAMADO DE PAULO",
                date: "07/05 (Terça)",
                desc: "\"O fim do mandamento é a caridade de um coração puro, e de uma boa consciência, e de uma fé não fingida.\"",
                blocks: [
                    {
                        title: "Amor, Consciência Pura e Fé Sincera",
                        verse: "Para que mandasses a alguns que não ensinem outra doutrina, nem se deem a fábulas e genealogias intermináveis, que mais produzem questões do que edificação de Deus, que consiste na fé. (1 Tm 1:3-4)",
                        exegesis: `
                            <h3>1. A Advertência Contra Falsas Doutrinas</h3>
                            <ul>
                                <li>Paulo inicia sua carta instruindo Timóteo a combater os falsos mestres que estavam distorcendo a mensagem do evangelho. Esses mestres se dedicavam a "fábulas e genealogias intermináveis", que eram provavelmente especulações gnósticas ou ensinamentos judaicos legalistas que desviavam a atenção da verdade central de Cristo. A advertência de Paulo é crucial: o foco não deve ser em debates estéreis, mas na edificação que vem da fé. Ele usa a palavra <i>(didaskalía - διδασκαλία - ensino/doutrina)</i> para enfatizar a importância da instrução correta.</li>
                            </ul>
                            
                            <h3>2. O Verdadeiro Propósito da Lei</h3>
                            <ul>
                                <li>Paulo esclarece que o "fim do mandamento" (o objetivo da Lei de Deus) não é gerar legalismo ou debates intermináveis, mas sim produzir amor que flui de um coração puro, uma boa consciência e uma fé sincera. A Lei revela o pecado e aponta para a necessidade de um Salvador, mas não é um meio para a salvação ou para justificar-se diante de Deus. Ela é para os injustos e pecadores, para revelar sua transgressão, não para ser um fardo sobre os já justificados pela fé em Cristo.</li>
                            </ul>

                            <h3>3. O Testemunho da Graça de Paulo</h3>
                            <ul>
                                <li>Em um testemunho poderoso, Paulo relembra sua própria conversão, declarando-se o "principal dos pecadores" (1 Tm 1:15). Ele, que antes blasfemava e perseguia a igreja, foi alcançado pela superabundante graça de Deus. Essa experiência pessoal de redenção serve como um exemplo vivo da misericórdia de Cristo e da verdade do evangelho. O apóstolo enfatiza que a sua salvação foi para que ele servisse de padrão aos que, posteriormente, creriam para a vida eterna. Sua vida é uma prova viva de que a graça de Deus é maior do que qualquer pecado.</li>
                            </ul>
                        `
                    }
                ]
            },
            "1timoteo_2": {
                title: "ORAÇÃO E ORDEM NA ADORAÇÃO PÚBLICA",
                date: "08/05 (Quarta)",
                desc: "\"Quero, pois, que os homens orem em todo o lugar, levantando mãos santas, sem ira nem contenda.\"",
                blocks: [
                    {
                        title: "Prioridade na Oração e Comportamento Adequado",
                        verse: "Admoesto-te, pois, antes de tudo, que se façam deprecações, orações, intercessões, e ações de graças, por todos os homens; pelos reis, e por todos os que estão em eminência. (1 Tm 2:1-2)",
                        exegesis: `
                            <h3>1. A Importância da Oração Intercessória</h3>
                            <ul>
                                <li>Paulo começa o capítulo exortando a Timóteo sobre a prioridade da oração na vida da igreja. Ele especifica diferentes tipos de oração: "deprecações" (pedidos por necessidades), "orações" (adoração geral), "intercessões" (pedidos em favor de outros) e "ações de graças". Essas orações devem ser feitas por "todos os homens", incluindo autoridades governamentais ("reis e por todos os que estão em eminência"). O objetivo é viver uma vida tranquila e sossegada, em toda piedade e honestidade, o que é agradável a Deus, nosso Salvador. A palavra <i>(enteuxeis - ἐντεύξεις - intercessões)</i> destaca o ato de se aproximar de Deus em favor de outros.</li>
                            </ul>
                            
                            <h3>2. Um Só Deus, Um Só Mediador</h3>
                            <ul>
                                <li>O fundamento teológico para a oração universal é que Deus "quer que todos os homens se salvem e venham ao conhecimento da verdade". Há um só Deus e "um só Mediador entre Deus e os homens, Jesus Cristo homem" (1 Tm 2:5). Jesus, por ser totalmente Deus e totalmente homem, é o único que pode fazer a ponte entre a humanidade pecadora e um Deus santo. Sua autoentrega na cruz como "resgate por todos" valida a universalidade do desejo de Deus pela salvação e a singularidade de Cristo como caminho.</li>
                            </ul>

                            <h3>3. O Comportamento de Homens e Mulheres na Igreja</h3>
                            <ul>

        let currentAudioBlob = null;

        function loadChapter(chapterKey) {
            const data = bibleData[chapterKey];
            if (!data) return;

            const heroTitle = document.getElementById('heroTitle');
            const heroDesc = document.getElementById('heroDesc');
            const dateBadge = document.getElementById('dateBadge');
            const dateValue = document.getElementById('dateValue');
            const communitySection = document.getElementById('community-section');
            const formChapterKey = document.getElementById('formChapterKey');
            
            heroTitle.style.opacity = '0';
            heroDesc.style.opacity = '0';
            dateBadge.style.opacity = '0';
            
            setTimeout(() => {
                if (data.date) {
                    dateValue.textContent = data.date;
                    dateBadge.classList.remove('hidden');
                    communitySection.classList.remove('hidden');
                    formChapterKey.value = chapterKey;
                    carregarComentarios(chapterKey);
                    setTimeout(() => { dateBadge.style.opacity = '1'; }, 100);
                } else {
                    dateBadge.classList.add('hidden');
                    communitySection.classList.add('hidden');
                }

                heroTitle.innerHTML = data.title;
                heroDesc.innerHTML = data.desc;
                heroTitle.style.opacity = '1';
                heroDesc.style.opacity = '1';
            }, 300);

            const mainContent = document.getElementById('content');
            mainContent.innerHTML = ''; 

            data.blocks.forEach((block) => {
                let borderColor = 'border-green-600';
                let blurTop = 'bg-green-600/5';
                let blurBottom = 'bg-green-800/5';
                let borderPanel = 'border-green-900/30';

                const html = `
                    <section class="reveal max-w-4xl mx-auto w-full relative">
                        <div class="absolute -inset-4 ${blurTop} to-transparent rounded-3xl blur-xl pointer-events-none"></div>
                        
                        <div class="space-y-6 relative z-10">
                            <div class="text-center mb-10">
                                <h2 class="text-3xl md:text-5xl font-serif text-white leading-tight mb-6">${block.title}</h2>
                                <div class="inline-block border-l-4 border-r-4 ${borderColor} px-6 py-4 italic text-slate-300 bg-[#0a140a]/50 shadow-sm max-w-3xl rounded-sm">
                                    "${block.verse}"
                                </div>
                            </div>
                            
                            <div class="bg-[#050510]/80 p-8 md:p-12 rounded-xl border ${borderPanel} transition shadow-2xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 ${blurTop} rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                                <div class="absolute bottom-0 left-0 w-64 h-64 ${blurBottom} rounded-full blur-3xl -ml-20 -mb-20 pointer-events-none"></div>

        function carregarComentarios(capitulo) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<p class="text-center text-slate-500 text-sm animate-pulse">Carregando comentários...</p>';

            fetch(`api.php?acao=listar&capitulo=${capitulo}`)
            .then(res => {
                if (!res.ok) {
                    throw new Error('Network response was not ok');
                }
                return res.json();
            })
            .then(data => {
                list.innerHTML = '';
                if(!Array.isArray(data)) { // CRITICAL: Validate data is an array
                    list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao processar comentários: Dados inválidos.</p>';
                    console.error('Dados de comentários recebidos não são um array:', data);
                    return;
                }
                if(data.length === 0) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                data.forEach(c => {
                    let mediaHtml = '';
                    if(c.foto) mediaHtml += `<img src="${c.foto}" onclick="openImage(this.src)" class="mt-4 rounded-lg max-h-48 border border-slate-700 cursor-pointer hover:scale-[1.02] transition shadow-lg">`;
                    if(c.audio) mediaHtml += `<audio controls src="${c.audio}" class="mt-4 w-full"></audio>`;

                    const jaCurtiu = localStorage.getItem(`reagiu_likes_${c.id}`);
                    const jaAmem = localStorage.getItem(`reagiu_amem_${c.id}`);
                    const jaGloria = localStorage.getItem(`reagiu_gloria_${c.id}`);

                    let themeColor = 'text-green-400';
                    let panelBorder = 'hover:border-green-500/50';

                    const html = `
                        <div class="glass-panel p-5 pb-12 rounded-xl border border-slate-800 relative group transition ${panelBorder} bg-[#0a140a]/60">
                            <div class="flex justify-between items-start mb-3 border-b border-slate-800 pb-2">
                                <strong class="${themeColor} text-sm tracking-wide font-serif">${c.nome}</strong>
                                <span class="text-[10px] text-slate-500 uppercase tracking-widest">${new Date(c.data_envio).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <p class="text-slate-300 text-sm leading-relaxed">${c.mensagem}</p>
                            ${mediaHtml}
                            
                            <div class="absolute bottom-3 right-4 flex gap-2">
                                <button onclick="reagirComentario(${c.id}, 'likes', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaCurtiu ? 'text-red-500 border-red-500/30' : 'text-slate-400 hover:text-red-400'}" ${jaCurtiu ? 'disabled' : ''}>
                                    <i class="fa-solid fa-heart"></i> <span class="count font-bold">${c.likes || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'amem', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaAmem ? 'text-green-400 border-green-400/30' : 'text-slate-400 hover:text-green-400'}" ${jaAmem ? 'disabled' : ''}>
                                    <i class="fa-solid fa-hands-praying"></i> <span class="count font-bold">${c.amem || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'gloria', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaGloria ? 'text-lime-500 border-lime-500/30' : 'text-slate-400 hover:text-lime-500'}" ${jaGloria ? 'disabled' : ''}>
                                    <i class="fa-solid fa-fire"></i> <span class="count font-bold">${c.gloria || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(err => {
                list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao carregar comentários: ' + err.message + '</p>';
                console.error("Erro ao carregar comentários:", err);
            });
        }

        function reagirComentario(id, tipo, btn) {
            if(localStorage.getItem(`reagiu_${tipo}_${id}`)) return;

            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.count');
            let count = parseInt(countSpan.innerText);

            icon.classList.add('reacted-anim');
            btn.classList.remove('text-slate-400');
            
            if(tipo === 'likes') btn.classList.add('text-red-500', 'border-red-500/30');
            if(tipo === 'amem') btn.classList.add('text-green-400', 'border-green-400/30');
            if(tipo === 'gloria') btn.classList.add('text-lime-500', 'border-lime-500/30');

            countSpan.innerText = count + 1;
            btn.disabled = true;

            localStorage.setItem(`reagiu_${tipo}_${id}`, 'true');

            const formData = new FormData();
            formData.append('acao', 'reagir');
            formData.append('id', id);
            formData.append('tipo', tipo);

            fetch('api.php', { method: 'POST', body: formData })
            .then(res => {
                if (!res.ok) {
                    throw new Error('Network response was not ok on reaction');
                }
                return res.json();
            })
            .then(data => {
                if (!data.sucesso) {
                    console.error('Erro ao reagir:', data.mensagem);
                    // Optionally revert UI if API confirms failure
                }
            })
            .catch(err => {
                console.error('Erro de conexão ao reagir:', err);
                // Optionally revert UI on connection error
            });
        }

        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append('acao', 'salvar');
            if(currentAudioBlob) {
                formData.append('audio', currentAudioBlob, 'audio.wav');
            }

            fetch('api.php', { method: 'POST', body: formData })
            .then(res => {
                if (!res.ok) {
                    throw new Error('Network response was not ok');
                }
                return res.json();
            })
            .then(data => {
                if(data.sucesso) {
                    this.reset();
                    document.getElementById('filePreview').innerHTML = '';
                    currentAudioBlob = null;
                    document.getElementById('recordText').innerText = "Gravar Áudio";
                    carregarComentarios(document.getElementById('formChapterKey').value);
                } else {
                    alert('Erro ao enviar comentário: ' + (data.mensagem || 'Desconhecido'));
                }
            })
            .catch(err => alert('Erro de conexão ao enviar comentário: ' + err.message))
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        function previewFile(input) {
            const preview = document.getElementById('filePreview');
            if(input.files && input.files[0]) {
                preview.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Imagem selecionada: ${input.files[0].name}`;
                preview.classList.remove('hidden');
            }
        }

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        document.getElementById('filePreview').classList.remove('hidden');
                        document.getElementById('filePreview').innerHTML += '<br><i class="fa-solid fa-microphone text-green-400"></i> Áudio gravado!';
                    };
                    mediaRecorder.start();
                    recordBtn.classList.add('recording-pulse');
                    document.getElementById('recordText').innerText = "Parar Gravação";
                } catch (err) {
                    alert("Permita o uso do microfone para gravar áudio: " + err.message);
                    console.error("Erro ao acessar microfone:", err);
                }
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
                document.getElementById('recordText').innerText = "Gravar Áudio";
            }
        });

        function openImage(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImage() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function resetObservers() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                    else entry.target.classList.remove('active'); // Optional: remove 'active' when out of view
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, spcX: Math.random()*0.5-0.25, spcY: Math.random()*0.5-0.25 });
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(74, 222, 128, 0.15)"; /* Green-400 */
            particles.forEach(p => { p.x += p.spcX; p.y += p.spcY; if(p.x<0||p.x>canvas.width) p.spcX*=-1; if(p.y<0||p.y>canvas.height) p.spcY*=-1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        loadChapter('intro_book');
    </script>
</body>
