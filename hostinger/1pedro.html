    <script>
        const bibleData = {
            "intro_book": {
                title: "A PRIMEIRA CARTA DE PEDRO",
                date: null,
                desc: "<span class='text-xs uppercase tracking-[0.3em] text-sky-400 not-italic block mb-4'>Introdução: Sobre o Livro</span>\"Esperança Viva e Firmeza para os Exilados do Mundo.\"",
                blocks: [
                    {
                        title: "O Manifesto da Esperança no Exílio",
                        verse: "Bendito seja o Deus e Pai de nosso Senhor Jesus Cristo que, segundo a sua grande misericórdia, nos gerou de novo para uma viva esperança... (1 Pe 1:3)",
                        exegesis: "<h3>1. Contexto Histórico e Geográfico</h3><p>A primeira epístola de Pedro foi redigida sob a iminência da severa perseguição do imperador Nero, por volta de 62-64 d.C. O apóstolo escreve para comunidades de cristãos dispersas pelas províncias da Ásia Menor (Ponto, Galácia, Capadócia, Ásia e Bitínia). Estes crentes eram na sua maioria gentios convertidos, que subitamente se viram marginalizados e sofrendo pressões sociais, hostilidade pública e suspeitas políticas por causa da sua nova fé.</p><h3>2. Teologia do Exílio (Estrangeiros e Peregrinos)</h3><p>Pedro emprega o termo grego <i>παρεπίδημος</i> (parepidēmos - 'estrangeiro/peregrino') para redefinir a identidade espiritual do cristão. A igreja é composta de cidadãos do Céu vivendo temporariamente sob o 'status' de refugiados políticos na Terra. A dor e a hostilidade que sofrem não representam a ausência de Deus, mas a evidência de que não pertencem mais ao sistema caído do mundo. Pedro lembra-os de que a verdadeira pátria é celestial, e o sofrimento atual é curto diante da eternidade gloriosa.</p><h3>3. A Estrutura e Mensagem Teológica</h3><p>A epístola equilibra perfeitamente o encorajamento teológico profundo e a ética prática em tempos de sofrimento. Pedro fundamenta a salvação na eternidade com a imagem da esperança: <i>ἐλπίς</i> (elpis - 'esperança'). Ele ensina como os cristãos devem se submeter dignamente sob pressão das autoridades civis, das dinâmicas familiares e do ambiente profissional (servos e senhores). Em vez de retaliação violenta, o cristão é chamado a reagir com mansidão e integridade, imitando os passos de Cristo.</p>"
                    }
                ]
            },
            "intro_author": {
                title: "SOBRE O AUTOR",
                date: null,
                desc: "\"Pedro, apóstolo de Jesus Cristo, aos estrangeiros da Dispersão...\"",
                blocks: [
                    {
                        title: "O Pescador que se tornou Rocha",
                        verse: "Tu és Simão, filho de João; tu serás chamado Cefas (que quer dizer Pedro). (Jo 1:42)",
                        exegesis: "<h3>1. Da Oscilação à Solidez</h3><p>Simão Barjonas era um humilde pescador da Galileia, caracterizado nos Evangelhos pelo temperamento impetuoso, zeloso, mas muitas vezes inconstante. Ele andou sobre as águas, mas afundou ao olhar o vento; ele confessou Jesus como o Cristo, mas tentou impedi-lo de ir à Cruz; ele jurou morrer com o Mestre, mas negou-o três vezes no pátio do Sumo Sacerdote. No entanto, após a ressurreição e o Pentecostes, o Espírito transformou a 'areia' de Simão na 'Rocha' (Cefas) profetizada por Jesus.</p><h3>2. O Eco dos Ensinamentos de Cristo</h3><p>Esta epístola é um magnífico espelho dos discursos de Jesus no Evangelho que Pedro ouviu pessoalmente. O apóstolo fala sobre 'cingir os lombos do entendimento' ecoando a exortação de Jesus para vigiar. Ele enfatiza que a fé testada pelo fogo vale mais que ouro purificado, ecoando as palavras de Cristo sobre perseverança. Cada parágrafo cheira à experiência viva de quem foi perdoado, restaurado na praia da Galileia e recebeu o mandamento solene: 'Apascenta as minhas ovelhas'.</p><h3>3. Escrita a partir de 'Babilônia'</h3><p>Pedro conclui a carta enviando saudações da igreja que está em 'Babilônia' (1 Pe 5:13). Este era o codinome teológico e criptografado usado pelos primeiros cristãos para se referirem à cidade de Roma, a capital imperial de onde Pedro liderava a igreja e onde, segundo a firme tradição histórica, ele viria a ser martirizado por crucificação de cabeça para baixo, por considerar-se indigno de morrer da mesma forma que o seu Salvador.</p>"
                    }
                ]
            },
            "1pedro_1": {
                title: "A ESPERANÇA VIVA",
                date: "25/06 (Terça)",
                desc: "\"A vossa fé, muito mais preciosa do que o ouro que perece, embora provado pelo fogo...\"",
                blocks: [
                    {
                        title: "Doutrina da Salvação e Eleição Eterna",
                        verse: "Eleitos segundo a presciência de Deus Pai, em santificação do Espírito, para a obediência e aspersão do sangue de Jesus Cristo... (1 Pe 1:2)",
                        exegesis: "<h3>1. A Trindade e a Eleição Cósmica</h3><p>Pedro inicia revelando as origens cósmicas da nossa salvação. Ele conecta a identidade dos crentes de forma trinitária: fomos eleitos de acordo com a presciência de Deus Pai, purificados e separados mediante a santificação operada pelo Espírito Santo, com o propósito de vivermos em obediência prática sob a aspersão do sangue redentor de Jesus Cristo. A salvação não é um acidente, mas um plano eterno estabelecido antes de todo o tempo histórico.</p><h3>2. Herança Incorruptível e Sofrimento Temporário</h3><p>Pedro descreve o destino final do crente através do termo <i>κληρονομία</i> (klēronomia - 'herança'). Esta herança é garantida nos céus e é imune a três coisas: ela é incorruptível (não se destrói), imaculada (não se contamina) e murcha (não perde a glória). Para os leitores sofrendo na <i>διασπορά</i> (diaspora - 'dispersão'), o apóstolo recontextualiza a provação: a dor atual é breve e necessária para purificar a fé, assim como o fogo testa a pureza do ouro físico.</p><h3>3. Apelo à Santidade Prática</h3><p>Como herdeiros dessa salvação, Pedro ordena uma mudança radical de mente. 'Cingir os lombos do entendimento' significa preparar a mente para a ação, descartando pensamentos inúteis. O padrão de conduta não são mais as paixões da antiga ignorância moral, mas a própria essência de Deus: 'Sede santos, porque eu sou santo'. Esta santidade foi comprada não por prata ou ouro corruptíveis, mas pelo sangue precioso do Cordeiro sem defeito, já conhecido antes da fundação do mundo.</p>"
                    }
                ]
            },
            "1pedro_2": {
                title: "PEDRAS VIVAS",
                date: "26/06 (Quarta)",
                desc: "\"Vós também, como pedras vivas, sois edificados casa espiritual e sacerdócio santo...\"",
                blocks: [
                    {
                        title: "O Novo Templo e o Povo Adquirido",
                        verse: "Mas vós sois a geração eleita, o sacerdócio real, a nação santa, o povo adquirido... (1 Pe 2:9)",
                        exegesis: "<h3>1. Edificados sobre a Pedra Angular</h3><p>Pedro contrasta o antigo templo físico de Jerusalém, feito de pedras mortas, com o novo santuário espiritual que Deus está erguendo no mundo. Jesus Cristo é a pedra principal de esquina, o <i>ἀκρογωνιαῖος</i> (akrogōniaios - 'pedra angular'), escolhida e preciosa para Deus, mas rejeitada pelos construtores humanos rebeldes. Cada cristão que se aproxima de Cristo é transformado em uma 'pedra viva', assentada e conectada estruturalmente nesta fundação eterna, formando uma habitação espiritual habitada pela presença ativa do Espírito.</p><h3>2. A Identidade Restaurada da Igreja</h3><p>No versículo mais famoso da carta, Pedro acumula quatro títulos magníficos do Antigo Testamento (dados originalmente a Israel no Êxodo) e os aplica diretamente à Igreja composta por judeus e gentios. Somos chamados de geração eleita, sacerdócio de caráter real, nação totalmente consagrada e <i>λαὸς εἰς περιποίησιν</i> (laos eis peripoiēsin - 'povo de propriedade exclusiva de Deus'). O objetivo desta maravilhosa redefinição é existencial: anunciar as virtudes divinas Daquele que nos resgatou da escuridão existencial para a Sua maravilhosa luz.</p><h3>3. Submissão Cidadã e o Modelo de Cristo</h3><p>Pedro passa da identidade para o dever social. O cristão deve viver de modo exemplar entre os gentios. Isso exige a submissão voluntária às leis civis e autoridades institucionais (imperadores e governadores) para silenciar calúnias ignorantes. Pedro também se dirige aos servos, exortando-os a suportar injustiças com integridade moral. Ele apresenta Jesus como o exemplo perfeito de sofrimento injusto: Aquele que ao sofrer não ameaçava, mas entregava-se ao Justo Juiz, carregando no Seu próprio corpo os nossos pecados no madeiro.</p>"
                    }
                ]
            },
            "1pedro_3": {
                title: "INTEGRIDADE E DEFESA",
                date: "27/06 (Quinta)",
                desc: "\"Estai sempre preparados para responder com mansidão e temor a qualquer que vos pedir a razão da esperança...\"",
                blocks: [
                    {
                        title: "Relacionamentos no Lar e a Defesa Apologética",
                        verse: "Antes, santificai a Cristo, como Senhor, em vossos corações; e estai sempre preparados para responder... (1 Pe 3:15)",
                        exegesis: "<h3>1. Harmonia Conjugal no Lar</h3><p>Pedro inicia detalhando o testemunho cristão no casamento. Ele exorta as esposas a uma conduta pura e respeitosa, demonstrando que o verdadeiro adorno não é exterior (penteados, joias ou roupas caras), mas o caráter interior de um espírito manso e tranquilo, altamente valorizado por Deus. Aos maridos, Pedro exige respeito e consideração ativa para com as suas esposas, tratando-as como co-herdeiras da graça da vida, advertindo severamente que o maltrato no lar bloqueia e anula as suas próprias orações diante de Deus.</p><h3>2. A Prática da Apologética com Mansidão</h3><p>No centro das pressões persecutórias, Pedro escreve uma das principais declarações de defesa da fé do Novo Testamento. O crente não deve temer as ameaças do mundo, mas santificar a Cristo como Senhor supremo no coração. A partir disso, deve estar sempre pronto para apresentar uma <i>ἀπολογία</i> (apologia - 'defesa racional/jurídica') a todo aquele que questionar a causa da sua esperança. No entanto, esta defesa teológica jamais deve ser arrogante ou agressiva; ela deve ser ministrada com profunda mansidão, temor e consciência limpa.</p><h3>3. O Sofrimento Justo e o Exemplo de Vitória</h3><p>Pedro reafirma que é infinitamente melhor sofrer por praticar o bem, se for a vontade soberana de Deus, do que por fazer o mal. Ele usa novamente Cristo como o padrão definitivo: Ele sofreu uma única vez pelos pecados dos outros, o Justo morrendo em substituição aos injustos, para nos conduzir diretamente a Deus. Mesmo morto na carne física, Jesus foi vivificado no Espírito, triunfando cosmicamente sobre todas as hostes rebeldes e autoridades espirituais caídas que se opuseram ao Seu reino.</p>"
                    }
                ]
            },
            "1pedro_4": {
                title: "SERVIÇO E PROVAÇÃO",
                date: "28/06 (Sexta)",
                desc: "\"O fim de todas as coisas está próximo; sede, pois, prudentes e vigilantes em oração.\"",
                blocks: [
                    {
                        title: "Maturidade, Serviço Coletivo e a Provação de Fogo",
                        verse: "Amados, não estranheis a ardente prova que vem sobre vós para vos tentar, como se alguma coisa extraordinária vos acontecesse... (1 Pe 4:12)",
                        exegesis: "<h3>1. Ruptura Radical com o Estilo de Vida Pagão</h3><p>Pedro adverte que os crentes devem se armar com a mesma mentalidade de Cristo. O tempo restante de vida na carne não deve ser desperdiçado nas concupiscências humanas, mas dedicado integralmente à soberana vontade de Deus. O apóstolo descreve o passado dos leitores imerso na libertinagem, luxúria, embriaguez e idolatrias abomináveis. O mundo estranha que os cristãos não corram mais para o mesmo abismo de dissolução moral, reagindo com calúnias e hostilidades violentas das quais prestarão contas perante Aquele que julga vivos e mortos.</p><h3>2. O Amor Fervoroso e os Dons de Graça</h3><p>Com a percepção escatológica de que 'o fim de todas as coisas está próximo', Pedro exorta a igreja a priorizar a comunhão interna. O mandamento supremo é cultivar um amor mútuo intensamente fervoroso, pois o amor tem o poder de cobrir uma multidão de pecados por meio do perdão. A hospitalidade deve ser exercida sem murmuração. Cada crente deve usar os seus <i>χαρίσματα</i> (charismata - 'dons de graça') como despenseiros fiéis da multiforme graça divina. Quem fala, deve fazê-lo como quem profere oráculos de Deus; quem serve, com a força que Deus provê, para que em tudo Deus seja glorificado: <i>δοξάζω</i> (doxazo - 'glorificar').</p><h3>3. A Provação de Fogo e o Julgamento da Casa</h3><p>Pedro prepara a mente dos crentes para o aumento das hostilidades, chamando as provações de 'prova ardente'. O crente não deve ficar chocado ou surpreso com o sofrimento, mas alegrar-se por ser participante das aflições de Cristo. Há uma distinção crítica: ninguém deve sofrer por cometer crimes, roubos ou intromissões na vida alheia, mas se sofrer como cristão, não deve envergonhar-se, mas glorificar a Deus sob esse nome. Pedro conclui alertando que o julgamento divino começa de forma purificadora pela própria casa de Deus.</p>"
                    }
                ]
            },
            "1pedro_5": {
                title: "O PASTORADO E A VIGILÂNCIA",
                date: "01/07 (Segunda)",
                desc: "\"Apascentai o rebanho de Deus que está entre vós, tendo cuidado dele, não por força, mas voluntariamente...\"",
                blocks: [
                    {
                        title: "Liderança Eclesiástica, Humildade e Combate Espiritual",
                        verse: "Sede sóbrios; vigiai; porque o diabo, vosso adversário, anda em redor, bramando como leão, buscando a quem possa devorar... (1 Pe 5:8)",
                        exegesis: "<h3>1. O Modelo do Pastorado Bíblico</h3><p>Pedro dirige-se diretamente à liderança das igrejas da Dispersão. Identificando-se como co-presbítero, o <i>πρεσβύτερος</i> (presbyteros - 'presbítero/ancião') e testemunha ocular dos sofrimentos de Cristo, ele ordena que apascentem o rebanho sob sua responsabilidade. Ele estipula três atitudes fundamentais: liderar de forma voluntária e com amor à obra, e não sob constrangimento; servir por amor sincero e generoso, e não por ganância financeira torpe; e guiar sendo um exemplo vivo e visível para o rebanho, em vez de agir como ditadores espirituais sobre a herança de Deus.</p><h3>2. Humildade mútua e Lançamento de Ansiedades</h3><p>O apóstolo estende as exortações aos jovens, exigindo submissão aos líderes espirituais maduros. No entanto, o mandamento da humildade é universal: 'revesti-vos todos de humildade uns para com os outros'. Deus resiste ativamente aos soberbos de mente e coração, mas concede graça aos humildes. Pedro ordena que os crentes se humilhem voluntariamente sob a poderosa mão governante de Deus, confiando que Ele os exaltará no tempo soberano. Toda a paralisante ansiedade existencial deve ser lançada diretamente sobre o Senhor, sob a certeza consoladora de que Ele cuida de nós.</p><h3>3. Sobriedade no Combate contra o Leão</h3><p>Pedro encerra sua epístola com um alerta severo sobre a realidade do mundo espiritual. O cristão deve cultivar uma mente sóbria e vigilante, pois o Diabo, o nosso ferrenho <i>ἀντίδικos</i> (antidikos - 'adversário/oponente legal'), ronda agressivamente ao redor como um leão faminto bramando em busca de presas fáceis para devorar. A postura da igreja deve ser de firme resistência na fé, sabendo que os mesmos sofrimentos estão sendo enfrentados pela irmandade espalhada por todo o mundo antigo. O Deus de toda a graça, após um breve período de sofrimento purificador, irá aperfeiçoar, firmar, fortificar e estabelecer os crentes em vitória eterna.</p>"
                    }
                ]
            }
        };

        // === LÓGICA GERAL ===
        let currentAudioBlob = null;
        let mediaRecorder;
        let audioChunks = [];

        function loadChapter(chapterKey) {
            const data = bibleData[chapterKey];
            if (!data) return;

            const heroTitle = document.getElementById('heroTitle');
            const heroDesc = document.getElementById('heroDesc');
            const dateBadge = document.getElementById('dateBadge');
            const dateValue = document.getElementById('dateValue');
            const communitySection = document.getElementById('community-section');
            const formChapterKey = document.getElementById('formChapterKey');
            
            heroTitle.style.opacity = '0';
            heroDesc.style.opacity = '0';
            dateBadge.style.opacity = '0';
            
            setTimeout(() => {
                if (data.date) {
                    dateValue.textContent = data.date;
                    dateBadge.classList.remove('hidden');
                    communitySection.classList.remove('hidden');
                    formChapterKey.value = chapterKey;
                    carregarComentarios(chapterKey);
                    setTimeout(() => { dateBadge.style.opacity = '1'; }, 100);
                } else {
                    dateBadge.classList.add('hidden');
                    communitySection.classList.add('hidden');
                }

                heroTitle.innerHTML = data.title;
                heroDesc.innerHTML = data.desc;
                heroTitle.style.opacity = '1';
                heroDesc.style.opacity = '1';
            }, 300);

            const mainContent = document.getElementById('content');
            mainContent.innerHTML = ''; 

            data.blocks.forEach((block) => {
                let borderColor = 'border-sky-600';
                let blurTop = 'bg-sky-600/5';
                let blurBottom = 'bg-sky-800/5';
                let borderPanel = 'border-sky-900/30';

                const html = `
                    <section class="reveal max-w-4xl mx-auto w-full relative">
                        <div class="absolute -inset-4 ${blurTop} to-transparent rounded-3xl blur-xl pointer-events-none"></div>
                        
                        <div class="space-y-6 relative z-10">
                            <div class="text-center mb-10">
                                <h2 class="text-3xl md:text-5xl font-serif text-white leading-tight mb-6">${block.title}</h2>
                                <div class="inline-block border-l-4 border-r-4 ${borderColor} px-6 py-4 italic text-slate-300 bg-[#0c4a6e]/10 shadow-sm max-w-3xl rounded-sm">
                                    "${block.verse}"
                                </div>
                            </div>
                            
                            <div class="bg-[#030712]/80 p-8 md:p-12 rounded-xl border ${borderPanel} transition shadow-2xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 ${blurTop} rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                                <div class="absolute bottom-0 left-0 w-64 h-64 ${blurBottom} rounded-full blur-3xl -ml-20 -mb-20 pointer-events-none"></div>
                                <div class="rich-text text-slate-300 text-[16px] md:text-lg leading-relaxed relative z-10 font-light">
                                    ${block.exegesis}
                                </div>
                            </div>
                        </div>
                    </section>
                `;
                mainContent.insertAdjacentHTML('beforeend', html);
            });
            resetObservers();
        }

        function carregarComentarios(capitulo) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<p class="text-center text-slate-500 text-sm animate-pulse">Carregando comentários...</p>';

            fetch(`api.php?acao=listar&capitulo=${capitulo}`)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                if(!Array.isArray(data)) return;
                if(data.length === 0) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                data.forEach(c => {
                    let mediaHtml = '';
                    if(c.foto) mediaHtml += `<img src="${c.foto}" onclick="openImage(this.src)" class="mt-4 rounded-lg max-h-48 border border-slate-700 cursor-pointer hover:scale-[1.02] transition shadow-lg">`;
                    if(c.audio) mediaHtml += `<audio controls src="${c.audio}" class="mt-4 w-full"></audio>`;

                    const jaCurtiu = localStorage.getItem(`reagiu_likes_${c.id}`);
                    const jaAmem = localStorage.getItem(`reagiu_amem_${c.id}`);
                    const jaGloria = localStorage.getItem(`reagiu_gloria_${c.id}`);

                    let themeColor = 'text-sky-400';
                    let panelBorder = 'hover:border-sky-500/50';

                    const html = `
                        <div class="glass-panel p-5 pb-12 rounded-xl border border-slate-800 relative group transition ${panelBorder} bg-[#030712]/60">
                            <div class="flex justify-between items-start mb-3 border-b border-slate-800 pb-2">
                                <strong class="${themeColor} text-sm tracking-wide font-serif">${c.nome}</strong>
                                <span class="text-[10px] text-slate-500 uppercase tracking-widest">${new Date(c.data_envio).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <p class="text-slate-300 text-sm leading-relaxed">${c.mensagem}</p>
                            ${mediaHtml}
                            
                            <div class="absolute bottom-3 right-4 flex gap-2">
                                <button onclick="reagirComentario(${c.id}, 'likes', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaCurtiu ? 'text-red-500 border-red-500/30' : 'text-slate-400 hover:text-red-400'}" ${jaCurtiu ? 'disabled' : ''}>
                                    <i class="fa-solid fa-heart"></i> <span class="count font-bold">${c.likes || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'amem', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaAmem ? 'text-sky-400 border-sky-400/30' : 'text-slate-400 hover:text-sky-400'}" ${jaAmem ? 'disabled' : ''}>
                                    <i class="fa-solid fa-hands-praying"></i> <span class="count font-bold">${c.amem || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'gloria', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaGloria ? 'text-blue-500 border-blue-500/30' : 'text-slate-400 hover:text-blue-500'}" ${jaGloria ? 'disabled' : ''}>
                                    <i class="fa-solid fa-fire"></i> <span class="count font-bold">${c.gloria || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(err => {
                list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao carregar comentários.</p>';
            });
        }

        function reagirComentario(id, tipo, btn) {
            if(localStorage.getItem(`reagiu_${tipo}_${id}`)) return;

            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.count');
            let count = parseInt(countSpan.innerText);

            icon.classList.add('reacted-anim');
            btn.classList.remove('text-slate-400');
            
            if(tipo === 'likes') btn.classList.add('text-red-500', 'border-red-500/30');
            if(tipo === 'amem') btn.classList.add('text-sky-400', 'border-sky-400/30');
            if(tipo === 'gloria') btn.classList.add('text-blue-500', 'border-blue-500/30');

            countSpan.innerText = count + 1;
            btn.disabled = true;

            localStorage.setItem(`reagiu_${tipo}_${id}`, 'true');

            const formData = new FormData();
            formData.append('acao', 'reagir');
            formData.append('id', id);
            formData.append('tipo', tipo);

            fetch('api.php', { method: 'POST', body: formData });
        }

        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append('acao', 'salvar');
            if(currentAudioBlob) {
                formData.append('audio', currentAudioBlob, 'audio.wav');
            }

            fetch('api.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.sucesso) {
                    this.reset();
                    document.getElementById('filePreview').innerHTML = '';
                    currentAudioBlob = null;
                    document.getElementById('recordText').innerText = "Gravar Áudio";
                    carregarComentarios(document.getElementById('formChapterKey').value);
                } else {
                    alert('Erro ao enviar.');
                }
            })
            .catch(() => alert('Erro de conexão.'))
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        function previewFile(input) {
            const preview = document.getElementById('filePreview');
            if(input.files && input.files[0]) {
                preview.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Imagem selecionada: ${input.files[0].name}`;
                preview.classList.remove('hidden');
            }
        }

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        document.getElementById('filePreview').classList.remove('hidden');
                        document.getElementById('filePreview').innerHTML += '<br><i class="fa-solid fa-microphone text-green-400"></i> Áudio gravado!';
                    };
                    mediaRecorder.start();
                    recordBtn.classList.add('recording-pulse');
                    document.getElementById('recordText').innerText = "Parar Gravação";
                } catch (err) {
                    alert("Permita o uso do microfone para gravar.");
                }
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
                document.getElementById('recordText').innerText = "Gravar Áudio";
            }
        });

        function openImage(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImage() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function resetObservers() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, spcX: Math.random()*0.5-0.25, spcY: Math.random()*0.5-0.25 });
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(56, 189, 248, 0.15)"; /* Sky blue */
            particles.forEach(p => { p.x += p.spcX; p.y += p.spcY; if(p.x<0||p.x>canvas.width) p.spcX*=-1; if(p.y<0||p.y>canvas.height) p.spcY*=-1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        loadChapter('intro_book');
    </script>
</body>
</html>
