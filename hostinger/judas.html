    <script>
        const bibleData = {
            "intro_book": {
                title: "A EPÍSTOLA DE JUDAS",
                date: null,
                desc: "<span class='text-xs uppercase tracking-[0.3em] text-red-400 not-italic block mb-4'>Introdução: Sobre o Livro</span>\"Um grito de guerra teológico contra os infiltrados e a defesa da fé uma vez por todas entregue aos santos.\"",
                blocks: [
                    {
                        title: "O Alerta Vermelho das Escrituras",
                        verse: "Amados, procurando eu escrever-vos com toda a diligência acerca da salvação comum, tive por necessidade escrever-vos para exortar-vos a batalhar pela fé que uma vez foi dada aos santos. (Jd 1:3)",
                        exegesis: "<h3>1. A Mudança de Planos Inspirada</h3><p>A pequena epístola de Judas é um dos documentos mais vibrantes e urgentes do Novo Testamento. O autor confessa que sua intenção inicial era escrever um tratado pacífico sobre a 'salvação comum' partilhada pela comunidade cristã. No entanto, o Espírito Santo o impeliu a mudar drasticamente de rota. Um perigo iminente e destrutivo havia se infiltrado nas igrejas: falsos doutrinadores que usavam a graça divina como salvo-conduto para a libertinagem moral. A carta, portanto, torna-se um manifesto de guerra espiritual e teológica.</p><h3>2. O Uso de Fontes Históricas e Apócrifas</h3><ul><li>Judas utiliza uma retórica afiada e cita exemplos históricos marcantes do julgamento de Deus contra os rebeldes, como a geração do deserto que pereceu por incredulidade, a queda dos anjos rebeldes e a aniquilação física de Sodoma e Gomorra.</li><li>Surpreendentemente, Judas também faz referência a obras literárias judaicas extra-bíblicas bastante conhecidas em seu tempo, como a 'Assunção de Moisés' (ao narrar a disputa do Arcanjo Miguel pelo corpo de Moisés) e o 'Livro de Enoque' (ao citar a profecia sobre a vinda do Senhor com Seus milhares de santos). Essas alusões não validam tais livros como canônicos por inteiro, mas demonstram que Judas usou fatos históricos ou tradições conhecidas de sua audiência para ilustrar verdades divinas inquestionáveis.</li></ul><h3>3. O Combate à Apostasia</h3><p>A grande tese de Judas é que a heresia mais destrutiva não é apenas um desvio conceitual abstrato, mas uma corrupção comportamental. Aqueles homens ímpios negavam o Senhorio de Cristo através de vidas moralmente dissolutas. Eles prometiam liberdade espiritual enquanto eram escravos de suas próprias paixões carnais. Contra essa farsa, o autor convoca a igreja à preservação ativa e ao contra-ataque espiritual focado na verdade divina.</p>"
                    }
                ]
            },
            "intro_author": {
                title: "SOBRE O AUTOR",
                date: null,
                desc: "\"Judas, servo de Jesus Cristo, e irmão de Tiago, aos chamados, santificados em Deus Pai, e conservados por Jesus Cristo...\"",
                blocks: [
                    {
                        title: "O Irmão de Tiago e de Jesus",
                        verse: "Não é este o carpinteiro, filho de Maria, e irmão de Tiago, e de José, e de Judas e de Simão? e não estão aqui conosco suas irmãs? (Mc 6:3)",
                        exegesis: "<h3>1. A Identidade de Judas</h3><p>O autor identifica-se de forma surpreendentemente humilde como 'servo de Jesus Cristo e irmão de Tiago'. Ele não reivindica para si o título de apóstolo e evita intencionalmente usar o título de 'irmão de Jesus', embora as evidências históricas e bíblicas (como Mateus 13:55 e Marcos 6:3) apontem claramente que ele era um dos meio-irmãos de sangue do Messias, filho biológico de Maria e José após o nascimento virginal de Jesus.</p><h3>2. Da Incredulidade ao Discipulado Fiel</h3><ul><li>Durante o ministério terreno de Jesus, Seus irmãos biológicos não criam nEle e chegaram a considerá-lo fora de si (João 7:5; Marcos 3:21). Eles tentavam dissuadir Jesus de Sua missão pública.</li><li>Tudo mudou de forma dramática após a ressurreição. A aparição de Cristo ressuscitado transformou inteiramente aquela família. Encontramos os irmãos de Jesus reunidos em oração contínua no cenáculo aguardando o batismo no Espírito Santo no dia de Pentecostes (Atos 1:14). Judas passou de cético a servo, preferindo a honra espiritual de ser escravo submisso de Cristo à mera vanglória de sua relação consanguínea terrena.</li></ul><h3>3. O Legado de uma Mensagem Fervorosa</h3><p>Escrevendo provavelmente no final da década de 60 d.C., Judas apresenta uma autoridade teológica impressionante. Seu estilo literário no grego é denso, poético, e repleto de metáforas vivas da natureza (ondas bravias, nuvens sem água, estrelas errantes). Ele escreve com a urgência de um pastor que vê lobos cercando o rebanho e não hesita em soar o alarme com firmeza inabalável.</p>"
                    }
                ]
            },
            "judas_1": {
                title: "BATALHANDO PELA FÉ",
                date: "15/07",
                desc: "\"Edificando-vos a vós mesmos sobre a vossa santíssima fé, orando no Espírito Santo...\"",
                blocks: [
                    {
                        title: "A Infiltração dos Ímpios e os Exemplos de Juízo",
                        verse: "Porque se introduziram alguns, que já antes estavam escritos para este mesmo juízo, homens ímpios, que convertem em dissolução a graça de Deus, e negam a Deus, único soberano e Senhor nosso, Jesus Cristo. (Jd 1:4)",
                        exegesis: "<h3>1. A Luta Fervorosa e Constante</h3><p>No grego original, a expressão crucial de Judas para exortar a comunidade é <i>epagonizesthai</i> (<i>ἐπαγωνίζεσθαι</i> - Lutar fervorosamente por algo, agonizar na arena de combate). Esse termo militar e atlético denota um combate intenso, uma defesa corpo a corpo pela verdade doutrinária. A fé cristã não é maleável ou adaptável às eras; ela foi entregue 'uma vez por todas' (<i>hapax</i> - <i>ἅπαξ</i>) aos santos. Não há espaço para novas revelações que contradigam o evangelho apostólico estabelecido.</p><h3>2. A Anatomia da Impiedade e os Três Caminhos de Morte</h3><ul><li>Judas traça um paralelo contundente entre os falsos mestres infiltrados e três personagens arquetípicos do Antigo Testamento: o caminho de Caim (violência, egoísmo e recusa do sacrifício correto); o erro de Balaão (cobiça por recompensa financeira, prostituindo o dom espiritual); e a contradição de Corá (rebelião contra a liderança instituída por Deus e a soberania do altar divino).</li><li>O comportamento desses indivíduos é marcado por <i>asebeia</i> (<i>ἀσέβεια</i> - impiedade, total falta de reverência prática a Deus). Eles agem de forma puramente animal, guiados por impulsos sensuais e instintivos, zombando das realidades espirituais que desconhecem. Ao fazer isso, transformam a preciosa doutrina da graça em pretexto para libertinagem moral.</li></ul><h3>3. O Combate Espiritual com Reverência</h3><p>Judas ilustra a gravidade da rebelião contrastando o orgulho dos falsos mestres com a atitude do Arcanjo Miguel. Ao disputar o corpo de Moisés com o Diabo, Miguel não ousou pronunciar contra ele um julgamento de maldição injuriosa, mas limitou-se a declarar reverentemente: 'O Senhor te repreenda'. Se um arcanjo glorioso demonstrou tal nível de reverência diante da autoridade cósmica ao combater as forças das trevas, quão tolos e perigosos são os falsos mestres que blasfemam arrogantemente contra as autoridades divinas e celestes.</p>"
                    },
                    {
                        title: "Metáforas da Ilusão e a Profecia Cósmica de Enoque",
                        verse: "E destes profetizou também Enoque, o sétimo depois de Adão, dizendo: Eis que é vindo o Senhor com milhares de seus santos... (Jd 1:14)",
                        exegesis: "<h3>1. O Retrato da Inutilidade Espiritual</h3><p>Judas utiliza sua destreza literária para descrever a inutilidade absoluta dos apóstatas por meio de cinco imagens poéticas e sombrias da natureza selvagem. Cada metáfora expõe a terrível ilusão que esses homens representavam nas comunidades de fé:</p><ul><li><strong>Nuvens sem água, levadas pelos ventos:</strong> Prometem chuvas de bênçãos e respostas espirituais, mas são vazias de conteúdo real e mudam constantemente de direção ao sabor das conveniências humanas.</li><li><strong>Árvores murchas, duas vezes mortas e desarraigadas:</strong> Não possuem frutos no tempo correto e estão completamente desligadas da raiz da vida em Cristo. Estão espiritualmente condenadas ao fogo.</li><li><strong>Ondas bravias do mar, que escumam as suas próprias sujidades:</strong> Agitam-se com violência e barulho na comunidade, mas sua movimentação apenas traz à superfície a sujeira e a vergonha de suas almas degradadas.</li><li><strong>Estrelas errantes, para as quais está guardada a negrura das trevas:</strong> Oferecem uma falsa orientação para os navegantes, mas estão desprovidas de órbita fixa e destinadas ao esquecimento e à escuridão eterna.</li></ul><h3>2. O Anúncio do Juízo Final</h3><p>Ao citar a tradição de Enoque, Judas reafirma que o julgamento divino contra a impiedade não é uma possibilidade teórica tardia, mas um decreto soberano estabelecido desde o início dos tempos. O Senhor virá de forma gloriosa cercado de Seus exércitos celestes para executar juízo pleno, convencendo os ímpios de todas as suas obras de impiedade praticadas insolentemente e de todas as palavras duras proferidas com soberba contra o trono de Deus.</p><h3>3. A Lembrança dos Avisos Apostólicos</h3><p>O autor relembra os seus leitores de que os apóstolos de nosso Senhor Jesus Cristo já haviam previsto e alertado claramente sobre esses acontecimentos. Eles profetizaram que, nos últimos tempos, surgiriam escarnecedores que andariam segundo suas próprias paixões ímpias, provocando divisões sectárias e agindo de modo puramente carnal, sem possuírem a habitação vivificante e santificadora do Espírito Santo.</p>"
                    },
                    {
                        title: "Preservação, Compaixão Ativa e a Doxologia Triunfal",
                        verse: "Ora, àquele que é poderoso para vos guardar de tropeçar, e apresentar-vos irrepreensíveis, com alegria, perante a sua glória... (Jd 1:24)",
                        exegesis: "<h3>1. A Fortaleza Espiritual dos Santos</h3><p>Diante do terrível cenário de apostasia e infiltração herética, Judas apresenta uma receita prática e inegociável para a segurança eterna dos eleitos. O dever primordial da igreja consiste em 'edificar-se sobre a santíssima fé' e 'orar no Espírito Santo'. A fé aqui é o corpo de verdades reveladas na Palavra de Deus. A oração no Espírito não é uma técnica extática, mas uma intercessão alinhada perfeitamente com a vontade do próprio Deus, guiada e fortalecida pelo Consolador.</p><h3>2. A Tripla Atitude de Misericórdia e Resgate</h3><ul><li>Judas ensina que a resposta da igreja à heresia não deve ser o isolamento apático, mas uma compaixão estratégica e urgente. Ele divide as pessoas em perigo espiritual em três categorias bem distintas:</li><li><strong>Os vacilantes:</strong> Aqueles que estão sendo influenciados e começam a duvidar. A esses, a igreja deve tratar com profunda compaixão pastoral, acolhendo e solidificando suas bases teológicas.</li><li><strong>Os que estão no fogo:</strong> Aqueles que já estão mergulhados na heresia moral. A esses, a igreja deve resgatar com extrema urgência, 'arrebatando-os do fogo' do julgamento iminente antes que seja tarde demais.</li><li><strong>Os severamente contaminados:</strong> Aqueles que propagam ativamente o erro. A esses, a igreja deve tratar com temor e cautela extrema, detestando até mesmo as vestes contaminadas por sua carne corrupta, para não ser infectada pelo mesmo vírus espiritual destruidor.</li></ul><h3>3. A Maior Doxologia do Novo Testamento</h3><p>Judas encerra sua curta e dramática epístola tirando os olhos do leitor das trevas da heresia e fixando-os no trono majestoso de Deus. A famosa doxologia final assegura que a nossa salvação não depende de nossa própria força humana vacilante, mas de Deus. Ele é o Único Poderoso capaz de nos guardar imunes de tropeçar nas ciladas do caminho e de nos apresentar diante da Sua glória excelsa completamente irrepreensíveis, puros e tomados de indizível alegria eterna. Ao Deus único e sábio, nosso Salvador, pertence toda a glória, majestade, império e poder desde a eternidade, agora e por todos os séculos dos séculos. Amém!</p>"
                    }
                ]
            }
        };

        // === LÓGICA GERAL ===
        let currentAudioBlob = null;
        let mediaRecorder;
        let audioChunks = [];

        function loadChapter(chapterKey) {
            const data = bibleData[chapterKey];
            if (!data) return;

            const heroTitle = document.getElementById('heroTitle');
            const heroDesc = document.getElementById('heroDesc');
            const dateBadge = document.getElementById('dateBadge');
            const dateValue = document.getElementById('dateValue');
            const communitySection = document.getElementById('community-section');
            const formChapterKey = document.getElementById('formChapterKey');
            
            heroTitle.style.opacity = '0';
            heroDesc.style.opacity = '0';
            dateBadge.style.opacity = '0';
            
            setTimeout(() => {
                if (data.date) {
                    dateValue.textContent = data.date;
                    dateBadge.classList.remove('hidden');
                    communitySection.classList.remove('hidden');
                    formChapterKey.value = chapterKey;
                    carregarComentarios(chapterKey);
                    setTimeout(() => { dateBadge.style.opacity = '1'; }, 100);
                } else {
                    dateBadge.classList.add('hidden');
                    communitySection.classList.add('hidden');
                }

                heroTitle.innerHTML = data.title;
                heroDesc.innerHTML = data.desc;
                heroTitle.style.opacity = '1';
                heroDesc.style.opacity = '1';
            }, 300);

            const mainContent = document.getElementById('content');
            mainContent.innerHTML = ''; 

            data.blocks.forEach((block) => {
                let borderColor = 'border-red-800';
                let blurTop = 'bg-red-850/5';
                let blurBottom = 'bg-red-950/5';
                let borderPanel = 'border-red-950/30';

                const html = `
                    <section class="reveal max-w-4xl mx-auto w-full relative">
                        <div class="absolute -inset-4 ${blurTop} to-transparent rounded-3xl blur-xl pointer-events-none"></div>
                        
                        <div class="space-y-6 relative z-10">
                            <div class="text-center mb-10">
                                <h2 class="text-3xl md:text-5xl font-serif text-white leading-tight mb-6">${block.title}</h2>
                                <div class="inline-block border-l-4 border-r-4 ${borderColor} px-6 py-4 italic text-slate-300 bg-[#0f0404]/50 shadow-sm max-w-3xl rounded-sm">
                                    "${block.verse}"
                                </div>
                            </div>
                            
                            <div class="bg-[#050202]/80 p-8 md:p-12 rounded-xl border ${borderPanel} transition shadow-2xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 ${blurTop} rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                                <div class="absolute bottom-0 left-0 w-64 h-64 ${blurBottom} rounded-full blur-3xl -ml-20 -mb-20 pointer-events-none"></div>
                                <div class="rich-text text-slate-300 text-[16px] md:text-lg leading-relaxed relative z-10 font-light">
                                    ${block.exegesis}
                                </div>
                            </div>
                        </div>
                    </section>
                `;
                mainContent.insertAdjacentHTML('beforeend', html);
            });
            resetObservers();
        }

        function carregarComentarios(capitulo) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<p class="text-center text-slate-500 text-sm animate-pulse">Carregando comentários...</p>';

            fetch(`api.php?acao=listar&capitulo=${capitulo}`)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                if(!Array.isArray(data)) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                if(data.length === 0) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                data.forEach(c => {
                    let mediaHtml = '';
                    if(c.foto) mediaHtml += `<img src="${c.foto}" onclick="openImage(this.src)" class="mt-4 rounded-lg max-h-48 border border-slate-800 cursor-pointer hover:scale-[1.02] transition shadow-lg">`;
                    if(c.audio) mediaHtml += `<audio controls src="${c.audio}" class="mt-4 w-full"></audio>`;

                    const jaCurtiu = localStorage.getItem(`reagiu_likes_${c.id}`);
                    const jaAmem = localStorage.getItem(`reagiu_amem_${c.id}`);
                    const jaGloria = localStorage.getItem(`reagiu_gloria_${c.id}`);

                    let themeColor = 'text-red-400';
                    let panelBorder = 'hover:border-red-500/50';

                    const html = `
                        <div class="glass-panel p-5 pb-12 rounded-xl border border-slate-900 relative group transition ${panelBorder} bg-[#120404]/60">
                            <div class="flex justify-between items-start mb-3 border-b border-slate-900 pb-2">
                                <strong class="${themeColor} text-sm tracking-wide font-serif">${c.nome}</strong>
                                <span class="text-[10px] text-slate-500 uppercase tracking-widest">${new Date(c.data_envio).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <p class="text-slate-300 text-sm leading-relaxed">${c.mensagem}</p>
                            ${mediaHtml}
                            
                            <div class="absolute bottom-3 right-4 flex gap-2">
                                <button onclick="reagirComentario(${c.id}, 'likes', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-800 ${jaCurtiu ? 'text-red-500 border-red-500/30' : 'text-slate-400 hover:text-red-400'}" ${jaCurtiu ? 'disabled' : ''}>
                                    <i class="fa-solid fa-heart"></i> <span class="count font-bold">${c.likes || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'amem', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-800 ${jaAmem ? 'text-red-400 border-red-400/30' : 'text-slate-400 hover:text-red-400'}" ${jaAmem ? 'disabled' : ''}>
                                    <i class="fa-solid fa-hands-praying"></i> <span class="count font-bold">${c.amem || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'gloria', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-800 ${jaGloria ? 'text-red-600 border-red-600/30' : 'text-slate-400 hover:text-red-500'}" ${jaGloria ? 'disabled' : ''}>
                                    <i class="fa-solid fa-fire"></i> <span class="count font-bold">${c.gloria || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(err => {
                list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao carregar comentários.</p>';
            });
        }

        function reagirComentario(id, tipo, btn) {
            if(localStorage.getItem(`reagiu_${tipo}_${id}`)) return;

            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.count');
            let count = parseInt(countSpan.innerText);

            icon.classList.add('reacted-anim');
            btn.classList.remove('text-slate-400');
            
            if(tipo === 'likes') btn.classList.add('text-red-500', 'border-red-500/30');
            if(tipo === 'amem') btn.classList.add('text-red-450', 'border-red-400/30');
            if(tipo === 'gloria') btn.classList.add('text-red-600', 'border-red-600/30');

            countSpan.innerText = count + 1;
            btn.disabled = true;

            localStorage.setItem(`reagiu_${tipo}_${id}`, 'true');

            const formData = new FormData();
            formData.append('acao', 'reagir');
            formData.append('id', id);
            formData.append('tipo', tipo);

            fetch('api.php', { method: 'POST', body: formData })
            .catch(err => console.error('Erro de conexão ao reagir:', err));
        }

        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append('acao', 'salvar');
            if(currentAudioBlob) {
                formData.append('audio', currentAudioBlob, 'audio.wav');
            }

            fetch('api.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.sucesso) {
                    this.reset();
                    document.getElementById('filePreview').innerHTML = '';
                    currentAudioBlob = null;
                    document.getElementById('recordText').innerText = "Gravar Áudio";
                    carregarComentarios(document.getElementById('formChapterKey').value);
                } else {
                    alert('Erro ao enviar.');
                }
            })
            .catch(() => alert('Erro de conexão.'))
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        function previewFile(input) {
            const preview = document.getElementById('filePreview');
            if(input.files && input.files[0]) {
                preview.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Imagem selecionada: ${input.files[0].name}`;
                preview.classList.remove('hidden');
            }
        }

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        document.getElementById('filePreview').classList.remove('hidden');
                        document.getElementById('filePreview').innerHTML += '<br><i class="fa-solid fa-microphone text-green-400"></i> Áudio gravado!';
                    };
                    mediaRecorder.start();
                    recordBtn.classList.add('recording-pulse');
                    document.getElementById('recordText').innerText = "Parar Gravação";
                } catch (err) {
                    alert("Permita o uso do microfone para gravar.");
                }
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
                document.getElementById('recordText').innerText = "Gravar Áudio";
            }
        });

        function openImage(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImage() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function resetObservers() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
            
            // Garantia de visibilidade imediata das primeiras seções se já estiverem em foco
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if(rect.top < window.innerHeight) {
                        el.classList.add('active');
                    }
                });
            }, 300);
        }

        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, spcX: Math.random()*0.5-0.25, spcY: Math.random()*0.5-0.25 });
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(239, 68, 68, 0.15)"; /* Vermelho */
            particles.forEach(p => { p.x += p.spcX; p.y += p.spcY; if(p.x<0||p.x>canvas.width) p.spcX*=-1; if(p.y<0||p.y>canvas.height) p.spcY*=-1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        loadChapter('intro_book');
    </script>
</body>
</html>
