    <script>
        const bibleData = {
            "intro_book": {
                title: "A SEGUNDA CARTA A TIMÓTEO",
                date: null,
                desc: "<span class='text-xs uppercase tracking-[0.3em] text-green-400 not-italic block mb-4'>Introdução: Sobre o Livro</span>\"A última vontade e testamento de um apóstolo moribundo.\"",
                blocks: [
                    {
                        title: "O Canto do Cisne de Paulo",
                        verse: "Porque eu já estou sendo oferecido por aspersão de sacrifício, e o tempo da minha partida está próximo. (2 Tm 4:6)",
                        exegesis: `
                            <h3>1. A Última Epístola Inspirada</h3>
                            <ul>
                                <li>2 Timóteo é a última carta que Paulo escreveu antes de sua morte, um documento comovente e poderoso que ecoa a sabedoria e a urgência de um pai espiritual se despedindo. É considerada a "carta de despedida" ou o "canto do cisne" do apóstolo. Ela não aborda problemas doutrinários complexos ou correções de igrejas, mas é um apelo pessoal a Timóteo para permanecer firme na fé e cumprir seu ministério.</li>
                            </ul>
                            
                            <h3>2. Um Testamento de Fidelidade</h3>
                            <ul>
                                <li>Escrita da prisão em Roma, por volta de 66-67 d.C., durante a perseguição de Nero, Paulo sabia que seu fim estava próximo. Ele estava isolado, muitos o haviam abandonado, mas sua fé em Cristo permanecia inabalável. A carta está repleta de exortações à fidelidade, perseverança e coragem. Paulo não oferece uma teologia sistemática, mas sim um guia prático e apaixonado para a vida e o ministério em tempos difíceis.</li>
                            </ul>

                            <h3>3. Temas Essenciais</h3>
                            <ul>
                                <li>Os temas centrais incluem a importância da Palavra de Deus (a <i>graphē</i> - <span class="ref">(γραφή - Escrita)</span>), a necessidade de se apegar à sã doutrina, a transmissão da fé às próximas gerações e a urgência de pregar o evangelho, mesmo diante da apostasia. Paulo anseia por ver Timóteo e o encoraja a não se envergonhar do Evangelho, mas a participar dos sofrimentos de Cristo.</li>
                            </ul>
                        `
                    }
                ]
            },
            "intro_author": {
                title: "SOBRE O AUTOR",
                date: null,
                desc: "\"Paulo, apóstolo de Jesus Cristo pela vontade de Deus...\"",
                blocks: [
                    {
                        title: "O Velho Soldado em Seu Último Combate",
                        verse: "Combati o bom combate, acabei a carreira, guardei a fé. (2 Tm 4:7)",
                        exegesis: `
                            <h3>1. O Contexto de Segunda Prisão</h3>
                            <ul>
                                <li>A Segunda Epístola a Timóteo foi escrita durante a segunda e mais severa prisão de Paulo em Roma. Diferente da primeira (Atos 28), onde ele tinha certa liberdade, agora Paulo estava em um calabouço escuro e frio, acorrentado como um criminoso (2 Tm 1:16; 2:9). Muitos de seus companheiros o abandonaram (2 Tm 1:15), e ele pedia a Timóteo que trouxesse consigo Marcos e seus livros e pergaminhos (2 Tm 4:11-13).</li>
                            </ul>

                            <h3>2. A Solidão do Mártir</h3>
                            <ul>
                                <li>A atmosfera da carta é de solidão e urgência. Paulo estava ciente de que sua execução era iminente. Ele usa a metáfora do "atleta" (<i>athlētēs</i> - <span class="ref">(ἀθλητής - Atleta)</span>), do "soldado" (<i>stratiōtēs</i> - <span class="ref">(στρατιώτης - Soldado)</span>) e do "lavrador" para descrever a dedicação e o sofrimento que ele suportou pelo evangelho. Sua vida era um exemplo vivo do que ele pregava.</li>
                            </ul>

                            <h3>3. Mentoria na Beira da Eternidade</h3>
                            <ul>
                                <li>Este é o último conselho de Paulo a seu discípulo amado Timóteo. Ele o encoraja a ser forte, a permanecer fiel ao depósito da fé (o evangelho), a suportar as dificuldades e a pregar a Palavra com autoridade e urgência, sabendo que os tempos seriam difíceis. É uma carta de mentoria intensa, escrita com a eternidade em vista, transmitindo não apenas doutrina, mas o coração de um servo de Deus fiel até o fim.</li>
                            </ul>
                        `
                    }
                ]
            },
            "2timoteo_1": {
                title: "CHAMADO À FIDELIDADE INABALÁVEL",
                date: "18/05 (Sábado)",
                desc: "\"Não te envergonhes, portanto, do testemunho de nosso Senhor, nem de mim, que sou seu prisioneiro.\"",
                blocks: [
                    {
                        title: "A Chama Inextinguível da Fé",
                        verse: "Por cujo motivo te lembro que reanimes o dom de Deus que há em ti pela imposição das minhas mãos. (2 Tm 1:6)",
                        exegesis: `
                            <h3>1. A Saudações e a Memória de uma Fé Genuína</h3>
                            <ul>
                                <li>Paulo abre a carta expressando seu amor e saudade por Timóteo, lembrando-se das suas lágrimas e da fé "não fingida" que residia nele, herdada de sua avó Lóide e sua mãe Eunice. Essa fé genuína (<i>anupokritos</i> - <span class="ref">(ἀνυπόκριτος - Sem hipocrisia)</span>) é o alicerce para a exortação que se segue. Paulo está, em essência, dizendo: "Você tem um bom fundamento, construa sobre ele."</li>
                            </ul>
                            
                            <h3>2. Reavivando o Dom e Superando o Medo</h3>
                            <ul>
                                <li>O apóstolo encoraja Timóteo a "reanimes o dom de Deus" (<i>anazōpyreō</i> - <span class="ref">(ἀναζωπυρέω - Reavivar uma brasa)</span>), uma metáfora para atiçar uma brasa que está perdendo o fogo. Timóteo, por sua natureza tímida (At 16:1-3) e as dificuldades da época, poderia estar deixando seu ministério esfriar. Paulo o lembra que Deus não nos deu um espírito de covardia ou temor (<i>deilia</i> - <span class="ref">(δειλία - Timidez, Covardia)</span>), mas de poder, amor e moderação (autodisciplina). A cura para o medo ministerial não é mais coragem natural, mas uma renovada dependência do poder de Deus.</li>
                            </ul>

                            <h3>3. Não Se Envergonhar, Mas Sofrer</h3>
                            <ul>
                                <li>O cerne do capítulo é o chamado à coragem diante do sofrimento. Paulo, um prisioneiro do Senhor, exorta Timóteo a não se envergonhar do testemunho de Cristo nem do próprio Paulo. Ele convida Timóteo a "participar das aflições do evangelho" (2 Tm 1:8). A salvação é um dom de Deus, não resultado de obras, mas exige que o crente esteja disposto a sofrer pela causa de Cristo. A fidelidade do crente é testada não na ausência de problemas, mas na perseverança através deles.</li>
                            </ul>
                        `
                    }
                ]
            },
            "2timoteo_2": {
                title: "O SOLDADO, O ATLETA E O LAVRADOR",
                date: "19/05 (Domingo)",
                desc: "\"Sofre comigo as aflições, como bom soldado de Jesus Cristo.\"",
                blocks: [
                    {
                        title: "Metáforas da Perseverança Ministerial",
                        verse: "Ninguém que milita se embaraça com negócios desta vida, a fim de agradar àquele que o alistou para a guerra. (2 Tm 2:4)",
                        exegesis: `
                            <h3>1. O Legado de Fidelidade e as Três Imagens</h3>
                            <ul>
                                <li>Paulo inicia o capítulo exortando Timóteo a fortalecer-se na graça de Cristo e a transmitir o que aprendeu a homens fiéis que, por sua vez, seriam capazes de ensinar outros (2 Tm 2:2). Esta é a essência da discipulado e reprodução da fé. Em seguida, ele apresenta três figuras vívidas para ilustrar a dedicação e o sacrifício necessários no ministério: o soldado, o atleta e o lavrador.</li>
                            </ul>
                            
                            <h3>2. O Soldado, o Atleta e o Lavrador de Cristo</h3>
                            <ul>
                                <li><strong>O Bom Soldado:</strong> Não se envolve com os negócios da vida civil (<i>pragmateiai</i> - <span class="ref">(πραγματεῖαι - Negócios seculares)</span>), mas foca em agradar aquele que o alistou. Ele enfrenta a batalha e não se distrai. Para Timóteo, isso significava evitar as contendas inúteis.</li>
                                <li><strong>O Atleta Competitivo:</strong> Luta de acordo com as regras (<i>nomimōs</i> - <span class="ref">(νομίμως - De acordo com as regras)</span>) para receber a coroa. A perseverança e a disciplina são cruciais, e não há atalhos ou trapaças no serviço de Deus.</li>
                                <li><strong>O Lavrador Diligente:</strong> Trabalha arduamente e é o primeiro a participar dos frutos. O ministério exige esforço constante e paciência, mas a recompensa virá no tempo certo.</li>
                            </ul>

                            <h3>3. Evitando Contendas e Sendo Vaso de Honra</h3>
                            <ul>
                                <li>Paulo adverte contra discussões tolas e sem proveito que só subvertem os ouvintes (2 Tm 2:14). Ele menciona Himeneu e Fileto, que se desviaram da verdade e diziam que a ressurreição já havia ocorrido, confundindo muitos. A tarefa de Timóteo era manejar bem a Palavra da verdade, ser um obreiro aprovado por Deus e "fugir das paixões da mocidade". Em vez disso, deve seguir a justiça, a fé, o amor e a paz, e ser um vaso de honra, santificado e útil para o Mestre.</li>
                            </ul>
                        `
                    }
                ]
            },
            "2timoteo_3": {
                title: "A BÍBLIA INSPIRADA E OS TEMPOS TRABALHOSOS",
                date: "20/05 (Segunda)",
                desc: "\"Toda a Escritura é divinamente inspirada e proveitosa para ensinar, para redarguir, para corrigir, para instruir em justiça.\"",
                blocks: [
                    {
                        title: "A Degradação dos Últimos Dias e a Suficiência da Escritura",
                        verse: "Sabe, porém, isto: que nos últimos dias sobrevirão tempos trabalhosos. (2 Tm 3:1)",
                        exegesis: `
                            <h3>1. A Descrição dos Tempos Finais</h3>
                            <ul>
                                <li>Paulo pinta um quadro sombrio dos "últimos dias", que já haviam começado com a vinda de Cristo e se estenderão até a Sua segunda vinda. Ele descreve uma sociedade caracterizada pelo egocentrismo ("amantes de si mesmos"), avareza, orgulho, irreverência, desobediência aos pais, ingratidão, impiedade, falta de afeto natural, irreconciliação, calúnia, falta de domínio próprio, crueldade, traição e mais. O auge é ter "aparência de piedade, mas negando-lhe o poder" (2 Tm 3:5), indicando uma religiosidade vazia e superficial. Timóteo é instruído a desviar-se de tais pessoas.</li>
                            </ul>
                            
                            <h3>2. O Poder da Escritura Inspirada</h3>
                            <ul>
                                <li>Em contraste com a depravação humana, Paulo aponta para a única âncora verdadeira: a Escritura. Ele declara que "Toda a Escritura é divinamente inspirada" (<i>theopneustos</i> - <span class="ref">(θεόπνευστος - Soprada por Deus)</span>). Isso significa que cada palavra foi "soprada" diretamente por Deus, não meramente inspirada no sentido humano, mas originada Nele. Essa inspiração garante sua autoridade e infalibilidade. A Escritura é não apenas inspirada, mas também "proveitosa" (<i>ōphelimos</i> - <span class="ref">(ὠφέλιμος - Útil, Proveitosa)</span>) para toda a vida do crente: para ensinar, para repreender, para corrigir e para instruir em justiça.</li>
                            </ul>

                            <h3>3. Preparando o Homem de Deus</h3>
                            <ul>
                                <li>A finalidade de uma Escritura tão poderosa é "para que o homem de Deus seja perfeito e perfeitamente instruído para toda boa obra" (2 Tm 3:17). A Bíblia é suficiente (sola Scriptura) para equipar o crente para qualquer desafio e para moldá-lo à imagem de Cristo. Diante de tempos perigosos e falsos mestres, a única defesa e fonte de verdade é a Palavra de Deus. Timóteo é lembrado de sua educação nas Sagradas Letras desde a infância, que o tornaram "sábio para a salvação pela fé em Cristo Jesus".</li>
                            </ul>
                        `
                    }
                ]
            },
            "2timoteo_4": {
                title: "PREGA A PALAVRA: O ENCARGO FINAL",
                date: "21/05 (Terça)",
                desc: "\"Conjuro-te, pois, diante de Deus, e do Senhor Jesus Cristo, que há de julgar os vivos e os mortos, na sua vinda e no seu Reino.\"",
                blocks: [
                    {
                        title: "A Urgência da Pregação e a Coroa da Justiça",
                        verse: "Prega a palavra, insta a tempo e fora de tempo, redargui, repreende, exorta, com toda longanimidade e doutrina. (2 Tm 4:2)",
                        exegesis: `
                            <h3>1. O Solene Encargo de Pregar a Palavra</h3>
                            <ul>
                                <li>Paulo entrega a Timóteo o que é, talvez, a mais solene e veemente exortação de toda a Bíblia para um ministro do Evangelho. Sob a autoridade de Deus e de Cristo, que julgará vivos e mortos, Timóteo é comissionado: "Prega a palavra" (<i>kērysson ton logon</i> - <span class="ref">(κήρυσσον τὸν λόγον - Proclama a palavra)</span>). A pregação deve ser urgente ("a tempo e fora de tempo"), abrangente (redarguir, repreender, exortar) e feita com paciência e boa doutrina. Paulo antecipa um tempo em que as pessoas não suportarão a sã doutrina, mas buscarão mestres que lhes digam o que querem ouvir.</li>
                            </ul>
                            
                            <h3>2. O Combate Final de Paulo</h3>
                            <ul>
                                <li>Em um tom pessoal e tocante, Paulo declara que sua vida está chegando ao fim. Ele usa as metáforas do "sacrifício" (<i>spendō</i> - <span class="ref">(σπένδω - Derramar como oferta)</span>) e do "atleta" que "combateu o bom combate, completou a corrida, guardou a fé" (2 Tm 4:7). Sua partida não é uma derrota, mas a conclusão vitoriosa de uma carreira. Ele está confiante de que a "coroa da justiça" o aguarda, reservada não apenas para ele, mas para todos os que amam a vinda de Cristo. Este é o testemunho final de um homem que viveu e morreu para o Evangelho.</li>
                            </ul>

                            <h3>3. Últimas Instruções e Despedidas</h3>
                            <ul>
                                <li>O capítulo termina com instruções práticas e despedidas emocionantes. Paulo pede que Timóteo venha rapidamente, trazendo consigo Marcos, Tíquico, e especialmente seus pergaminhos e livros, que eram cruciais para seu estudo na prisão. Ele menciona a solidão que sentia, com Demas o tendo abandonado, mas expressa gratidão a Onésiforo. Finalmente, ele envia saudações e conclui com uma oração pela graça de Jesus para Timóteo e a igreja, um final adequado para a última carta do grande apóstolo.</li>
                            </ul>
                        `
                    }
                ]
            }
        };

        // === LÓGICA GERAL ===
        let currentAudioBlob = null;
        let mediaRecorder;
        let audioChunks = [];

        function loadChapter(chapterKey) {
            const data = bibleData[chapterKey];
            if (!data) return;

            const heroTitle = document.getElementById('heroTitle');
            const heroDesc = document.getElementById('heroDesc');
            const dateBadge = document.getElementById('dateBadge');
            const dateValue = document.getElementById('dateValue');
            const communitySection = document.getElementById('community-section');
            const formChapterKey = document.getElementById('formChapterKey');
            
            heroTitle.style.opacity = '0';
            heroDesc.style.opacity = '0';
            dateBadge.style.opacity = '0';
            
            setTimeout(() => {
                if (data.date) {
                    dateValue.textContent = data.date;
                    dateBadge.classList.remove('hidden');
                    communitySection.classList.remove('hidden');
                    formChapterKey.value = chapterKey;
                    carregarComentarios(chapterKey);
                    setTimeout(() => { dateBadge.style.opacity = '1'; }, 100);
                } else {
                    dateBadge.classList.add('hidden');
                    communitySection.classList.add('hidden');
                }

                heroTitle.innerHTML = data.title;
                heroDesc.innerHTML = data.desc;
                heroTitle.style.opacity = '1';
                heroDesc.style.opacity = '1';
            }, 300);

            const mainContent = document.getElementById('content');
            mainContent.innerHTML = ''; 

            data.blocks.forEach((block) => {
                let borderColor = 'border-green-600';
                let blurTop = 'bg-green-600/5';
                let blurBottom = 'bg-green-800/5';
                let borderPanel = 'border-green-900/30';

                const html = `
                    <section class="reveal max-w-4xl mx-auto w-full relative">
                        <div class="absolute -inset-4 ${blurTop} to-transparent rounded-3xl blur-xl pointer-events-none"></div>
                        
                        <div class="space-y-6 relative z-10">
                            <div class="text-center mb-10">
                                <h2 class="text-3xl md:text-5xl font-serif text-white leading-tight mb-6">${block.title}</h2>
                                <div class="inline-block border-l-4 border-r-4 ${borderColor} px-6 py-4 italic text-slate-300 bg-[#0a0514]/50 shadow-sm max-w-3xl rounded-sm">
                                    "${block.verse}"
                                </div>
                            </div>
                            
                            <div class="bg-[#050510]/80 p-8 md:p-12 rounded-xl border ${borderPanel} transition shadow-2xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 ${blurTop} rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                                <div class="absolute bottom-0 left-0 w-64 h-64 ${blurBottom} rounded-full blur-3xl -ml-20 -mb-20 pointer-events-none"></div>
                                <div class="rich-text text-slate-300 text-[16px] md:text-lg leading-relaxed relative z-10 font-light">
                                    ${block.exegesis}
                                </div>
                            </div>
                        </div>
                    </section>
                `;
                mainContent.insertAdjacentHTML('beforeend', html);
            });
            resetObservers();
        }

        function carregarComentarios(capitulo) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<p class="text-center text-slate-500 text-sm animate-pulse">Carregando comentários...</p>';

            fetch(`api.php?acao=listar&capitulo=${capitulo}`)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                if(!Array.isArray(data)) { // CRÍTICO: Validação de Array
                    list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro: Dados de comentários inválidos.</p>';
                    console.error("Erro: Dados de comentários não são um array.", data);
                    return;
                }
                if(data.length === 0) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                data.forEach(c => {
                    let mediaHtml = '';
                    if(c.foto) mediaHtml += `<img src="${c.foto}" onclick="openImage(this.src)" class="mt-4 rounded-lg max-h-48 border border-slate-700 cursor-pointer hover:scale-[1.02] transition shadow-lg">`;
                    if(c.audio) mediaHtml += `<audio controls src="${c.audio}" class="mt-4 w-full"></audio>`;

                    const jaCurtiu = localStorage.getItem(`reagiu_likes_${c.id}`);
                    const jaAmem = localStorage.getItem(`reagiu_amem_${c.id}`);
                    const jaGloria = localStorage.getItem(`reagiu_gloria_${c.id}`);

                    let themeColor = 'text-green-400';
                    let panelBorder = 'hover:border-green-500/50';

                    const html = `
                        <div class="glass-panel p-5 pb-12 rounded-xl border border-slate-800 relative group transition ${panelBorder} bg-[#0a0514]/60">
                            <div class="flex justify-between items-start mb-3 border-b border-slate-800 pb-2">
                                <strong class="${themeColor} text-sm tracking-wide font-serif">${c.nome}</strong>
                                <span class="text-[10px] text-slate-500 uppercase tracking-widest">${new Date(c.data_envio).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <p class="text-slate-300 text-sm leading-relaxed">${c.mensagem}</p>
                            ${mediaHtml}
                            
                            <div class="absolute bottom-3 right-4 flex gap-2">
                                <button onclick="reagirComentario(${c.id}, 'likes', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaCurtiu ? 'text-red-500 border-red-500/30' : 'text-slate-400 hover:text-red-400'}" ${jaCurtiu ? 'disabled' : ''}>
                                    <i class="fa-solid fa-heart"></i> <span class="count font-bold">${c.likes || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'amem', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaAmem ? 'text-green-400 border-green-400/30' : 'text-slate-400 hover:text-green-400'}" ${jaAmem ? 'disabled' : ''}>
                                    <i class="fa-solid fa-hands-praying"></i> <span class="count font-bold">${c.amem || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'gloria', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaGloria ? 'text-blue-500 border-blue-500/30' : 'text-slate-400 hover:text-blue-500'}" ${jaGloria ? 'disabled' : ''}>
                                    <i class="fa-solid fa-fire"></i> <span class="count font-bold">${c.gloria || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(err => { // CRÍTICO: Tratamento de erros no fetch
                list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao carregar comentários. Por favor, tente novamente mais tarde.</p>';
                console.error("Falha ao carregar comentários:", err);
            });
        }

        function reagirComentario(id, tipo, btn) {
            if(localStorage.getItem(`reagiu_${tipo}_${id}`)) return;

            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.count');
            let count = parseInt(countSpan.innerText);

            icon.classList.add('reacted-anim');
            btn.classList.remove('text-slate-400');
            
            if(tipo === 'likes') btn.classList.add('text-red-500', 'border-red-500/30');
            if(tipo === 'amem') btn.classList.add('text-green-400', 'border-green-400/30');
            if(tipo === 'gloria') btn.classList.add('text-blue-500', 'border-blue-500/30');

            countSpan.innerText = count + 1;
            btn.disabled = true;

            localStorage.setItem(`reagiu_${tipo}_${id}`, 'true');

            const formData = new FormData();
            formData.append('acao', 'reagir');
            formData.append('id', id);
            formData.append('tipo', tipo);

            fetch('api.php', { method: 'POST', body: formData })
            .catch(err => { // CRÍTICO: Tratamento de erros no fetch
                console.error("Falha ao enviar reação:", err);
                // Opcional: Reverter o estado visual do botão ou notificar o usuário
            });
        }

        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append('acao', 'salvar');
            if(currentAudioBlob) {
                formData.append('audio', currentAudioBlob, 'audio.wav');
            }

            fetch('api.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.sucesso) {
                    this.reset();
                    document.getElementById('filePreview').innerHTML = '';
                    currentAudioBlob = null;
                    document.getElementById('recordText').innerText = "Gravar Áudio";
                    carregarComentarios(document.getElementById('formChapterKey').value);
                } else {
                    alert('Erro ao enviar comentário: ' + (data.mensagem || 'Resposta desconhecida da API.'));
                }
            })
            .catch(err => { // CRÍTICO: Tratamento de erros no fetch
                alert('Erro de conexão ao enviar comentário. Por favor, verifique sua rede.');
                console.error("Falha ao enviar comentário:", err);
            })
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        function previewFile(input) {
            const preview = document.getElementById('filePreview');
            if(input.files && input.files[0]) {
                preview.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Imagem selecionada: ${input.files[0].name}`;
                preview.classList.remove('hidden');
            }
        }

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        document.getElementById('filePreview').classList.remove('hidden');
                        document.getElementById('filePreview').innerHTML += '<br><i class="fa-solid fa-microphone text-green-400"></i> Áudio gravado!';
                    };
                    mediaRecorder.start();
                    recordBtn.classList.add('recording-pulse');
                    document.getElementById('recordText').innerText = "Parar Gravação";
                } catch (err) {
                    alert("Permita o uso do microfone para gravar áudio.");
                    console.error("Erro ao iniciar gravação de áudio:", err);
                }
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
                document.getElementById('recordText').innerText = "Gravar Áudio";
            }
        });

        function openImage(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImage() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function resetObservers() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, spcX: Math.random()*0.5-0.25, spcY: Math.random()*0.5-0.25 });
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(34, 197, 94, 0.15)"; /* Green-500 */
            particles.forEach(p => { p.x += p.spcX; p.y += p.spcY; if(p.x<0||p.x>canvas.width) p.spcX*=-1; if(p.y<0||p.y>canvas.height) p.spcY*=-1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        loadChapter('intro_book');
    </script>
</body>
</html>
