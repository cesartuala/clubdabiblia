    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Lato', 'sans-serif'] },

                        divine: { 400: '#fb7185' } /* Rose-400 */

    <style>
        body { background-color: #050510; color: #e2e8f0; overflow-x: hidden; }
        
        .glass-panel { background: rgba(10, 5, 25, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(251, 113, 133, 0.2); }
        .rose-glow { text-shadow: 0 0 15px rgba(251, 113, 133, 0.5); }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 1s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        .rich-text strong { color: #fecdd3; font-weight: 700; }
        .rich-text .ref { color: #fb7185; font-size: 0.9em; font-family: monospace; background: rgba(251, 113, 133, 0.15); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(251, 113, 133, 0.3); }
        .rich-text h3 { color: #fda4af; font-weight: bold; margin-top: 2rem; margin-bottom: 0.75rem; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 0.15em; border-bottom: 1px solid rgba(251, 113, 133, 0.3); padding-bottom: 6px; }
        .rich-text ul { list-style-type: none; padding-left: 0; margin-top: 15px; margin-bottom: 20px; }
        .rich-text li { margin-bottom: 15px; line-height: 1.8; text-align: justify; border-left: 3px solid #fb7185; padding-left: 20px; background: linear-gradient(to right, rgba(251, 113, 133, 0.05), transparent); padding-top: 5px; padding-bottom: 5px; }
        .rich-text p { margin-bottom: 20px; line-height: 2; text-align: justify; font-size: 1.05rem; color: #cbd5e1; }
        .rich-text blockquote { border-left: 4px solid #fb7185; padding-left: 20px; margin: 20px 0; font-style: italic; color: #fecdd3; background: rgba(251, 113, 133, 0.05); padding: 15px; border-radius: 0 8px 8px 0; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050510; }
        ::-webkit-scrollbar-thumb { background: #1e1b4b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #fb7185; }

        .recording-pulse { animation: recPulse 1.5s infinite; background-color: #ef4444; border-color: #ef4444; color: white; }
        @keyframes recPulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        @keyframes pop { 50% { transform: scale(1.4); } }
        .reacted-anim { animation: pop 0.3s ease-out; }
    </style>
</head>
<body class="font-sans antialiased">

    <canvas id="particles-js"></canvas>

    <nav class="fixed top-0 w-full z-50 p-4 md:p-6 flex flex-col md:flex-row justify-between items-center bg-gradient-to-b from-[#050510]/95 to-[#050510]/80 backdrop-blur-md border-b border-rose-950/40 transition-all">

            <div class="pt-10">

    <main id="content" class="max-w-4xl mx-auto px-4 py-10 md:py-20 space-y-20 md:space-y-32 min-h-screen"></main>

    <section id="community-section" class="w-full bg-[#07030f] border-t-4 border-rose-600 py-16 mb-0 relative shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
        <div class="max-w-4xl mx-auto px-4 relative z-10">
            <div class="text-center mb-12">
                <h3 class="font-serif text-3xl md:text-4xl text-rose-500 mb-2 uppercase tracking-widest rose-glow">
                    <i class="fa-solid fa-users-line mr-3"></i>Comunidade
                </h3>
                <p class="text-slate-400 text-sm italic">"Compartilhe o que Deus falou ao seu coração"</p>
                <div class="h-1 w-24 bg-gradient-to-r from-transparent via-rose-600 to-transparent mx-auto mt-4"></div>
            </div>

            <div class="glass-panel p-6 md:p-8 rounded-xl mb-12 border border-slate-800 shadow-2xl bg-[#0a0514]/80">
                <form id="commentForm" class="space-y-5">

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                        <div class="flex gap-3 col-span-1 md:col-span-2 items-end">
                            <label class="flex-1 cursor-pointer bg-black/50 border border-slate-700 hover:border-rose-500 hover:bg-[#110a24] rounded h-[50px] flex items-center justify-center gap-2 text-sm text-slate-300 transition group">
                                <i class="fa-solid fa-camera group-hover:text-rose-400"></i> Foto
                                <input type="file" name="foto" accept="image/*" class="hidden" onchange="previewFile(this)">
                            </label>
                            <button type="button" id="recordBtn" class="flex-1 bg-black/50 border border-slate-700 hover:border-red-500 hover:bg-[#110a24] rounded h-[50px] flex items-center justify-center gap-2 text-sm text-slate-300 transition group">
                                <i class="fa-solid fa-microphone group-hover:text-red-400"></i> <span id="recordText">Gravar Áudio</span>
                            </button>

                    </div>
                    <div id="filePreview" class="text-xs text-rose-400 hidden bg-black p-2 rounded border border-rose-500/30"></div>
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-slate-400 mb-1 block">Seu Comentário</label>
                        <textarea name="mensagem" class="w-full bg-black/80 border border-slate-700 rounded px-4 py-3 text-white focus:border-rose-500 focus:outline-none h-28 resize-none transition"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-rose-800 to-rose-600 hover:from-rose-600 hover:to-rose-500 text-white font-bold py-4 rounded-lg transition uppercase tracking-[0.2em] text-sm shadow-lg shadow-black/50 transform hover:-translate-y-1">
                        Publicar Comentário
                    </button>
                </form>
            </div>
            <div id="commentsList" class="space-y-6"></div>

    </section>

    <footer class="border-t border-slate-800 bg-black py-12 text-center relative z-10">

    <div id="imageModal" class="fixed inset-0 z-[100] bg-black/95 hidden flex justify-center items-center p-4 backdrop-blur-sm transition-opacity duration-300" onclick="closeImage()">
        <div class="relative max-w-4xl w-full flex justify-center">
            <button onclick="closeImage()" class="absolute -top-12 right-0 text-white text-3xl hover:text-rose-500 transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="modalImg" src="" class="max-h-[85vh] max-w-full rounded-lg shadow-[0_0_50px_rgba(251,113,133,0.3)] border-2 border-rose-500/20 object-contain">
        </div>
    </div>

    <script>
        const bibleData = {
            "intro_book": {
                title: "A CARTA A FILEMON",
                date: null,
                desc: "<span class='text-xs uppercase tracking-[0.3em] text-rose-400 not-italic block mb-4'>Introdução: Sobre o Livro</span>\"Uma obra-prima de graça, tato pastoral e o poder revolucionário do Evangelho na vida prática.\"",
                blocks: [
                    {
                        title: "A Revolução Silenciosa do Evangelho",
                        verse: "Sim, irmão, eu gostaria de receber de ti, no Senhor, este proveito; reanima o meu coração em Cristo. (Fm 1:20)",
                        exegesis: "CONCEITO E HISTÓRIA:" +
                            "<p>A Epístola a Filemon é a mais curta das cartas paulinas e a única de caráter estritamente pessoal preservada no cânon. Embora pareça um simples bilhete privado, ela carrega uma dinamite teológica e sociológica. Escrita durante o primeiro cativeiro de Paulo em Roma (cerca de 60-62 d.C.), ela não discute grandes teses abstratas, mas demonstra o Evangelho agindo na reconciliação de duas pessoas reais: um escravo fugitivo chamado Onésimo e seu mestre lesado, Filemon.</p>" +
                            "<h3>1. O Contexto do Império e a Escravidão</h3>" +
                            "<ul>" +
                            "<li>No Império Romano do primeiro século, a escravidão era a espinha dorsal da economia. Estima-se que até um terço da população de Roma e das grandes metrópoles era escravizada.</li>" +
                            "<li>Pela lei romana, o escravo não era uma pessoa jurídica, mas uma propriedade viva (<em>instrumentum vocale</em>). O senhor tinha poder de vida e morte (<em>jus vitae necisque</em>).</li>" +
                            "<li>Se um escravo fugisse (um <em>fugitivas</em>), ele era caçado e, quando capturado, podia ser crucificado, marcado na testa com a letra 'F' (de <em>Fugitivus</em>) ou enviado a trabalhos forçados letais. Era nesse cenário que Onésimo se encontrava.</li>" +
                            "</ul>" +
                            "<h3>2. O Poder da Parceria e Comunhão</h3>" +
                            "<ul>" +
                            "<li>Em vez de atacar a instituição política da escravidão diretamente — o que causaria uma insurreição armada violenta esmagada por Roma —, o Evangelho a implode por dentro ao mudar o coração dos homens.</li>" +
                            "<li>Ao exigir que Filemon receba Onésimo não mais como um escravo, mas como um irmão amado no Senhor, Paulo quebra a espinha dorsal da hierarquia social pagã, instituindo a verdadeira igualdade espiritual sob a paternidade divina.</li>" +
                            "</ul>"
                    }
                ]
            },
            "intro_author": {
                title: "SOBRE O AUTOR",
                date: null,
                desc: "\"Paulo, prisioneiro de Cristo Jesus, e o irmão Timóteo, ao amado Filemon, nosso companheiro de trabalho...\"",
                blocks: [
                    {
                        title: "O Apóstolo das Algemas e o Diplomata da Graça",
                        verse: "Todavia, prefiro rogar-te por amor, sendo eu como sou, Paulo, o velho, e agora até prisioneiro de Cristo Jesus... (Fm 1:9)",
                        exegesis: "O PERFIL DE PAULO NESSA CARTA:" +
                            "<p>Paulo escreve essa carta em um estado de vulnerabilidade física, mas com uma autoridade espiritual imensa. Ele se recusa a exigir a libertação de Onésimo usando o seu título oficial de Apóstolo, optando pelo caminho do amor voluntário.</p>" +
                            "<h3>1. A Humildade de um Prisioneiro</h3>" +
                            "<ul>" +
                            "<li>Ao se apresentar como 'prisioneiro de Cristo Jesus' em vez de 'Apóstolo por vontade de Deus', Paulo imediatamente se nivela em sofrimento com o escravo Onésimo. Suas correntes são o seu maior selo de autoridade moral.</li>" +
                            "<li>Ele apela ao coração generoso de Filemon, lembrando-lhe que o próprio Filemon deve a Paulo sua salvação e nascimento espiritual.</li>" +
                            "</ul>" +
                            "<h3>2. Um Exemplo de Mediação</h3>" +
                            "<ul>" +
                            "<li>Paulo age aqui como um tipo de 'paráclito' terreno, intercedendo junto ao credor (Filemon) em favor do devedor insolvente (Onésimo).</li>" +
                            "<li>Esse ato de intercessão e imputação de dívida ('se algum dano te fez... lança-o em minha conta') é o retrato perfeito da própria obra soteriológica de Cristo por nós na cruz.</li>" +
                            "</ul>"
                    }
                ]
            },
            "filemon_1": {
                title: "DA ESCRAVIDÃO À FRATERNIDADE",
                date: "28/05",
                desc: "\"Não já como servo, antes, mais do que servo, como irmão amado, particularmente de mim...\"",
                blocks: [
                    {
                        title: "Contexto e Exegese: O Resgate do Fugitivo",
                        verse: "Sim, irmão, que eu receba de ti este benefício no Senhor; reanima o meu coração (splagchna) em Cristo. (Fm 1:20)",
                        exegesis: "<h3>1. A Fuga de Colossos a Roma</h3>" +
                            "<p>Onésimo era escravo na casa de Filemon em Colossos. Ele fugira após roubar bens de seu senhor (v.18), uma ofensa gravíssima no Império Romano. Para se esconder de forma indetectável, ele viajou até Roma, a capital do Império, um destino típico de escravos em fuga por causa de sua densidade populacional. Ali, na soberana providência de Deus, Onésimo entrou em contato com Paulo, que estava sob prisão domiciliar, e foi poderosamente regenerado pelo Espírito Santo.</p>" +
                            "<h3>2. O Uso de Termos Originais Relevantes</h3>" +
                            "<ul>" +
                            "<li><strong><i>κοινωνία</i> - Koinonia - Comunhão/Parceria:</strong> Paulo usa esse termo para lembrar Filemon da comunhão indissolúvel que partilham na fé (v.6). A salvação faz do escravo e do mestre parceiros na mesma mesa da aliança.</li>" +
                            "<li><strong><i>σπλάγχνα</i> - Splagchna - Entranhas/Afeto Profundo:</strong> No grego antigo, as 'entranhas' correspondiam ao âmago das emoções, equivalente ao termo 'coração' para nós hoje. Paulo repete esse termo (v.7, 12, 20) para demonstrar que Onésimo se tornara parte de suas próprias entranhas espirituais e que Filemon deveria acolhê-lo com a mesma afeição profunda.</li>" +
                            "</ul>"
                    },
                    {
                        title: "Análise Teológica: A Imputação e o Evangelho Ilustrado",
                        verse: "E, se te fez algum dano, ou te deve alguma coisa, põe isso à minha conta. (Fm 1:18)",
                        exegesis: "<h3>1. O Mistério Teológico da Substituição</h3>" +
                            "<p>A epístola é um retrato vivo e prático da doutrina da <strong>Imputação</strong>. Assim como Cristo assumiu os nossos pecados na cruz e nos deu Sua justiça perfeita perante o Pai, Paulo escreve a Filemon dizendo: 'Se ele te deve algo, põe na minha conta' (v.18). Paulo assume a culpa jurídica e o prejuízo de Onésimo para que este seja aceito sem condenação.</p>" +
                            "<h3>2. O Trocadilho do Nome Útil</h3>" +
                            "<ul>" +
                            "<li>O nome de Onésimo significa literalmente 'Útil' ou 'Proveitoso'. Paulo faz um trocadilho espirituoso no verso 11: 'Ele, em outro tempo, te foi inútil, mas agora a ti e a mim nos é muito útil'.</li>" +
                            "<li>A conversão muda a própria utilidade prática do indivíduo. Sem Cristo, somos inúteis e destrutivos; sob a graça, tornamo-nos cooperadores e canais de bênção para a comunidade.</li>" +
                            "</ul>"
                    },
                    {
                        title: "Aplicação Prática: A Reconciliação sem Barreiras Sociais",
                        verse: "Para que o recebesse para sempre, não já como servo, antes, mais do que servo, como irmão amado... (Fm 1:15-16)",
                        exegesis: "<h3>1. A Demolição de Barreiras na Prática</h3>" +
                            "<p>A lição moral e ética de Filemon é de extrema urgência para a igreja contemporânea. Não há espaço no Reino de Deus para divisões de classe social, etnia, gênero ou passado criminal. Filemon deveria abraçar Onésimo publicamente diante de sua igreja local (que se reunia em sua casa) não como propriedade recuperada, mas como um irmão igual em dignidade.</p>" +
                            "<h3>2. Aplicação Pessoal Diária</h3>" +
                            "<ul>" +
                            "<li><strong>Perdão Radical:</strong> O perdão bíblico não é apenas um sentimento, mas um ato legal e relacional de cancelar dívidas reais e abrir mão do ressentimento.</li>" +
                            "<li><strong>Justiça Restaurativa:</strong> O arrependimento de Onésimo o levou a voltar para enfrentar seu mestre, demonstrando integridade e o desejo de reparação do erro, sob a cobertura protetora de seu pai na fé.</li>" +
                            "</ul>"
                    }
                ]
            }
        };

        // === LÓGICA GERAL ===
        let currentAudioBlob = null;
        let mediaRecorder;
        let audioChunks = [];

        function loadChapter(chapterKey) {
            const data = bibleData[chapterKey];
            if (!data) return;

            const heroTitle = document.getElementById('heroTitle');
            const heroDesc = document.getElementById('heroDesc');
            const dateBadge = document.getElementById('dateBadge');
            const dateValue = document.getElementById('dateValue');
            const communitySection = document.getElementById('community-section');
            const formChapterKey = document.getElementById('formChapterKey');
            
            heroTitle.style.opacity = '0';
            heroDesc.style.opacity = '0';
            dateBadge.style.opacity = '0';
            
            setTimeout(() => {
                if (data.date) {
                    dateValue.textContent = data.date;
                    dateBadge.classList.remove('hidden');
                    communitySection.classList.remove('hidden');
                    formChapterKey.value = chapterKey;
                    carregarComentarios(chapterKey);
                    setTimeout(() => { dateBadge.style.opacity = '1'; }, 100);
                } else {
                    dateBadge.classList.add('hidden');
                    communitySection.classList.add('hidden');
                }

                heroTitle.innerHTML = data.title;
                heroDesc.innerHTML = data.desc;
                heroTitle.style.opacity = '1';
                heroDesc.style.opacity = '1';
            }, 300);

            const mainContent = document.getElementById('content');
            mainContent.innerHTML = ''; 

            data.blocks.forEach((block) => {
                let borderColor = 'border-rose-600';
                let blurTop = 'bg-rose-600/5';
                let blurBottom = 'bg-rose-800/5';
                let borderPanel = 'border-rose-900/30';

                const html = `
                    <section class="reveal max-w-4xl mx-auto w-full relative">
                        <div class="absolute -inset-4 ${blurTop} to-transparent rounded-3xl blur-xl pointer-events-none"></div>
                        
                        <div class="space-y-6 relative z-10">
                            <div class="text-center mb-10">
                                <h2 class="text-3xl md:text-5xl font-serif text-white leading-tight mb-6">${block.title}</h2>
                                <div class="inline-block border-l-4 border-r-4 ${borderColor} px-6 py-4 italic text-slate-300 bg-[#0a0514]/50 shadow-sm max-w-3xl rounded-sm">
                                    "${block.verse}"
                                </div>
                            </div>
                            
                            <div class="bg-[#050510]/80 p-8 md:p-12 rounded-xl border ${borderPanel} transition shadow-2xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 ${blurTop} rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                                <div class="absolute bottom-0 left-0 w-64 h-64 ${blurBottom} rounded-full blur-3xl -ml-20 -mb-20 pointer-events-none"></div>
                                <div class="rich-text text-slate-300 text-[16px] md:text-lg leading-relaxed relative z-10 font-light">
                                    ${block.exegesis}
                                </div>
                            </div>
                        </div>
                    </section>
                `;
                mainContent.insertAdjacentHTML('beforeend', html);
            });
            resetObservers();
        }

        function carregarComentarios(capitulo) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<p class="text-center text-slate-500 text-sm animate-pulse">Carregando comentários...</p>';

            fetch(`api.php?acao=listar&capitulo=${capitulo}`)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                if(!Array.isArray(data)) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                if(data.length === 0) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                data.forEach(c => {
                    let mediaHtml = '';
                    if(c.foto) mediaHtml += `<img src="${c.foto}" onclick="openImage(this.src)" class="mt-4 rounded-lg max-h-48 border border-slate-700 cursor-pointer hover:scale-[1.02] transition shadow-lg">`;
                    if(c.audio) mediaHtml += `<audio controls src="${c.audio}" class="mt-4 w-full"></audio>`;

                    const jaCurtiu = localStorage.getItem(`reagiu_likes_${c.id}`);
                    const jaAmem = localStorage.getItem(`reagiu_amem_${c.id}`);
                    const jaGloria = localStorage.getItem(`reagiu_gloria_${c.id}`);

                    let themeColor = 'text-rose-400';
                    let panelBorder = 'hover:border-rose-500/50';

                    const html = `
                        <div class="glass-panel p-5 pb-12 rounded-xl border border-slate-800 relative group transition ${panelBorder} bg-[#0a0514]/60">
                            <div class="flex justify-between items-start mb-3 border-b border-slate-800 pb-2">
                                <strong class="${themeColor} text-sm tracking-wide font-serif">${c.nome}</strong>
                                <span class="text-[10px] text-slate-500 uppercase tracking-widest">${new Date(c.data_envio).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <p class="text-slate-300 text-sm leading-relaxed">${c.mensagem}</p>
                            ${mediaHtml}
                            
                            <div class="absolute bottom-3 right-4 flex gap-2">
                                <button onclick="reagirComentario(${c.id}, 'likes', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaCurtiu ? 'text-red-500 border-red-500/30' : 'text-slate-400 hover:text-red-400'}" ${jaCurtiu ? 'disabled' : ''}>
                                    <i class="fa-solid fa-heart"></i> <span class="count font-bold">${c.likes || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'amem', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaAmem ? 'text-rose-400 border-rose-400/30' : 'text-slate-400 hover:text-rose-400'}" ${jaAmem ? 'disabled' : ''}>
                                    <i class="fa-solid fa-hands-praying"></i> <span class="count font-bold">${c.amem || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'gloria', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaGloria ? 'text-amber-500 border-amber-500/30' : 'text-slate-400 hover:text-amber-500'}" ${jaGloria ? 'disabled' : ''}>
                                    <i class="fa-solid fa-fire"></i> <span class="count font-bold">${c.gloria || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(err => {
                list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao carregar comentários.</p>';
            });
        }

        function reagirComentario(id, tipo, btn) {
            if(localStorage.getItem(`reagiu_${tipo}_${id}`)) return;

            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.count');
            let count = parseInt(countSpan.innerText);

            icon.classList.add('reacted-anim');
            btn.classList.remove('text-slate-400');
            
            if(tipo === 'likes') btn.classList.add('text-red-500', 'border-red-500/30');
            if(tipo === 'amem') btn.classList.add('text-rose-400', 'border-rose-400/30');
            if(tipo === 'gloria') btn.classList.add('text-amber-500', 'border-amber-500/30');

            countSpan.innerText = count + 1;
            btn.disabled = true;

            localStorage.setItem(`reagiu_${tipo}_${id}`, 'true');

            const formData = new FormData();
            formData.append('acao', 'reagir');
            formData.append('id', id);
            formData.append('tipo', tipo);

            fetch('api.php', { method: 'POST', body: formData }).catch(err => console.error(err));
        }

        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append('acao', 'salvar');
            if(currentAudioBlob) {
                formData.append('audio', currentAudioBlob, 'audio.wav');
            }

            fetch('api.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.sucesso) {
                    this.reset();
                    document.getElementById('filePreview').innerHTML = '';
                    currentAudioBlob = null;
                    document.getElementById('recordText').innerText = "Gravar Áudio";
                    carregarComentarios(document.getElementById('formChapterKey').value);
                } else {
                    alert('Erro ao enviar.');
                }
            })
            .catch(() => alert('Erro de conexão.'))
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        function previewFile(input) {
            const preview = document.getElementById('filePreview');
            if(input.files && input.files[0]) {
                preview.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Imagem selecionada: ${input.files[0].name}`;
                preview.classList.remove('hidden');
            }
        }

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        document.getElementById('filePreview').classList.remove('hidden');
                        document.getElementById('filePreview').innerHTML += '<br><i class="fa-solid fa-microphone text-green-400"></i> Áudio gravado!';
                    };
                    mediaRecorder.start();
                    recordBtn.classList.add('recording-pulse');
                    document.getElementById('recordText').innerText = "Parar Gravação";
                } catch (err) {
                    alert("Permita o uso do microfone para gravar.");
                }
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
                document.getElementById('recordText').innerText = "Gravar Áudio";
            }
        });

        function openImage(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImage() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function resetObservers() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, spcX: Math.random()*0.5-0.25, spcY: Math.random()*0.5-0.25 });
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(251, 113, 133, 0.15)"; /* Rose-400 */
            particles.forEach(p => { p.x += p.spcX; p.y += p.spcY; if(p.x<0||p.x>canvas.width) p.spcX*=-1; if(p.y<0||p.y>canvas.height) p.spcY*=-1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        loadChapter('intro_book');
    </script>
</body>
</html>
