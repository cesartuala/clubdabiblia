                                <li>A carta enfatiza a importância de uma <strong>"sã doutrina"</strong> (<em>hygiainousa didaskalia - ὑγιαίνουσα διδασκαλία - ensino sadio</em>), que é apresentada não apenas como um conjunto de verdades teóricas, mas como um estilo de vida que se manifesta em boas obras. A teologia correta deve sempre levar a uma prática correta.</li>

                                <li>Em Tito, Paulo reforça que somos salvos pela graça (favor imerecido de Deus), e não pelas obras (Tito 3:5). No entanto, as boas obras são a evidência e o resultado da fé genuína. Elas "adornam" a doutrina e demonstram a transformação que Cristo opera no crente (Tito 2:10).</li>
                                <li>O livro serve como um manual prático para a vida cristã, tanto individual quanto comunitária, abordando diferentes grupos demográficos dentro da igreja: idosos, jovens, homens, mulheres, escravos e senhores, e sua conduta diante da sociedade.</li>

                                <li>Creta era famosa por sua reputação de imoralidade, mentira e preguiça. O próprio Paulo cita um profeta cretense que descreve seu povo como "mentirosos, feras ruins e ventres preguiçosos" (Tito 1:12). Neste ambiente desafiador, Tito precisava de sabedoria e coragem para edificar igrejas que fossem um testemunho vivo do poder transformador do Evangelho.</li>
                                <li>A carta de Tito é um lembrete atemporal da necessidade de integridade, liderança piedosa e um testemunho coerente, mesmo nas circunstâncias mais difíceis, para que a Igreja possa cumprir sua missão de fazer discípulos.</li>

                        `

                            <h3>1. Instruções para Diferentes Grupos Demográficos</h3>
                            <ul>
                                <li>O capítulo 2 é um manual prático de ética cristã, mostrando como a <strong>"sã doutrina"</strong> (<em>hygiainousa didaskalia - ὑγιαίνουσα διδασκαλία - ensino sadio</em>) deve se manifestar na vida cotidiana de diferentes grupos na igreja. Tito é instruído a ensinar os homens idosos a serem sóbrios, graves, prudentes, sadios na fé, no amor e na paciência. As mulheres idosas devem ser reverentes no seu viver, não caluniadoras, não dadas a muito vinho, mestras no bem.</li>
                                <li>As mulheres jovens devem ser ensinadas a amar seus maridos e filhos, a serem prudentes, castas, cuidadosas do lar, boas e sujeitas a seus maridos. Os jovens, por sua vez, devem ser exortados à moderação. Estas instruções detalhadas visam a construir um testemunho coletivo poderoso que "adornará" (<em>kosmeo - κοσμέω - decorar, embelezar</em>) a doutrina de Deus, tornando-a atraente para o mundo.</li>
                            </ul>
                            
                            <h3>2. A Graça Ensinadora e a Bendita Esperança</h3>
                            <ul>
                                <li>Os versículos 11-14 contêm um dos resumos mais concisos e poderosos do Evangelho em toda a Bíblia. Paulo afirma que a <strong>"graça"</strong> (<em>charis - χάρις - favor imerecido</em>) de Deus que traz salvação apareceu a todos os homens. E essa graça não apenas salva, mas também "nos ensina" (<em>paideuo - παιδεύω - educar, treinar</em>). Ela nos educa a rejeitar a impiedade e as paixões mundanas, e a viver de forma sensata, justa e piedosa neste mundo.</li>
                                <li>A motivação para essa vida transformada é a "bendita esperança" (<em>makarian elpida - μακαρίαν ἐλπίδα - feliz expectativa</em>) e a manifestação gloriosa do nosso grande Deus e Salvador Jesus Cristo. A certeza da Sua volta nos impulsiona à santidade e à expectativa alegre de Sua vinda.</li>
                            </ul>

                            <h3>3. O Propósito Redentor de Cristo</h3>
                            <ul>
                                <li>Paulo resume o propósito da vinda de Cristo: Ele "a si mesmo se deu por nós para nos remir de toda a iniquidade e purificar para si um povo seu especial, zeloso de boas obras" (versículo 14). A redenção de Cristo não é apenas para nos tirar do pecado, mas para nos capacitar e nos motivar a viver uma vida de boas obras. Somos um povo "especial" (<em>periousios - περιούσιος - peculiar, propriedade exclusiva</em>), adquirido por Deus para manifestar Sua glória através de uma conduta que reflete Seu caráter.</li>
                                <li>Tito é exortado a pregar essas verdades com autoridade e a exortar e repreender com toda a firmeza, para que ninguém o despreze. A autoridade de Tito não vem dele mesmo, mas da mensagem divina que ele proclama.</li>
                            </ul>
                        `
                    }
                ]
            },
            "tito_3": {
                title: "GRAÇA, BOAS OBRAS E AÇÕES CÍVICAS",
                date: "27/05 (Segunda)",
                desc: "\"Para que, justificados pela sua graça, fôssemos feitos herdeiros, segundo a esperança da vida eterna.\"",
                blocks: [
                    {
                        title: "De Renegados a Cidadãos do Reino e da Terra",
                        verse: "Para que, justificados pela sua graça, fôssemos feitos herdeiros, segundo a esperança da vida eterna. (Tito 3:7)",
                        exegesis: `
                            <h3>1. O Dever do Cristão como Cidadão</h3>
                            <ul>
                                <li>O capítulo 3 começa com uma exortação sobre a conduta do cristão na sociedade. Paulo instrui Tito a lembrar os crentes a estarem "sujeitos aos principados e potestades, a obedecerem aos magistrados e a estarem preparados para toda boa obra" (versículo 1). Isso é um contraponto direto à cultura cretense, que era conhecida por sua insubordinação. O crente deve ser um cidadão exemplar, não difamador, pacífico, moderado e demonstrando mansidão para com todos os homens.</li>
                                <li>Este trecho enfatiza que a vida cristã não é vivida isoladamente da sociedade, mas deve ser um testemunho positivo de respeito às autoridades civis, desde que estas não exijam desobediência a Deus.</li>
                            </ul>
                            
                            <h3>2. A Base da Nossa Transformação: O Amor e a Misericórdia de Deus</h3>
                            <ul>
                                <li>Paulo faz um contraste poderoso entre nossa condição passada e nossa salvação presente. Antes, éramos "néscios, desobedientes, transviados, servindo a várias concupiscências e deleites, vivendo em malícia e inveja, odiosos e odiando-nos uns aos outros" (versículo 3). Mas a virada ocorre com a manifestação da "bondade e amor de Deus, nosso Salvador, para com os homens" (versículo 4).</li>
                                <li>Nossa salvação não foi por obras de justiça que tivéssemos feito, mas "segundo a sua misericórdia, pelo lavar da <strong>regeneração</strong> (<em>palingenesia - παλιγγενεσία - novo nascimento</em>) e da renovação do Espírito Santo" (versículo 5). Fomos justificados por Sua graça e feitos herdeiros da vida eterna. Isso mostra que a fonte de nossa nova vida e de nossa capacidade de fazer o bem é totalmente divina, não humana. A <strong>"boas obras"</strong> (<em>kala erga - καλά ἔργα - boas ações</em>) são um resultado, não a causa da salvação.</li>
                            </ul>

                            <h3>3. A Fidelidade à Doutrina e o Tratamento aos Divisivos</h3>
                            <ul>
                                <li>Paulo reitera a importância de que Tito "afirme constantemente estas coisas" (versículo 8), garantindo que os que creem em Deus se dediquem a praticar boas obras. Essas coisas "são boas e proveitosas aos homens". Ele adverte contra "questões tolas, genealogias, contendas e debates sobre a lei", pois são inúteis e vãs.</li>
                                <li>Por fim, ele instrui sobre como lidar com o "homem faccioso" (<em>hairetikos - αἱρετικός - sectário, divisionista</em>): depois de uma primeira e segunda admoestação, se ele persistir, que se aparte dele (versículos 10-11). Isso demonstra a necessidade de proteger a unidade e a pureza doutrinária da igreja, não tolerando divisões persistentes que prejudicam o corpo de Cristo.</li>
                            </ul>
                        `
                    }
                ]
            }
        };

        // === LÓGICA GERAL ===
        let currentAudioBlob = null;
        let mediaRecorder;
        let audioChunks = [];

        function loadChapter(chapterKey) {
            const data = bibleData[chapterKey];
            if (!data) return;

            const heroTitle = document.getElementById('heroTitle');
            const heroDesc = document.getElementById('heroDesc');
            const dateBadge = document.getElementById('dateBadge');
            const dateValue = document.getElementById('dateValue');
            const communitySection = document.getElementById('community-section');
            const formChapterKey = document.getElementById('formChapterKey');
            
            heroTitle.style.opacity = '0';
            heroDesc.style.opacity = '0';
            dateBadge.style.opacity = '0';
            
            setTimeout(() => {
                if (data.date) {
                    dateValue.textContent = data.date;
                    dateBadge.classList.remove('hidden');
                    communitySection.classList.remove('hidden');
                    formChapterKey.value = chapterKey;
                    carregarComentarios(chapterKey);
                    setTimeout(() => { dateBadge.style.opacity = '1'; }, 100);
                } else {
                    dateBadge.classList.add('hidden');
                    communitySection.classList.add('hidden');
                }

                heroTitle.innerHTML = data.title;
                heroDesc.innerHTML = data.desc;
                heroTitle.style.opacity = '1';
                heroDesc.style.opacity = '1';
            }, 300);

            const mainContent = document.getElementById('content');
            mainContent.innerHTML = ''; 

            data.blocks.forEach((block) => {
                let borderColor = 'border-lime-600';
                let blurTop = 'bg-lime-600/5';
                let blurBottom = 'bg-lime-800/5';
                let borderPanel = 'border-lime-900/30';

                const html = `
                    <section class="reveal max-w-4xl mx-auto w-full relative">
                        <div class="absolute -inset-4 ${blurTop} to-transparent rounded-3xl blur-xl pointer-events-none"></div>
                        
                        <div class="space-y-6 relative z-10">
                            <div class="text-center mb-10">
                                <h2 class="text-3xl md:text-5xl font-serif text-white leading-tight mb-6">${block.title}</h2>
                                <div class="inline-block border-l-4 border-r-4 ${borderColor} px-6 py-4 italic text-slate-300 bg-[#0a0514]/50 shadow-sm max-w-3xl rounded-sm">
                                    "${block.verse}"
                                </div>
                            </div>
                            
                            <div class="bg-[#050510]/80 p-8 md:p-12 rounded-xl border ${borderPanel} transition shadow-2xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 ${blurTop} rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                                <div class="absolute bottom-0 left-0 w-64 h-64 ${blurBottom} rounded-full blur-3xl -ml-20 -mb-20 pointer-events-none"></div>
                                <div class="rich-text text-slate-300 text-[16px] md:text-lg leading-relaxed relative z-10 font-light">
                                    ${block.exegesis}
                                </div>
                            </div>
                        </div>
                    </section>
                `;
                mainContent.insertAdjacentHTML('beforeend', html);
            });
            resetObservers();
        }

        function carregarComentarios(capitulo) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<p class="text-center text-slate-500 text-sm animate-pulse">Carregando comentários...</p>';

            fetch(`api.php?acao=listar&capitulo=${capitulo}`)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                if(!Array.isArray(data)) { // Programação Defensiva: Valida se 'data' é um array
                    console.error("Dados de comentário não são um array:", data);
                    list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao carregar comentários: formato inválido.</p>';
                    return;
                }
                
                if(data.length === 0) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                data.forEach(c => {
                    let mediaHtml = '';
                    if(c.foto) mediaHtml += `<img src="${c.foto}" onclick="openImage(this.src)" class="mt-4 rounded-lg max-h-48 border border-slate-700 cursor-pointer hover:scale-[1.02] transition shadow-lg">`;
                    if(c.audio) mediaHtml += `<audio controls src="${c.audio}" class="mt-4 w-full"></audio>`;

                    const jaCurtiu = localStorage.getItem(`reagiu_likes_${c.id}`);
                    const jaAmem = localStorage.getItem(`reagiu_amem_${c.id}`);
                    const jaGloria = localStorage.getItem(`reagiu_gloria_${c.id}`);

                    let themeColor = 'text-lime-400';
                    let panelBorder = 'hover:border-lime-500/50';

                    const html = `
                        <div class="glass-panel p-5 pb-12 rounded-xl border border-slate-800 relative group transition ${panelBorder} bg-[#0a0514]/60">
                            <div class="flex justify-between items-start mb-3 border-b border-slate-800 pb-2">
                                <strong class="${themeColor} text-sm tracking-wide font-serif">${c.nome}</strong>
                                <span class="text-[10px] text-slate-500 uppercase tracking-widest">${new Date(c.data_envio).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <p class="text-slate-300 text-sm leading-relaxed">${c.mensagem}</p>
                            ${mediaHtml}
                            
                            <div class="absolute bottom-3 right-4 flex gap-2">
                                <button onclick="reagirComentario(${c.id}, 'likes', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaCurtiu ? 'text-red-500 border-red-500/30' : 'text-slate-400 hover:text-red-400'}" ${jaCurtiu ? 'disabled' : ''}>
                                    <i class="fa-solid fa-heart"></i> <span class="count font-bold">${c.likes || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'amem', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaAmem ? 'text-lime-400 border-lime-400/30' : 'text-slate-400 hover:text-lime-400'}" ${jaAmem ? 'disabled' : ''}>
                                    <i class="fa-solid fa-hands-praying"></i> <span class="count font-bold">${c.amem || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'gloria', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaGloria ? 'text-blue-500 border-blue-500/30' : 'text-slate-400 hover:text-blue-500'}" ${jaGloria ? 'disabled' : ''}>
                                    <i class="fa-solid fa-fire"></i> <span class="count font-bold">${c.gloria || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(err => {
                console.error("Erro ao carregar comentários:", err);
                list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao carregar comentários. Tente novamente mais tarde.</p>';
            });
        }

        function reagirComentario(id, tipo, btn) {
            if(localStorage.getItem(`reagiu_${tipo}_${id}`)) return;

            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.count');
            let count = parseInt(countSpan.innerText);

            icon.classList.add('reacted-anim');
            btn.classList.remove('text-slate-400');
            
            if(tipo === 'likes') btn.classList.add('text-red-500', 'border-red-500/30');
            if(tipo === 'amem') btn.classList.add('text-lime-400', 'border-lime-400/30');
            if(tipo === 'gloria') btn.classList.add('text-blue-500', 'border-blue-500/30');

            countSpan.innerText = count + 1;
            btn.disabled = true;

            localStorage.setItem(`reagiu_${tipo}_${id}`, 'true');

            const formData = new FormData();
            formData.append('acao', 'reagir');
            formData.append('id', id);
            formData.append('tipo', tipo);

            fetch('api.php', { method: 'POST', body: formData })
            .catch(err => {
                console.error("Erro ao reagir ao comentário:", err);
                alert('Erro ao registrar reação. Verifique sua conexão.');
                // Reverter UI se a reação falhar na API (opcional, para uma experiência mais robusta)
                countSpan.innerText = count;
                btn.disabled = false;
                btn.classList.add('text-slate-400');
                if(tipo === 'likes') btn.classList.remove('text-red-500', 'border-red-500/30');
                if(tipo === 'amem') btn.classList.remove('text-lime-400', 'border-lime-400/30');
                if(tipo === 'gloria') btn.classList.remove('text-blue-500', 'border-blue-500/30');
                localStorage.removeItem(`reagiu_${tipo}_${id}`);
            });
        }

        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append('acao', 'salvar');
            if(currentAudioBlob) {
                formData.append('audio', currentAudioBlob, 'audio.wav');
            }

            fetch('api.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.sucesso) {
                    this.reset();
                    document.getElementById('filePreview').innerHTML = '';
                    document.getElementById('filePreview').classList.add('hidden');
                    currentAudioBlob = null;
                    document.getElementById('recordText').innerText = "Gravar Áudio";
                    document.getElementById('recordBtn').classList.remove('recording-pulse');
                    carregarComentarios(document.getElementById('formChapterKey').value);
                } else {
                    alert('Erro ao enviar comentário: ' + (data.mensagem || 'Verifique os dados e tente novamente.'));
                }
            })
            .catch(err => {
                console.error("Erro de conexão ao enviar comentário:", err);
                alert('Erro de conexão ao enviar comentário. Tente novamente.');
            })
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        function previewFile(input) {
            const preview = document.getElementById('filePreview');
            if(input.files && input.files[0]) {
                preview.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Imagem selecionada: ${input.files[0].name}`;
                preview.classList.remove('hidden');
            } else {
                preview.innerHTML = '';
                preview.classList.add('hidden');
            }
        }

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        document.getElementById('filePreview').classList.remove('hidden');
                        document.getElementById('filePreview').innerHTML += '<br><i class="fa-solid fa-microphone text-green-400"></i> Áudio gravado!';
                    };
                    mediaRecorder.start();
                    recordBtn.classList.add('recording-pulse');
                    document.getElementById('recordText').innerText = "Parar Gravação";
                } catch (err) {
                    console.error("Erro ao acessar o microfone:", err);
                    alert("Permita o uso do microfone para gravar áudio.");
                }
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
                document.getElementById('recordText').innerText = "Gravar Áudio";
            }
        });

        function openImage(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImage() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function resetObservers() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, spcX: Math.random()*0.5-0.25, spcY: Math.random()*0.5-0.25 });
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(132, 204, 22, 0.15)"; /* Lime */
            particles.forEach(p => { p.x += p.spcX; p.y += p.spcY; if(p.x<0||p.x>canvas.width) p.spcX*=-1; if(p.y<0||p.y>canvas.height) p.spcY*=-1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        loadChapter('intro_book');
    </script>
</body>
</html>
