        .rich-text li { margin-bottom: 15px; line-height: 1.8; text-align: justify; border-left: 3px solid #a855f7; padding-left: 20px; background: linear-gradient(to right, rgba(147, 51, 234, 0.05), transparent); padding-top: 5px; padding-bottom: 5px; }

                        Publicar Comentário

    <script>
        const bibleData = {
            "intro_book": {
                title: "A EPÍSTOLA AOS HEBREUS",
                date: null,
                desc: "<span class='text-xs uppercase tracking-[0.3em] text-purple-400 not-italic block mb-4'>Introdução: Sobre o Livro</span>\"Olhando firmemente para Jesus, o Autor e Consumador da nossa fé.\"",
                blocks: [
                    {
                        title: "A Supremacia Absoluta de Cristo",
                        verse: "Havendo Deus, outrora, falado, muitas vezes e de muitas maneiras, aos pais, pelos profetas, nestes últimos dias, nos falou pelo Filho. (Hb 1:1-2)",
                        exegesis: `
                            <p>A Epístola aos Hebreus é uma das obras teológicas mais profundas e majestosas de todo o Novo Testamento. Ela funciona como uma ponte indispensável entre o Antigo Pacto e o Novo Pacto, demonstrando de forma irrefutável como todos os rituais, sacrifícios, sacerdotes e estruturas da antiga aliança judaica eram apenas sombras que apontavam para a realidade perfeita em Jesus Cristo. O tema central que ecoa por toda a epístola é a palavra <strong>\"Superior\"</strong> ou <strong>\"Melhor\"</strong>.</p>
                            
                            <h3>1. Contexto Histórico e Crise</h3>
                            <p>Os destinatários originais eram cristãos de origem judaica (hebreus) que enfrentavam severa perseguição social, financeira e religiosa por sua fé em Jesus. Diante do sofrimento, muitos estavam tentados a retroceder e apostatar, retornando ao conforto seguro do judaísmo tradicional com seus rituais visíveis e aceitos pelo Império Romano. Para combater essa tentação cósmica, o autor escreve uma poderosa exortação teológica demonstrando que abandonar Jesus para voltar à Lei é o equivalente a trocar a realidade por uma sombra passageira.</p>
                            
                            <h3>2. Rigor Linguístico e Teológico</h3>
                            <p>O texto de Hebreus exibe o grego mais refinado e literário de todo o Novo Testamento. Nele encontramos termos indispensáveis para a compreensão do plano da salvação, como os conceitos de (<i>ἀρχιερεύς</i> - Archieréus - Sumo Sacerdote) e (<i>διαθήκη</i> - Diathēkē - Aliança ou Testamento), que mostram a substituição definitiva e superior de Jesus.</p>

                            <h3>3. A Aplicação Prática Original</h3>
                            <p>A epístola serve como um convite constante à perseverança. O autor não discute apenas conceitos intelectuais; ele clama para que seus leitores avancem em direção à maturidade, resistam ao desânimo e permaneçam firmes no sacrifício definitivo de Cristo, sabendo que as perdas temporárias na terra não se comparam à herança eterna nos céus.</p>
                        `
                    }
                ]
            },
            "intro_author": {
                title: "SOBRE O AUTOR",
                date: null,
                desc: "\"O mistério da autoria e a perfeição da mensagem divina.\"",
                blocks: [
                    {
                        title: "Um Mistério que Pertence a Deus",
                        verse: "Quem escreveu a epístola, em verdade, só Deus sabe. (Orígenes, Pai da Igreja, séc. III)",
                        exegesis: `
                            <p>Ao contrário da maioria das cartas do Novo Testamento, a Epístola aos Hebreus é totalmente anônima. Ela não começa com a saudação típica que traz o nome do remetente. Esse mistério histórico gerou debates teológicos fascinantes ao longo dos séculos.</p>

                            <h3>1. Principais Teorias de Autoria</h3>
                            <ul>
                                <li><strong>Paulo de Tarso:</strong> Tradicionalmente associado à carta devido a referências no final (como a menção a Timóteo). No entanto, o estilo grego de Hebreus é polido e acadêmico demais se comparado às cartas paulinas conhecidas, e o autor se coloca como alguém que recebeu a mensagem em segunda mão de testemunhas oculares (Hb 2:3), algo que Paulo sempre rejeitou fazer (Gl 1:11-12).</li>
                                <li><strong>Apolo de Alexandria:</strong> Defendido por Martinho Lutero. Apolo era um homem eloquente, judeu de nascimento, profundamente versado nas Escrituras e instruído em Alexandria (capital do pensamento filosófico judeu). Esta hipótese explica perfeitamente a elegância do grego e o método exegético usado na carta.</li>
                                <li><strong>Barnabé ou Lucas:</strong> Barnabé, por ser levita, teria profundo conhecimento dos rituais do templo; Lucas, por sua escrita polida e proximidade com Paulo, também é um candidato plausível.</li>
                            </ul>

                            <h3>2. Autoridade Apostólica e Inspiração</h3>
                            <p>Independentemente da mão humana que segurou a pena, a igreja primitiva reconheceu a autoria do Espírito Santo de forma unânime. O autor demonstra ser um verdadeiro (<i>ἀπόστολος</i> - Apóstolos - Enviado) em sua autoridade bíblica e precisão profética. A carta define Jesus Cristo como a própria (<i>ὑπόστασις</i> - Hypóstasis - Essência ou Substância) de Deus Pai, validando a plena divindade do Filho.</p>

                            <h3>3. O Propósito Sobrenatural</h3>
                            <p>O anonimato humano de Hebreus acaba por destacar o seu principal protagonista: a voz do próprio Deus Pai falando através do Filho. Sem a distração de focar em um autor específico, o leitor é diretamente conduzido a contemplar unicamente o Sumo Sacerdote Eterno que intercede por nós continuamente.</p>
                        `
                    }
                ]
            },
            "hebreus_1": {
                title: "O FILHO SUPERIOR AOS ANJOS",
                date: "29/05 (Sexta)",
                desc: "\"Ele é o resplendor da glória de Deus e a expressão exata do seu Ser...\"",
                blocks: [
                    {
                        title: "Contexto e Exegese: A Revelação Final",
                        verse: "Havendo Deus, outrora, falado... pelos profetas, nestes últimos dias, nos falou pelo Filho. (Hb 1:1-2)",
                        exegesis: `
                            <p>Hebreus começa com um prólogo de tirar o fôlego. O autor contrasta a revelação fragmentada e progressiva dada no Antigo Testamento por meio de visões e profetas, com a revelação definitiva, perfeita e personificada dada na pessoa de Jesus Cristo. Na mentalidade judaica do primeiro século, os anjos eram tidos em altíssima consideração por terem sido os mediadores da entrega da Lei no Sinai. O autor desconstrói imediatamente qualquer idolatria angélica ao provar biblicamente que o Filho é infinitamente superior aos seres celestes.</p>
                        `
                    },
                    {
                        title: "Análise Teológica: Divindade e Realeza",
                        verse: "Mas, acerca do Filho, diz: O teu trono, ó Deus, subsiste pelos séculos dos séculos. (Hb 1:8)",
                        exegesis: `
                            <p>O autor utiliza uma sucessão magistral de citações dos Salmos para fundamentar a divindade de Cristo. Jesus não é apenas um anjo exaltado ou um mestre moral; Ele é Deus Criador adorado pelos próprios anjos. Ele é descrito como o (<i>χαρακτήρ</i> - Charaktēr - Expressão exata ou Selo) do próprio ser do Pai. Enquanto os anjos são seres criados chamados de espíritos (<i>λειτουργικός</i> - Leitourgikós - Ministradores ou Servidores), o Filho possui um trono soberano que dura para sempre.</p>
                        `
                    },
                    {
                        title: "Aplicação Prática: Escutando a Voz do Filho",
                        verse: "Sustentando todas as coisas pela palavra do seu poder... assentou-se à direita da Majestade, nas alturas. (Hb 1:3)",
                        exegesis: `
                            <p>Se o Filho é a revelação final e suprema de Deus, a nossa atitude diante de Sua Palavra deve ser de profunda reverência e obediência. Não precisamos mais buscar revelações esotéricas, místicas ou aparições de anjos para nos guiar. Em Cristo Jesus temos a plenitude da vontade do Pai revelada. Devemos alinhar nossas decisões diárias sob o senhorio daquele que sustenta o cosmos com o poder de Sua Palavra.</p>
                        `
                    }
                ]
            },
            "hebreus_2": {
                title: "A HUMANIDADE DO SALVADOR",
                date: "31/05 (Domingo)",
                desc: "\"Convinha que, em todas as coisas, se tornasse semelhante aos irmãos...\"",
                blocks: [
                    {
                        title: "Contexto e Exegese: O Perigo da Deriva",
                        verse: "Por esta razão, importa que nos apeguemos, com mais firmeza, às verdades ouvidas, para que delas jamais nos desviemos. (Hb 2:1)",
                        exegesis: `
                            <p>Após demonstrar a divindade cósmica de Cristo no capítulo 1, o autor faz a primeira advertência prática da carta. Ele alerta os leitores contra o perigo da negligência espiritual, usando a metáfora de um barco que se desvia lentamente de seu curso devido à apatia dos marinheiros. O autor então desenvolve a teologia da encarnação: a salvação perfeita exigia que o Salvador não fosse apenas Deus, mas também homem, participando da nossa carne e sangue para nos resgatar.</p>
                        `
                    },
                    {
                        title: "Análise Teológica: A Encarnação e a Vitória sobre a Morte",
                        verse: "Para que, por sua morte, destruísse aquele que tem o poder da morte, a saber, o diabo. (Hb 2:14)",
                        exegesis: `
                            <p>A teologia da expiação em Hebreus exige a solidariedade de Cristo com a humanidade. Ele precisava se tornar homem para sofrer e morrer em nosso lugar. A palavra para a nossa redenção é (<i>σωτηρία</i> - Sōtēria - Salvação), que é conquistada e selada por Aquele que nos chama de irmãos e nos conduz à glória. Jesus precisava (<i>ἁγιάζω</i> - Hagiázō - Santificar) a Si mesmo e aos Seus seguidores através do sofrimento voluntário para neutralizar o império da morte estabelecido pelo pecado.</p>
                        `
                    },
                    {
                        title: "Aplicação Prática: Consolo na Tentação",
                        verse: "Pois, naquilo que ele mesmo sofreu, tendo sido tentado, é poderoso para socorrer os que são tentados. (Hb 2:18)",
                        exegesis: `
                            <p>Saber que o nosso Rei Soberano se tornou homem e experimentou as mesmas dores, limites, cansaço e tentações que nós enfrentamos traz um consolo inigualável. Quando você clama por socorro, não está falando com um Deus distante e apático, mas com um irmão mais velho que compreende perfeitamente a sua fraqueza. Podemos descansar na empatia de Jesus em nossas horas mais escuras.</p>
                        `
                    }
                ]
            },
            "hebreus_3": {
                title: "SUPERIOR A MOISÉS",
                date: "02/06 (Terça)",
                desc: "\"Considerai o Apóstolo e Sumo Sacerdote da nossa confissão, Jesus...\"",

                    {
                        title: "Análise Teológica: O Sacrifício Espiritual Superior",
                        verse: "Por meio de Jesus, pois, ofereçamos a Deus, sempre, sacrifício de louvor, que é o fruto de lábios que confessam o seu nome. (Hb 13:15)",
                        exegesis: `
                            <p>Na Nova Aliança, o fim dos sacrifícios de animais não significa a abolição total das ofertas voluntárias a Deus. Nossos sacrifícios agora são espirituais: a prática constante da (<i>φιλαδελφία</i> - Philadelphía - Amor Fraternal ou Amizade de Irmão) e a entrega sincera de nossa (<i>θυσía</i> - Thysía - Sacrifício ou Oferta de Devoção) expressa por meio de ações de graças, louvores genuínos dos lábios e generosidade material.</p>
                        `
                    },
                    {
                        title: "Aplicação Prática: Permanecendo no Cristo Imutável",
                        verse: "Jesus Cristo é o mesmo ontem, e hoje, e eternamente. (Hb 13:8)",
                        exegesis: `
                            <p>Vivemos em uma época de profundas e rápidas transformações culturais, políticas, morais e tecnológicas que geram enorme insegurança na alma humana. Mas temos uma rocha inabalável sob os nossos pés: Jesus Cristo não muda, Seu amor é constante, Suas promessas são fiéis e Sua salvação é indestrutível. Descanse a sua vida e o seu futuro na estabilidade perfeita dEle.</p>
                        `
                    }
                ]
            }
        };

        // === LÓGICA GERAL ===
        let currentAudioBlob = null;
        let mediaRecorder;
        let audioChunks = [];

        function loadChapter(chapterKey) {
            const data = bibleData[chapterKey];
            if (!data) return;

            const heroTitle = document.getElementById('heroTitle');
            const heroDesc = document.getElementById('heroDesc');
            const dateBadge = document.getElementById('dateBadge');
            const dateValue = document.getElementById('dateValue');
            const communitySection = document.getElementById('community-section');
            const formChapterKey = document.getElementById('formChapterKey');
            
            heroTitle.style.opacity = '0';
            heroDesc.style.opacity = '0';
            dateBadge.style.opacity = '0';
            
            setTimeout(() => {
                if (data.date) {
                    dateValue.textContent = data.date;
                    dateBadge.classList.remove('hidden');
                    communitySection.classList.remove('hidden');
                    formChapterKey.value = chapterKey;
                    carregarComentarios(chapterKey);
                    setTimeout(() => { dateBadge.style.opacity = '1'; }, 100);
                } else {
                    dateBadge.classList.add('hidden');
                    communitySection.classList.add('hidden');
                }

                heroTitle.innerHTML = data.title;
                heroDesc.innerHTML = data.desc;
                heroTitle.style.opacity = '1';
                heroDesc.style.opacity = '1';
            }, 300);

            const mainContent = document.getElementById('content');
            mainContent.innerHTML = ''; 

            data.blocks.forEach((block) => {
                let borderColor = 'border-purple-600';
                let blurTop = 'bg-purple-600/5';
                let blurBottom = 'bg-purple-800/5';
                let borderPanel = 'border-purple-900/30';

                const html = `
                    <section class="reveal max-w-4xl mx-auto w-full relative">
                        <div class="absolute -inset-4 ${blurTop} to-transparent rounded-3xl blur-xl pointer-events-none"></div>
                        
                        <div class="space-y-6 relative z-10">
                            <div class="text-center mb-10">
                                <h2 class="text-3xl md:text-5xl font-serif text-white leading-tight mb-6">${block.title}</h2>
                                <div class="inline-block border-l-4 border-r-4 ${borderColor} px-6 py-4 italic text-slate-300 bg-[#0e071c]/50 shadow-sm max-w-3xl rounded-sm">
                                    "${block.verse}"
                                </div>
                            </div>
                            
                            <div class="bg-[#05020c]/80 p-8 md:p-12 rounded-xl border ${borderPanel} transition shadow-2xl relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-64 h-64 ${blurTop} rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                                <div class="absolute bottom-0 left-0 w-64 h-64 ${blurBottom} rounded-full blur-3xl -ml-20 -mb-20 pointer-events-none"></div>
                                <div class="rich-text text-slate-300 text-[16px] md:text-lg leading-relaxed relative z-10 font-light">
                                    ${block.exegesis}
                                </div>
                            </div>
                        </div>
                    </section>
                `;
                mainContent.insertAdjacentHTML('beforeend', html);
            });
            resetObservers();
        }

        function carregarComentarios(capitulo) {
            const list = document.getElementById('commentsList');
            list.innerHTML = '<p class="text-center text-slate-500 text-sm animate-pulse">Carregando comentários...</p>';

            fetch(`api.php?acao=listar&capitulo=${capitulo}`)
            .then(res => res.json())
            .then(data => {
                list.innerHTML = '';
                if(!Array.isArray(data)) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                if(data.length === 0) {
                    list.innerHTML = '<p class="text-center text-slate-500 text-sm">Seja o primeiro a comentar!</p>';
                    return;
                }
                data.forEach(c => {
                    let mediaHtml = '';
                    if(c.foto) mediaHtml += `<img src="${c.foto}" onclick="openImage(this.src)" class="mt-4 rounded-lg max-h-48 border border-slate-700 cursor-pointer hover:scale-[1.02] transition shadow-lg">`;
                    if(c.audio) mediaHtml += `<audio controls src="${c.audio}" class="mt-4 w-full"></audio>`;

                    const jaCurtiu = localStorage.getItem(`reagiu_likes_${c.id}`);
                    const jaAmem = localStorage.getItem(`reagiu_amem_${c.id}`);
                    const jaGloria = localStorage.getItem(`reagiu_gloria_${c.id}`);

                    let themeColor = 'text-purple-400';
                    let panelBorder = 'hover:border-purple-500/50';

                    const html = `
                        <div class="glass-panel p-5 pb-12 rounded-xl border border-slate-800 relative group transition ${panelBorder} bg-[#0e071c]/60">
                            <div class="flex justify-between items-start mb-3 border-b border-slate-800 pb-2">
                                <strong class="${themeColor} text-sm tracking-wide font-serif">${c.nome}</strong>
                                <span class="text-[10px] text-slate-500 uppercase tracking-widest">${new Date(c.data_envio).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <p class="text-slate-300 text-sm leading-relaxed">${c.mensagem}</p>
                            ${mediaHtml}
                            
                            <div class="absolute bottom-3 right-4 flex gap-2">
                                <button onclick="reagirComentario(${c.id}, 'likes', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaCurtiu ? 'text-red-500 border-red-500/30' : 'text-slate-400 hover:text-red-400'}" ${jaCurtiu ? 'disabled' : ''}>
                                    <i class="fa-solid fa-heart"></i> <span class="count font-bold">${c.likes || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'amem', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaAmem ? 'text-purple-400 border-purple-400/30' : 'text-slate-400 hover:text-purple-400'}" ${jaAmem ? 'disabled' : ''}>
                                    <i class="fa-solid fa-hands-praying"></i> <span class="count font-bold">${c.amem || 0}</span>
                                </button>
                                <button onclick="reagirComentario(${c.id}, 'gloria', this)" class="text-xs transition flex items-center gap-1 bg-black/80 px-2 py-1 rounded-full border border-slate-700 ${jaGloria ? 'text-blue-500 border-blue-500/30' : 'text-slate-400 hover:text-blue-500'}" ${jaGloria ? 'disabled' : ''}>
                                    <i class="fa-solid fa-fire"></i> <span class="count font-bold">${c.gloria || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', html);
                });
            })
            .catch(err => {
                list.innerHTML = '<p class="text-center text-red-400 text-xs">Erro ao carregar comentários.</p>';
            });
        }

        function reagirComentario(id, tipo, btn) {
            if(localStorage.getItem(`reagiu_${tipo}_${id}`)) return;

            const icon = btn.querySelector('i');
            const countSpan = btn.querySelector('.count');
            let count = parseInt(countSpan.innerText);

            icon.classList.add('reacted-anim');
            btn.classList.remove('text-slate-400');
            
            if(tipo === 'likes') btn.classList.add('text-red-500', 'border-red-500/30');
            if(tipo === 'amem') btn.classList.add('text-purple-400', 'border-purple-400/30');
            if(tipo === 'gloria') btn.classList.add('text-blue-500', 'border-blue-500/30');

            countSpan.innerText = count + 1;
            btn.disabled = true;

            localStorage.setItem(`reagiu_${tipo}_${id}`, 'true');

            const formData = new FormData();
            formData.append('acao', 'reagir');
            formData.append('id', id);
            formData.append('tipo', tipo);

            fetch('api.php', { method: 'POST', body: formData });
        }

        document.getElementById('commentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            const formData = new FormData(this);
            formData.append('acao', 'salvar');
            if(currentAudioBlob) {
                formData.append('audio', currentAudioBlob, 'audio.wav');
            }

            fetch('api.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.sucesso) {
                    this.reset();
                    document.getElementById('filePreview').innerHTML = '';
                    currentAudioBlob = null;
                    document.getElementById('recordText').innerText = "Gravar Áudio";
                    carregarComentarios(document.getElementById('formChapterKey').value);
                } else {
                    alert('Erro ao enviar.');
                }
            })
            .catch(() => alert('Erro de conexão.'))
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        function previewFile(input) {
            const preview = document.getElementById('filePreview');
            if(input.files && input.files[0]) {
                preview.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> Imagem selecionada: ${input.files[0].name}`;
                preview.classList.remove('hidden');
            }
        }

        const recordBtn = document.getElementById('recordBtn');
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        currentAudioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        document.getElementById('filePreview').classList.remove('hidden');
                        document.getElementById('filePreview').innerHTML += '<br><i class="fa-solid fa-microphone text-green-400"></i> Áudio gravado!';
                    };
                    mediaRecorder.start();
                    recordBtn.classList.add('recording-pulse');
                    document.getElementById('recordText').innerText = "Parar Gravação";
                } catch (err) {
                    alert("Permita o uso do microfone para gravar.");
                }
            } else {
                mediaRecorder.stop();
                recordBtn.classList.remove('recording-pulse');
                document.getElementById('recordText').innerText = "Gravar Áudio";
            }
        });

        function openImage(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeImage() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        function resetObservers() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        const canvas = document.getElementById("particles-js");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let particles = [];
        for(let i=0; i<80; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, spcX: Math.random()*0.5-0.25, spcY: Math.random()*0.5-0.25 });
        function animateParticles() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "rgba(147, 51, 234, 0.15)"; /* Púrpura */
            particles.forEach(p => { p.x += p.spcX; p.y += p.spcY; if(p.x<0||p.x>canvas.width) p.spcX*=-1; if(p.y<0||p.y>canvas.height) p.spcY*=-1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        loadChapter('intro_book');
    </script>
</body>
</html>
